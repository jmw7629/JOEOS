schema: ROADMAP_SCHEMA_V1
campaign: joeos-autonomous-build
title: "JOEOS autonomous build campaign"
description: >
  Durable autonomous engineering campaign that completes the missing
  orchestration glue around the existing agent fabric and keeps the ai-rebuild
  branch green. Each package is implemented in an isolated worktree, verified by
  the bounded validation battery, security-reviewed, and integrated with a
  fast-forward-only merge behind the integration gate.
work_packages:
  - key: campaign-domain
    title: "Campaign orchestration domain"
    description: >
      EngineeringCampaign, WorkPackage, EngineeringAttempt and checkpoint state
      machine with roadmap queue, watchdog heartbeats, blockers, and the
      campaign status API.
    owner_agent_key: engineering.architect
    verifier_agent_key: engineering.verification
    review_agent_key: engineering.securityreviewer
    order: 1
    priority: 10
    risk: low
    dependencies: []
    acceptance_criteria:
      - "Campaign state machine transitions are authority-checked."
      - "Campaign survives a backend restart and resumes from the latest checkpoint."
      - "Every campaign mutation is recorded in the audit log."
    stage_order:
      - eligibility
      - plan
      - worktree
      - implement
      - validate
      - review
      - commit
      - integrate
      - push
      - complete
  - key: role-profiles
    title: "Eight engineering role profiles"
    description: >
      Register the Engineering Director, Architect, Builder, Verification, Apple
      Build, Security Reviewer, Release and Watchdog agents in the existing
      immutable agent registry.
    owner_agent_key: engineering.director
    verifier_agent_key: engineering.verification
    review_agent_key: engineering.securityreviewer
    order: 2
    priority: 20
    risk: low
    dependencies: [campaign-domain]
    acceptance_criteria:
      - "All eight roles exist with immutable versions and correct tool grants."
      - "No role holds broader capability than its mandate."
    stage_order:
      - eligibility
      - plan
      - worktree
      - implement
      - validate
      - review
      - commit
      - integrate
      - push
      - complete
  - key: autonomy-policy
    title: "Versioned autonomy policy"
    description: >
      The joeos.engineering.ai-rebuild.v1 policy binds the campaign to local
      providers, the eight roles, protected branches, the origin remote,
      worktree isolation and ff-only integration.
    owner_agent_key: engineering.securityreviewer
    verifier_agent_key: engineering.verification
    review_agent_key: engineering.securityreviewer
    order: 3
    priority: 30
    risk: low
    dependencies: [campaign-domain]
    acceptance_criteria:
      - "Policy rejects provider/model/limits outside its bounds."
      - "Policy is deny-by-default and registered in the catalog."
    stage_order:
      - eligibility
      - plan
      - worktree
      - implement
      - validate
      - review
      - commit
      - integrate
      - push
      - complete
  - key: worktree-isolation
    title: "Worktree isolation and repo tools"
    description: >
      Bounded git worktree create/list/remove, ff-integrate and repo tool
      operations available through the runner executor catalog.
    owner_agent_key: engineering.builder
    verifier_agent_key: engineering.verification
    review_agent_key: engineering.securityreviewer
    order: 4
    priority: 40
    risk: medium
    dependencies: [campaign-domain]
    acceptance_criteria:
      - "Protected branches can never be mutated by a worktree operation."
      - "Secret scan blocks any worktree commit or integrate."
    stage_order:
      - eligibility
      - plan
      - worktree
      - implement
      - validate
      - review
      - commit
      - integrate
      - push
      - complete
  - key: apple-build-executor
    title: "Mac build-host executor"
    description: >
      Registered joeos.apple.build executor reusing the P3F-A rsync + xcodebuild
      Mac build-host setup with typed allowlisted operations.
    owner_agent_key: engineering.applebuild
    verifier_agent_key: engineering.verification
    review_agent_key: engineering.securityreviewer
    order: 5
    priority: 50
    risk: medium
    dependencies: [campaign-domain]
    acceptance_criteria:
      - "Only allowlisted operations are accepted; anything else is denied."
      - "No shell tokens pass from parameters into ssh/rsync arguments."
    stage_order:
      - eligibility
      - plan
      - worktree
      - implement
      - validate
      - review
      - commit
      - integrate
      - push
      - complete
  - key: integration-gate
    title: "Integration gate"
    description: >
      Before any push the gate verifies a clean tree, HEAD on the integration
      branch, passing validation battery, and no open blockers.
    owner_agent_key: engineering.release
    verifier_agent_key: engineering.verification
    review_agent_key: engineering.securityreviewer
    order: 6
    priority: 60
    risk: medium
    dependencies: [campaign-domain, worktree-isolation]
    acceptance_criteria:
      - "Gate blocks push when uncommitted changes exist or HEAD is off-branch."
      - "Gate refuses to fabricate success when any check is unmeasured."
    stage_order:
      - eligibility
      - plan
      - worktree
      - implement
      - validate
      - review
      - commit
      - integrate
      - push
      - complete
  - key: engineering-director
    title: "Engineering Director orchestration"
    description: >
      Auto-select next dependency-ready work, dispatch stages to the
      Architect/Builder/Verifier/Security role agents, run the bounded
      Builder-Verifier repair loop, raise human gates, and notify Joe.
    owner_agent_key: engineering.director
    verifier_agent_key: engineering.verification
    review_agent_key: engineering.securityreviewer
    order: 7
    priority: 10
    risk: low
    dependencies: [campaign-domain, role-profiles, autonomy-policy, worktree-isolation]
    acceptance_criteria:
      - "Queued packages whose dependencies are satisfied auto-promote to eligible."
      - "A verifier rejection routes back to the Builder for a bounded repair attempt."
      - "A security BLOCK raises a durable blocker and stops that package."
      - "The worker principal cannot escalate autonomy or resolve blockers."
      - "A campaign auto-completes when all packages are terminal."
    stage_order:
      - eligibility
      - plan
      - worktree
      - implement
      - validate
      - review
      - commit
      - integrate
      - push
      - complete
  - key: build-command-center
    title: "Build Command Center UI"
    description: >
      Mobile-usable /os/build surface showing campaign status, current work,
      next packages, open blockers, and controls (continue, pause, stop after
      current, autonomy level).
    owner_agent_key: engineering.builder
    verifier_agent_key: engineering.verification
    review_agent_key: engineering.securityreviewer
    order: 8
    priority: 20
    risk: low
    dependencies: [engineering-director]
    acceptance_criteria:
      - "Campaign status and next work render from authoritative campaign state."
      - "Continue/pause/stop-after-current/autonomy controls work end-to-end."
    stage_order:
      - eligibility
      - plan
      - worktree
      - implement
      - validate
      - review
      - commit
      - integrate
      - push
      - complete
