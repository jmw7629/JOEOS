      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      gap: 10px;
    }

    .palette-item:hover,
    .palette-item:focus-visible,
    .palette-item.active {
      background: rgba(49, 215, 255, .08);
      color: #e1f6ff;
    }

    .palette-caption {
      padding: 6px 10px 4px;
      color: var(--color-text-muted);
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .palette-risk {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      flex: 0 0 auto;
    }
    .palette-risk.security {
      color: var(--color-status-security);
      border: 1px solid rgba(167, 139, 250, .4);
    }
    .palette-risk.destructive {
      color: var(--color-status-critical);
      border: 1px solid rgba(255, 59, 92, .45);
    }
    html[data-contrast="high"] .palette-item.active,
    html[data-contrast="high"] .palette-item:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 1px;
    }

    .palette-item > span:first-of-type {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: rgba(49, 215, 255, .07);
      color: var(--cyan);
    }

    .palette-copy {
      min-width: 0;
      flex: 1;
    }

    .palette-copy strong,
    .palette-copy small {
      display: block;
    }

    .palette-copy strong { font-size: 11px; }
    .palette-copy small { margin-top: 3px; color: var(--faint); font-size: 8px; }

    .palette-shortcut {
      color: var(--faint);
      font-family: monospace;
      font-size: 8px;
    }

    .toast {
      position: fixed;
      z-index: 220;
      right: 22px;
      bottom: 22px;
      display: flex;
      max-width: min(380px, calc(100vw - 28px));
      min-height: 50px;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid rgba(61, 227, 164, .22);
      border-radius: 13px;
      background: rgba(8, 27, 39, .97);
      box-shadow: 0 18px 60px rgba(0, 3, 10, .55);
      color: #cce8dc;
      font-size: 9px;
      line-height: 1.45;
      animation: toastIn .3s var(--ease);
      gap: 10px;
    }

    .toast i {
      color: var(--success);
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(.88); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-6px) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    @keyframes logIn {
      from { opacity: 0; background: rgba(49, 215, 255, .08); }
      to { opacity: 1; background: transparent; }
    }

    @keyframes assistantIn {
      from { opacity: 0; transform: translateX(18px) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes thinking {
      0%, 60%, 100% { opacity: .35; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }

            var content = logs.slice().reverse().map(function (entry) { return entry.time + " " + entry.level.toUpperCase() + " [" + entry.source + "] " + entry.message; }).join("\n");
            var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            var url = window.URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = "joeos-local-events-" + new Date().toISOString().slice(0, 10) + ".log";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.setTimeout(function () { window.URL.revokeObjectURL(url); }, 0);
            notify("Security evidence export prepared.");
          } catch (error) {
            notify("Evidence export is unavailable in this browser.");
          }
        }

        async function runAssistant(command) {
          var clean = String(command || "").trim();
          if (!clean || thinkingRef.current) return;
          thinkingRef.current = true;
          var controller = new AbortController();
          assistantAbortRef.current = controller;
          var userMessage = { id: "msg-" + messageIdRef.current++, role: "user", text: clean };
          setMessages(function (current) { return current.concat([userMessage]).slice(-30); });
          setAssistantInput("");
          setThinking(true);
          try {
            var payload = await requestJson("/api/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                message: clean,
                context: {
                  active_section: active,
                  history: messages.slice(-10).map(function (message) { return { role: message.role, text: message.text }; })
                }
              }),
              timeoutMs: 120000,
              signal: controller.signal
            });
            var reply = payload && (payload.reply || payload.response || payload.message);
            if (!reply) throw new Error("The assistant returned an empty response.");
            setMessages(function (current) { return current.concat([{ id: "msg-" + messageIdRef.current++, role: "assistant", text: String(reply) }]).slice(-30); });
          } catch (error) {
            if (error && error.name === "AbortError") {
              setMessages(function (current) { return current.concat([{ id: "msg-" + messageIdRef.current++, role: "assistant", text: "Generation stopped by the operator." }]).slice(-30); });
            } else {
              setMessages(function (current) { return current.concat([{ id: "msg-" + messageIdRef.current++, role: "assistant", text: "I couldn’t complete that local request: " + error.message }]).slice(-30); });
            }
          } finally {
            thinkingRef.current = false;
            assistantAbortRef.current = null;
            setThinking(false);
          }
        }

        function cancelAssistant() {
          if (assistantAbortRef.current) {
            assistantAbortRef.current.abort();
          } else {
            setThinking(false);
            thinkingRef.current = false;
          }
        }

        function submitAssistant(event) {
          event.preventDefault();
          runAssistant(assistantInput);
        }

        function generateBrief() {
          setAssistantOpen(true);
          runAssistant("Summarize platform health");
        }

        function refreshFleet() {
          refreshRemoteData(true);
        }

        function askFromMission(command) {
          setAssistantOpen(true);
          runAssistant(command);
        }

        var activeItem = NAV_ITEMS.find(function (item) { return item.id === active; }) || NAV_ITEMS[0];
        var unread = notifications.filter(function (notification) { return notification.unread; }).length;
        var banners = [];
        if (securityOverview && securityOverview.lockdown_active) {
          banners.push({ id: "lockdown", tone: "security", icon: "fa-lock", text: "Lockdown is active — privileged operations are blocked until reauthentication.", action: function () { selectSection("security-center"); }, actionLabel: "Open Security Center" });
        }
        if (!runtime || !runtime.online) {
          banners.push({ id: "offline", tone: "warning", icon: "fa-plug-circle-xmark", text: "Lemonade Server is offline — local AI and model telemetry are unavailable.", action: function () { selectSection("dashboard"); }, actionLabel: "View dashboard" });
        }
        if (performanceSettings && (performanceSettings.low_power_mode || performanceSettings.metered_network)) {
          banners.push({ id: "low-resource", tone: "info", icon: "fa-battery-quarter", text: "Low-resource mode is active — background work is reduced and visual effects are flattened." });
        }
        if (performanceOverview && performanceOverview.disk_pressure && performanceOverview.disk_pressure.pressure === "critical") {
          banners.push({ id: "disk-critical", tone: "warning", icon: "fa-hard-drive", text: "Disk space is critically low — safe caches trimmed, uploads blocked.", action: function () { selectSection("performance"); }, actionLabel: "Open Performance Center" });
        }
        var paletteCommands = NAV_ITEMS.map(function (item) {
          return { id: "nav-" + item.id, label: "Open " + item.label, detail: "Navigate to the " + item.short + " workspace", icon: item.icon, category: "Navigation", run: function () { selectSection(item.id); } };
        }).concat([
          { id: "customize", label: "Customize Mission Control", detail: "Change fonts, colors, density, radius, and glass", icon: "fa-palette", shortcut: "C", category: "Commands", run: function () { selectSection("mission"); setCustomizerOpen(true); } },
          { id: "widgets", label: "Add a widget", detail: "Open the versioned module catalog", icon: "fa-table-cells-large", shortcut: "W", category: "Commands", run: function () { selectSection("mission"); setCatalogOpen(true); } },
          { id: "edit", label: "Edit workspace layout", detail: "Drag, move, resize, or hide Mission Control modules", icon: "fa-pen-ruler", shortcut: "E", category: "Commands", run: function () { selectSection("mission"); setEditingLayout(true); } },
          { id: "assistant", label: "Ask JoeOS AI", detail: "Open the private read-only Lemonade assistant", icon: "fa-wand-magic-sparkles", shortcut: "⇧⌘K", category: "Commands", run: function () { setAssistantOpen(true); } },
          { id: "settings", label: "Open Settings", detail: "Appearance, accessibility, and interface behavior", icon: "fa-sliders", shortcut: "Ctrl+,", category: "Navigation", run: function () { selectSection("settings"); } },
          { id: "shortcuts", label: "Open keyboard shortcuts", detail: "View the registered shortcut registry", icon: "fa-keyboard", shortcut: "?", category: "Help", run: function () { setShortcutsOpen(true); } },
          { id: "refresh", label: "Refresh Halo state", detail: "Reload telemetry, profiles, and local events", icon: "fa-rotate", category: "Commands", run: function () { refreshRemoteData(true); } },
          { id: "stop", label: "Stop current operation", detail: "Cancel the active AI generation", icon: "fa-stop", shortcut: "Esc", category: "Commands", run: function () { cancelAssistant(); } },
          { id: "focus-content", label: "Focus main content", detail: "Move keyboard focus to the primary workspace", icon: "fa-up-right-and-down-left-from-center", category: "Commands", run: function () { var node = document.getElementById("main-content"); if (node) { node.setAttribute("tabindex", "-1"); node.focus(); } } },
          { id: "lockdown", label: "Open Security Center", detail: "Reach Lockdown and Emergency Stop", icon: "fa-shield-halved", risk: "security", category: "Security", run: function () { selectSection("security-center"); } }
        ]);

        var section = null;
        if (active === "mission") {
          section = h(MissionControlSection, { workspace: workspace, catalog: catalog, metrics: metrics, runtime: runtime, security: security, bots: bots, logs: logs, saving: workspaceSaving, error: workspaceError, editing: editingLayout, dragging: draggingWidget, dropTarget: dropTarget, onAdd: function () { setCatalogOpen(true); }, onEdit: toggleLayoutEditing, onCustomize: function () { setCustomizerOpen(true); }, onConfigure: openConfigurationGuide, onAsk: askFromMission, onMove: moveWorkspaceWidget, onResize: resizeWorkspaceWidget, onHide: hideWorkspaceWidget, onDragStart: beginWidgetDrag, onDragOver: overWidgetDrag, onDrop: dropWidget, onDragEnd: endWidgetDrag });
        } else if (active === "dashboard") {
          section = h(DashboardSection, { metrics: metrics, uptimeSeconds: uptimeSeconds, lastUpdated: lastUpdated, runtime: runtime, onBrief: generateBrief });
        } else if (active === "pipeline") {
          section = h(PipelineSection, { runs: runs, commits: commits, filter: pipelineFilter, onFilter: setPipelineFilter, onRun: runPipeline });
        } else if (active === "infrastructure") {
          section = h(InfrastructureSection, { nodes: nodes, onInspect: setSelectedNode, onRefresh: refreshFleet });
        } else if (active === "security") {
          section = h(SecuritySection, { security: security, logs: logs, streamStatus: streamStatus, paused: logsPaused, logFilter: logFilter, onLogFilter: setLogFilter, onPause: toggleLogs, onClear: clearVisibleLogs, onExport: exportLogs, logRef: logRef });
        } else if (active === "plugins") {
          section = h(PluginsSection, { plugins: plugins, safeMode: pluginSafeMode, onInspect: setSelectedPlugin });
        } else if (active === "automation") {
          section = h(AutomationSection, { workflows: workflows, overview: automationOverview, onInspect: setSelectedPlugin });
        } else if (active === "communications") {
          section = h(CommunicationsSection, { notifications: notifications, overview: communicationsOverview });
        } else if (active === "wearables") {
          section = h(WearablesSection, { devices: wearableDevices, onInspect: setSelectedPlugin });
        } else if (active === "mobile") {
          section = h(MobileSection, { clients: mobileClients, overview: mobileOverview, onInspect: setSelectedPlugin });
        } else if (active === "security-center") {
          section = h(SecurityCenterSection, { overview: securityOverview, events: securityEvents });
        } else if (active === "performance") {
          section = h(PerformanceSection, { overview: performanceOverview, resources: performanceResources, queues: performanceQueues, caches: performanceCaches, models: performanceModels, leaks: performanceLeaks, benchmarks: performanceBenchmarks, budgets: performanceBudgets, regressions: performanceRegressions, traces: performanceTraces, settings: performanceSettings });
        } else if (active === "ai") {
          section = h(AiSection, { overview: aiOverview, interpretations: aiInterpretations });
        } else if (active === "production") {
          section = h(ProductionSection, { status: productionStatus, build: productionBuild, backups: productionBackups, migrations: productionMigrations, recovery: productionRecovery });
        } else if (active === "selfmaintenance") {
          section = h(SelfMaintenanceSection, { state: selfmaintenanceState });
        } else if (active === "settings") {
          section = h(SettingsSection, { prefs: uiPrefs, onChange: updateUiPrefs, onShortcuts: function () { setShortcutsOpen(true); }, version: "2.0.0", performanceSettings: performanceSettings });
        } else {
          section = h(BotsSection, { bots: bots, pending: pendingBots, onToggle: toggleBot, onDeploy: function () { setDeployOpen(true); } });
        }

        return h(
          React.Fragment,
          null,
          h("a", { className: "skip-link", href: "#main-content", onFocus: function () {}, onKeyDown: function (event) { if (event.key === "Enter") { var node = document.getElementById("main-content"); if (node) { node.setAttribute("tabindex", "-1"); node.focus(); } } } }, "Skip to main content"),
          h(
            "div",
            { className: "app-shell" },
            h(DesktopSidebar, { active: active, onSelect: selectSection, runtime: runtime }),
            h(
              "div",
              { className: "main-shell " + (assistantOpen ? "ai-open" : "") },
            h(
              "header",
              { className: "topbar" },
              h(
                "div",
                { className: "topbar-left" },
                h("button", { type: "button", className: "icon-button mobile-menu-button", ref: menuButtonRef, onClick: openMobile, "aria-label": "Open navigation menu", "aria-expanded": mobileOpen, "aria-controls": "mobile-navigation" }, icon("fa-bars-staggered")),
                h("div", { className: "breadcrumb" }, h("small", null, "JoeOS / Halo Operations"), h("strong", null, activeItem.label))
              ),
              h(
                "div",
                { className: "topbar-right" },
                h("button", { type: "button", className: "icon-button", onClick: function () { setPaletteOpen(true); }, "aria-label": "Open command palette", title: "Command palette · Command K" }, icon("fa-magnifying-glass")),
                h("div", { className: "global-status " + runtimeTone(runtime), title: runtime.message || runtimeLabel(runtime), "aria-label": runtimeLabel(runtime) }, h("span", { className: "live-dot " + runtimeTone(runtime) }), runtimeLabel(runtime)),
                h("time", { className: "topbar-clock", dateTime: now.toISOString() }, clockTime(now)),
                h(
                  "div",
                  { className: "notification-wrap" },
                  h("button", { type: "button", className: "icon-button", onClick: function () { setNotificationsOpen(!notificationsOpen); }, "aria-label": unread ? unread + " unread notifications" : "Notifications", "aria-expanded": notificationsOpen }, icon("fa-bell"), unread ? h("span", { className: "notification-count" }, unread) : null),
                  notificationsOpen ? h(
                    "div",
                    { className: "notification-panel" },
                    h("div", { className: "notification-header" }, h("strong", null, "Operational notices"), h("button", { type: "button", className: "text-button", onClick: function () { setNotifications(notifications.map(function (item) { return Object.assign({}, item, { unread: false }); })); } }, "Mark all read")),
                    notifications.map(function (notification) {
                      return h("div", { className: "notification-item " + (notification.unread ? "unread" : ""), key: notification.id }, icon(notification.icon), h("div", null, h("strong", null, notification.title), h("p", null, notification.text), h("time", null, notification.time)));
                    })
                  ) : null
                ),
                h("button", { type: "button", className: "assistant-top-button", onClick: function () { setAssistantOpen(true); }, "aria-label": "Open JoeOS AI assistant" }, icon("fa-wand-magic-sparkles"), h("span", null, "Ask JoeOS AI"))
              )
            ),
            banners.length ? h(
              "div",
              { className: "banner-stack", role: "region", "aria-label": "System conditions" },
              banners.map(function (banner) {
                return h(
                  "div",
                  { className: "system-banner " + banner.tone, key: banner.id },
                  h("span", { className: "banner-icon", "aria-hidden": "true" }, icon(banner.icon)),
                  h("span", null, banner.text),
                  banner.action ? h("button", { type: "button", className: "text-button banner-action", onClick: banner.action }, banner.actionLabel) : null
                );
              })
            ) : null,
            h("main", { className: "content", id: "main-content", tabIndex: -1 }, section)
          ),
          mobileOpen ? h(
            React.Fragment,
            null,
            h("div", { className: "mobile-overlay", onClick: closeMobile, "aria-hidden": "true" }),
            h(
              "div",
              { className: "mobile-drawer", id: "mobile-navigation", role: "dialog", "aria-modal": "true", "aria-label": "Mobile navigation", ref: mobileDrawerRef },
              h("aside", { className: "sidebar", "aria-label": "Mobile navigation" }, h("button", { type: "button", className: "icon-button mobile-drawer-close", onClick: closeMobile, "aria-label": "Close navigation menu" }, icon("fa-xmark")), h(SidebarContent, { active: active, onSelect: selectSection, runtime: runtime, mobile: true, firstNavRef: firstNavRef }))
            )
          ) : null,
          paletteOpen ? h(CommandPalette, { commands: paletteCommands, onClose: function () { setPaletteOpen(false); } }) : null,
          catalogOpen ? h(WidgetCatalogModal, { workspace: workspace, catalog: catalog, onAdd: addWorkspaceWidget, onClose: function () { setCatalogOpen(false); } }) : null,
          customizerOpen ? h(CustomizerPanel, { workspace: workspace, saving: workspaceSaving, onTheme: updateWorkspaceTheme, onGuide: requestConfigurationGuide, onApplyGuide: applyGuideProposal, onReset: resetWorkspace, onSave: function () { saveWorkspace(true); }, onClose: function () { setCustomizerOpen(false); } }) : null,
          assistantOpen ? h(AssistantPanel, {
            messages: messages,
            thinking: thinking,
            input: assistantInput,
            onInput: setAssistantInput,
            onSubmit: submitAssistant,
            onQuick: runAssistant,
            onClose: function () { setAssistantOpen(false); },
            onClear: function () { setMessages([{ id: "msg-" + messageIdRef.current++, role: "assistant", text: "Conversation cleared. I’m ready for the next operational command." }]); },
            runtime: runtime,
            inputRef: assistantInputRef,
            endRef: assistantEndRef
          }) : h("button", { type: "button", className: "assistant-fab", onClick: function () { setAssistantOpen(true); }, "aria-label": "Open JoeOS AI assistant", title: "Ask JoeOS AI" }, icon("fa-wand-magic-sparkles")),
          deployOpen ? h(DeployModal, { name: agentName, role: agentRole, onName: setAgentName, onRole: setAgentRole, onClose: function () { setDeployOpen(false); }, onSubmit: deployAgent }) : null,
          selectedNode ? h(NodeModal, { node: selectedNode, onClose: function () { setSelectedNode(null); }, onRefresh: refreshNode }) : null,
          h(ShortcutsDialog, { open: shortcutsOpen, onClose: function () { setShortcutsOpen(false); } }),
          toast ? h("div", { className: "toast", role: "status" }, icon("fa-circle-check"), toast) : null
          )
        );
      }

      var rootElement = document.getElementById("root");
      ReactDOM.createRoot(rootElement).render(h(App));
      if ("serviceWorker" in navigator && window.isSecureContext) {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      }
    })();
  </script>
</body>
