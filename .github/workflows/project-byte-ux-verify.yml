name: PROJECT_BYTE UX Verify

on:
  pull_request:
    branches: [project-byte-deploy]
  push:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/health-runtime.js'
      - 'deploy/project-byte/v4/home.js'
      - 'deploy/project-byte/v4/index/**'
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-ux-verify.yml'
  workflow_dispatch:

jobs:
  verify-command-center-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify executable browser source
        run: |
          set -euo pipefail
          node --check deploy/project-byte/v4/health-runtime.js
          node --check deploy/project-byte/v4/home.js
          cat deploy/project-byte/v4/index/*.part > /tmp/project-byte-index.html
          node - /tmp/project-byte-index.html <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          const match=html.match(/<script>([\s\S]*)<\/script>/);
          if(!match) throw new Error('inline application script missing');
          new Function(match[1]);
          NODE
      - name: Verify truthful health and direct ownership
        run: |
          set -euo pipefail
          f=deploy/project-byte/v4/health-runtime.js
          base="$RUNNER_TEMP/project-byte-base.js"
          cat deploy/project-byte/v4/index/*.part > "$RUNNER_TEMP/project-byte-index.html"
          sed -n '/<script>/,/<\/script>/p' "$RUNNER_TEMP/project-byte-index.html" > "$base"
          home=deploy/project-byte/v4/home.js
          grep -q "health?.operational" "$f"
          grep -q "Core healthy · execution incomplete" "$f"
          grep -q "VITROS verifier" "$f"
          grep -q "modelSummary" "$f"
          grep -q "tested OK" "$f"
          grep -q "Last test OK" "$base"
          grep -q "data-model-evidence=\"historical\"" "$base"
          ! grep -q "● Connected" "$base"
          ! grep -q 'installHistoricalModelLabels' "$f"
          ! grep -q 'MutationObserver' "$f"
          grep -q 'Verifying system health…' "$home"
          grep -q 'AI UNKNOWN' "$home"
          ! grep -q 'All systems operational' "$home"
          ! grep -q 'AI READY' "$home"
          ! grep -q 'AI CONNECTED' "$home"
          echo 'TRUTHFUL_HEALTH_DIRECT_OWNERSHIP=PASS'
      - name: Verify workspace-wide refresh semantics
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/project-byte-base.js"
          for endpoint in session tasks projects intelligence activity models agents runs; do
            grep -q "api('/api/$endpoint')" "$f"
          done
          grep -q "api('/api/notifications')" "$f"
          grep -q 'workspaceRefreshBusy' "$f"
          grep -q 'userIsEditing' "$f"
          grep -q "document.querySelector('.modalwrap.open')" "$f"
          grep -q 'refreshTimer=setInterval(refreshWorkspace,ms)' "$f"
          ! grep -q 'installWorkspaceRefresh' deploy/project-byte/v4/health-runtime.js
          echo 'WORKSPACE_REFRESH=PASS'
      - name: Verify mobile navigation, filters, and Kanban
        run: |
          set -euo pipefail
          f=deploy/project-byte/v4/health-runtime.js
          ! grep -q "board.innerHTML" "$f"
          ! grep -q "help.innerHTML" "$f"
          grep -q 'body:not(\[data-pb-view="home"\]) .filters{display:grid!important' "$f"
          grep -q 'scroll-snap-type:x mandatory' "$f"
          grep -q 'calc(100vw - 36px)' "$f"
          grep -q 'grid-template-columns:repeat(5,minmax(0,1fr))' "$f"
          grep -q 'data-home-go="portfolio"' deploy/project-byte/v4/home.js
          grep -q 'data-home-go="agents"' deploy/project-byte/v4/home.js
          grep -q 'data-home-go="ai"' deploy/project-byte/v4/home.js
          grep -q 'data-home-go="settings"' deploy/project-byte/v4/home.js
          grep -q 'New work</button>' deploy/project-byte/v4/home.js
          ! grep -q '>Queue work</button>' deploy/project-byte/v4/home.js
          grep -q 'targetOwner===who' deploy/project-byte/v4/home.js
          grep -q 'data-home-approval' deploy/project-byte/v4/home.js
          grep -q 'PROJECT_BYTE approval records your review decision only' deploy/project-byte/v4/home.js
          grep -q 'homeExecutionFabric' deploy/project-byte/v4/home.js
          grep -q 'VITROS verifier' deploy/project-byte/v4/home.js
          grep -q 'Model Hub' deploy/project-byte/v4/home.js
          grep -q 'project-byte-health' deploy/project-byte/v4/home.js
          grep -q "CustomEvent('project-byte-health'" deploy/project-byte/v4/health-runtime.js
          echo 'HOME_REVIEW_AND_SCOPE_UX=PASS'
          echo 'MOBILE_COMMAND_CENTER=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/pb-browser" --ignore-scripts --no-audit --no-fund playwright@1.57.0
          node "$RUNNER_TEMP/pb-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify bounded execution observation adapter
        run: PYTHONDONTWRITEBYTECODE=1 python3 deploy/project-byte/v4/test_observatory.py
      - name: Exercise actual Home on mobile and desktop
        env:
          PB_SCREENSHOTS: ${{ runner.temp }}/pb-orbital-screenshots
        run: |
          PB_PLAYWRIGHT_MODULE="$RUNNER_TEMP/pb-browser/node_modules/playwright/index.mjs" \
            node deploy/project-byte/v4/test_home_browser.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-byte-orbital-browser-evidence
          path: ${{ runner.temp }}/pb-orbital-screenshots
          retention-days: 7
          if-no-files-found: ignore
