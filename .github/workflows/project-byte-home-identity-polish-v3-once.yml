name: PROJECT_BYTE Home identity polish v3 once

on:
  push:
    branches: [project-byte-deploy]
    paths:
      - '.github/workflows/project-byte-home-identity-polish-v3-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-byte-deploy
          fetch-depth: 0
      - name: Apply and verify encoded Home refinement
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/pb-home-patch.py
          python3 /tmp/pb-home-patch.py
          node --check deploy/project-byte/v4/home.js
          grep -q "chips.push(\['self','My work'\])" deploy/project-byte/v4/home.js
          grep -q "a.agent_key!=='executive'" deploy/project-byte/v4/home.js
          grep -q 'function renderMemory(scoped)' deploy/project-byte/v4/home.js
          grep -q 'No open work assigned to' deploy/project-byte/v4/home.js
          grep -q "control.value=control.value===pair\[1\]?'':pair\[1\]" deploy/project-byte/v4/home.js
          grep -q 'data-home-agent="${key}"' deploy/project-byte/v4/home.js
          git diff --check
      - name: Commit Home refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/project-byte/v4/home.js
          git commit -m 'Refine Home identity, scopes, and agent semantics'
          git push origin HEAD:project-byte-deploy
