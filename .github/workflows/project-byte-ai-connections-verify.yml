name: PROJECT_BYTE AI Connections Verify
on:
  pull_request:
    branches: [project-byte-deploy]
  workflow_dispatch:
jobs:
  verify-ai-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify provider, subscription and authenticated routing boundaries
        run: |
          python3 deploy/project-byte/v4/verify_ai_packaging.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/project-byte/v4/test_ai_connections.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/project-byte/v4/test_codex_connection.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/project-byte/v4/test_ai_runtime.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/project-byte/v4/test_stage_ai_overlay.py
      - name: Install pinned isolated verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/pb-ai-tools" --ignore-scripts --no-audit --no-fund @openai/codex@0.153.4 playwright@1.57.0
          node "$RUNNER_TEMP/pb-ai-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Prove native Codex has no execution tools using an unauthenticated fixture
        run: |
          PROJECT_BYTE_TEST_CODEX_BIN="$RUNNER_TEMP/pb-ai-tools/node_modules/.bin/codex" \
          PROJECT_BYTE_CODEX_EVIDENCE_DIR="$RUNNER_TEMP/pb-ai-evidence/native-tools" \
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/project-byte/v4/test_codex_runtime_tools.py
      - name: Verify connection panel and session boundaries on four screen widths
        run: |
          PB_PLAYWRIGHT_MODULE="$RUNNER_TEMP/pb-ai-tools/node_modules/playwright/index.mjs" \
          PB_SCREENSHOTS="$RUNNER_TEMP/pb-ai-evidence/browser" \
          node deploy/project-byte/v4/test_ai_connections_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-byte-ai-connections-evidence
          path: ${{ runner.temp }}/pb-ai-evidence
          retention-days: 7
          if-no-files-found: ignore
