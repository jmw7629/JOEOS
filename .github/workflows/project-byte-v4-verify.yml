name: PROJECT_BYTE v4 Verify

on:
  push:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/**'
      - '.github/workflows/project-byte-v4-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact deployment sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/project-byte-v4
          cat deploy/project-byte/v4/server/*.part > /tmp/project-byte-v4/server.py
          cat deploy/project-byte/v4/index/*.part > /tmp/project-byte-v4/index.html
          cp deploy/project-byte/v4/home.js /tmp/project-byte-v4/home.js
          cp deploy/project-byte/v4/home-inspector.js /tmp/project-byte-v4/home-inspector.js
          wc -c /tmp/project-byte-v4/server.py /tmp/project-byte-v4/index.html /tmp/project-byte-v4/home.js /tmp/project-byte-v4/home-inspector.js
          sha256sum /tmp/project-byte-v4/server.py /tmp/project-byte-v4/index.html /tmp/project-byte-v4/home.js /tmp/project-byte-v4/home-inspector.js | tee /tmp/project-byte-v4/SHA256SUMS

      - name: Compile backend
        run: python3 -m py_compile /tmp/project-byte-v4/server.py

      - name: Parse browser JavaScript and required surfaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/project-byte-v4/index.html','utf8');
          const m = html.match(/<script>([\s\S]*)<\/script>/);
          if (!m) throw new Error('PROJECT_BYTE inline script missing');
          new Function(m[1]);
          const home = fs.readFileSync('/tmp/project-byte-v4/home.js','utf8');
          const inspector = fs.readFileSync('/tmp/project-byte-v4/home-inspector.js','utf8');
          new Function(home);
          new Function(inspector);
          for (const required of ['Portfolio','Kanban','Work next','AI','Agents','Terminal','Models','Team','Activity','Settings','Help / How-To','Notification center']) {
            if (!html.includes(required)) throw new Error(`missing UI surface: ${required}`);
          }
          for (const id of ['ownerFilter','leadFilter','statusFilter','healthFilter','stageFilter','executorFilter','agentFilter','modelFilter','aiStateFilter','dueFilter','completionFilter','dependencyFilter','activityFilter','milestoneFilter','repoFilter','runFilter','scopeFilter','savedView']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`missing filter control: ${id}`);
          }
          for (const required of ['Joe AI','Live agents','Team / org map','Current activity','My work','Ready for review','Recent memories','Portfolio pulse','homeCommandInput','home-nav']) {
            if (!home.includes(required)) throw new Error(`missing Home command-center surface: ${required}`);
          }
          for (const required of ['homeAgentInspector','homeAgentLens','Execution log details require Editor or Owner access','data-inspect-run','Full terminal','Agent workspace']) {
            if (!inspector.includes(required)) throw new Error(`missing agent-inspector surface: ${required}`);
          }
          console.log('UI_JS_FILTERS_HOME_AND_INSPECTOR=PASS');
          NODE

      - name: Smoke migration, auth, settings, notifications, queue and APIs
        shell: bash
        run: |
          set -euo pipefail
          RUN=/tmp/project-byte-v4/runtime
          mkdir -p "$RUN/bin"
          cp /tmp/project-byte-v4/server.py /tmp/project-byte-v4/index.html /tmp/project-byte-v4/home.js /tmp/project-byte-v4/home-inspector.js "$RUN/"
          python3 - "$RUN/index.html" <<'PY'
          from pathlib import Path
          p=Path(__import__('sys').argv[1])
          text=p.read_text()
          markers=['<script src="/home.js"></script>','<script src="/home-inspector.js"></script>']
          for marker in markers:
              if marker not in text:
                  text=text.replace('</body>', marker+'</body>')
          p.write_text(text)
          PY

          python3 <<'PY'
          import sqlite3
          db='/tmp/project-byte-v4/runtime/kanban.db'
          c=sqlite3.connect(db)
          c.execute('''create table tasks(id text primary key,title text not null,project text not null,status text not null,priority text not null,note text not null default '',created_at integer not null,updated_at integer not null)''')
          c.execute("insert into tasks values('legacy','LEGACY_V2_TASK','StickDeath Infinity','Backlog','High','preserve me',1,1)")
          c.execute('''create table projects(name text primary key,health text not null default 'On track',goal text not null default '',target_date text not null default '',notes text not null default '',updated_at integer not null)''')
          c.execute("insert into projects values('StickDeath Infinity','On track','LEGACY_GOAL','','',1)")
          c.commit(); c.close()
          PY

          cat > "$RUN/bin/gh" <<'SH'
          #!/usr/bin/env bash
          if [[ "$*" == *"issue create"* ]]; then
            echo 'https://github.com/jmw7629/StickDeath-Infinity-/issues/999'
            exit 0
          fi
          echo 'fake gh only permits issue create in CI' >&2
          exit 2
          SH
          chmod +x "$RUN/bin/gh"

          cd "$RUN"
          PATH="$RUN/bin:$PATH" KANBAN_HOST=127.0.0.1 KANBAN_PORT=18094 python3 server.py >server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            curl -fsS http://127.0.0.1:18094/healthz >/dev/null && break
            sleep .25
          done

          curl -fsS http://127.0.0.1:18094/healthz | tee health.json
          grep -q '"version":4' health.json
          grep -q '"settings":true' health.json
          grep -q '"notifications":true' health.json
          curl -fsS http://127.0.0.1:18094/api/tasks | tee tasks.json
          grep -q 'LEGACY_V2_TASK' tasks.json
          curl -fsS http://127.0.0.1:18094/api/projects | tee projects.json
          grep -q 'LEGACY_GOAL' projects.json
          curl -fsS http://127.0.0.1:18094/api/help | grep -q 'Queue to AI'
          curl -fsS http://127.0.0.1:18094/ | grep -q 'Help / How-To'
          curl -fsS http://127.0.0.1:18094/ | grep -q 'Notification center'
          curl -fsS http://127.0.0.1:18094/ | grep -q 'ownerFilter'
          curl -fsS http://127.0.0.1:18094/ | grep -q 'savedView'
          curl -fsS http://127.0.0.1:18094/ | grep -q '<script src="/home.js"></script>'
          curl -fsS http://127.0.0.1:18094/ | grep -q '<script src="/home-inspector.js"></script>'
          curl -fsS http://127.0.0.1:18094/home.js | grep -q 'Joe AI'
          curl -fsS http://127.0.0.1:18094/home-inspector.js | grep -q 'homeAgentInspector'
          curl -fsS http://127.0.0.1:18094/home-inspector.js | grep -q 'data-inspect-run'

          OWNER=$(cat admin.secret)
          curl -fsS -H "X-Access-Key: $OWNER" http://127.0.0.1:18094/api/session | tee session.json
          grep -q '"role":"owner"' session.json

          curl -fsS -H "X-Access-Key: $OWNER" http://127.0.0.1:18094/api/settings | tee settings-before.json
          grep -q '"default_view":"home"' settings-before.json
          curl -fsS -X POST -H 'Content-Type: application/json' -H "X-Access-Key: $OWNER" \
            -d '{"general":{"default_view":"board","refresh_seconds":30,"density":"compact"},"notifications":{"browser":false,"quiet_enabled":true,"quiet_start":"21:00","quiet_end":"06:00"},"filters":{"saved_views":[{"id":"mike-risk","name":"Mike Delivery Risk","criteria":{"ownerFilter":"Mike","priorityFilter":"Critical","statusFilter":"Blocked"}}]}}' \
            http://127.0.0.1:18094/api/settings | tee settings-after.json
          grep -q '"default_view":"board"' settings-after.json
          grep -q '"refresh_seconds":30' settings-after.json
          grep -q 'Mike Delivery Risk' settings-after.json
          grep -q '"ownerFilter":"Mike"' settings-after.json

          curl -fsS -X PATCH -H 'Content-Type: application/json' -H "X-Access-Key: $OWNER" \
            -d '{"status":"Blocked","priority":"Critical"}' \
            http://127.0.0.1:18094/api/tasks/legacy >/dev/null
          curl -fsS -H "X-Access-Key: $OWNER" http://127.0.0.1:18094/api/notifications | tee notifications.json
          grep -q 'Critical work is blocked' notifications.json
          curl -fsS -X POST -H 'Content-Type: application/json' -H "X-Access-Key: $OWNER" \
            -d '{"all":true}' http://127.0.0.1:18094/api/notifications/read >/dev/null
          curl -fsS -H "X-Access-Key: $OWNER" http://127.0.0.1:18094/api/notifications | grep -q '"unread":0'

          curl -fsS -X PATCH -H 'Content-Type: application/json' -H "X-Access-Key: $OWNER" \
            -d '{"status":"Backlog","executor":"ai","agent_key":"builder","model_key":"ollama-local"}' \
            http://127.0.0.1:18094/api/tasks/legacy >/dev/null
          curl -fsS -X POST -H 'Content-Type: application/json' -H "X-Access-Key: $OWNER" \
            -d '{"agent_key":"builder","model_key":"ollama-local"}' \
            http://127.0.0.1:18094/api/tasks/legacy/queue | tee queue.json
          grep -q '"issue":999' queue.json
          curl -fsS -H "X-Access-Key: $OWNER" http://127.0.0.1:18094/api/runs | grep -q '"issue_number":999'

          echo 'PROJECT_BYTE_V4_HOME_INSPECTOR_INTEGRATION=PASS'

      - name: Upload verified reconstruction
        uses: actions/upload-artifact@v4
        with:
          name: project-byte-v4-verified
          path: |
            /tmp/project-byte-v4/server.py
            /tmp/project-byte-v4/index.html
            /tmp/project-byte-v4/home.js
            /tmp/project-byte-v4/home-inspector.js
            /tmp/project-byte-v4/SHA256SUMS
          retention-days: 14
