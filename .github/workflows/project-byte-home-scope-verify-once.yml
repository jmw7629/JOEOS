name: PROJECT_BYTE Home scope verify once

on:
  push:
    branches: [project-byte-deploy]
    paths:
      - '.github/workflows/project-byte-home-scope-verify-once.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify command center
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cat deploy/project-byte/v4/server/*.part > "$TMP/server.py"
          cat deploy/project-byte/v4/index/*.part > "$TMP/index.html"
          cp deploy/project-byte/v4/home.js "$TMP/home.js"
          cp deploy/project-byte/v4/home-inspector.js "$TMP/home-inspector.js"
          python3 -m py_compile "$TMP/server.py"
          node --check "$TMP/home.js"
          node --check "$TMP/home-inspector.js"
          grep -q 'data-home-kpi' "$TMP/home.js"
          grep -q 'function homeKpiScope' "$TMP/home.js"
          grep -q "open: \['completionFilter','open'\]" "$TMP/home.js"
          grep -q "active: \['statusFilter','Active'\]" "$TMP/home.js"
          grep -q "blocked: \['statusFilter','Blocked'\]" "$TMP/home.js"
          grep -q "critical: \['priorityFilter','Critical'\]" "$TMP/home.js"
          grep -q "ai: \['runFilter','active'\]" "$TMP/home.js"
          grep -q "due: \['dueFilter','7d'\]" "$TMP/home.js"
          grep -q 'function renderActivity(scoped)' "$TMP/home.js"
          grep -q 'function renderApprovals(scoped)' "$TMP/home.js"
          grep -q 'function renderPortfolio(scoped)' "$TMP/home.js"
          grep -q 'No recent activity in this scope' "$TMP/home.js"
          grep -q 'No agent work is waiting for review in this scope' "$TMP/home.js"
          grep -q 'No projects in this scope' "$TMP/home.js"
          grep -q 'id="completionFilter"' "$TMP/index.html"
          grep -q 'id="runFilter"' "$TMP/index.html"
          grep -q 'id="dueFilter"' "$TMP/index.html"
          grep -q 'id="statusFilter"' "$TMP/index.html"
          grep -q 'id="priorityFilter"' "$TMP/index.html"
          grep -q 'homeAgentInspector' "$TMP/home-inspector.js"
          sha256sum "$TMP/server.py" "$TMP/index.html" "$TMP/home.js" "$TMP/home-inspector.js"
          echo PROJECT_BYTE_HOME_SCOPE_VERIFY=PASS
