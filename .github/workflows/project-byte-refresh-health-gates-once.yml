name: PROJECT_BYTE refresh health gates once

on:
  push:
    branches: [project-byte-deploy]
    paths:
      - '.github/workflows/project-byte-refresh-health-gates-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-byte-deploy
          fetch-depth: 0

      - name: Refresh stale health assertions only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          installer = Path('.github/workflows/project-byte-installer-verify.yml')
          s = installer.read_text()
          pairs = {
            "grep -Fq 'bridges[\"vitros_verifier\"][\"state\"] == \"healthy\"' \"$TMP/server.py\"": "grep -Fq '\"vitros_verifier\": (\"vitros-opencode-verifier.service\", \"jmw7629/vitros-web-dashboard\", False)' \"$TMP/server.py\"\n          grep -q 'ai_chat_ready' \"$TMP/server.py\"\n          grep -q 'operational-with-warnings' \"$TMP/server.py\"",
            "grep -q 'AI TESTED OK' \"$TMP/health-runtime.js\"": "grep -q 'AI CHAT TESTED OK' \"$TMP/health-runtime.js\"",
            "grep -q 'AI UNKNOWN' \"$TMP/health-runtime.js\"": "grep -q 'AI CHAT UNTESTED' \"$TMP/health-runtime.js\"",
          }
          for old,new in pairs.items():
            if old not in s: raise SystemExit(f'installer gate anchor missing: {old}')
            s=s.replace(old,new,1)
          installer.write_text(s)

          health = Path('.github/workflows/project-byte-health-runtime-verify.yml')
          h = health.read_text()
          h=h.replace("if (ai.textContent !== 'AI UNKNOWN') throw new Error(`unexpected AI evidence: ${ai.textContent}`);", "if (ai.textContent !== 'AI CHAT UNTESTED') throw new Error(`unexpected AI evidence: ${ai.textContent}`);")
          h=h.replace("grep -q 'AI TESTED OK' deploy/project-byte/v4/health-runtime.js", "grep -q 'AI CHAT TESTED OK' deploy/project-byte/v4/health-runtime.js\n          grep -q 'AI CHAT UNTESTED' deploy/project-byte/v4/health-runtime.js\n          grep -q 'ai_chat_ready' deploy/project-byte/v4/runtime_server.py\n          grep -q 'operational-with-warnings' deploy/project-byte/v4/runtime_server.py\n          grep -q 'Optional VITROS verifier is not active' deploy/project-byte/install.sh")
          if "AI UNKNOWN') throw" in h or "grep -q 'AI TESTED OK' deploy/project-byte/v4/health-runtime.js" in h:
            raise SystemExit('stale health-runtime assertion remains')
          health.write_text(h)

          v4 = Path('.github/workflows/project-byte-v4-verify.yml')
          v = v4.read_text()
          v=v.replace("'AI TESTED OK','AI DEGRADED','AI UNKNOWN'", "'AI CHAT TESTED OK','AI CHAT DEGRADED','AI CHAT UNTESTED'")
          if "'AI TESTED OK','AI DEGRADED','AI UNKNOWN'" in v:
            raise SystemExit('stale v4 health labels remain')
          v4.write_text(v)
          PY

          grep -q 'AI CHAT TESTED OK' .github/workflows/project-byte-installer-verify.yml
          grep -q 'AI CHAT UNTESTED' .github/workflows/project-byte-installer-verify.yml
          grep -q 'ai_chat_ready' .github/workflows/project-byte-installer-verify.yml
          grep -q 'AI CHAT UNTESTED' .github/workflows/project-byte-health-runtime-verify.yml
          grep -q 'Optional VITROS verifier is not active' .github/workflows/project-byte-health-runtime-verify.yml
          grep -q 'AI CHAT TESTED OK' .github/workflows/project-byte-v4-verify.yml
          git diff --check

      - name: Commit permanent gate corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/project-byte-installer-verify.yml .github/workflows/project-byte-health-runtime-verify.yml .github/workflows/project-byte-v4-verify.yml
          git commit -m 'Align PROJECT_BYTE CI with required-vs-optional health semantics'
          git push origin HEAD:project-byte-deploy
