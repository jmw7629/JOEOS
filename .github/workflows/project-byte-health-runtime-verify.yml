name: PROJECT_BYTE Health Runtime Verify

on:
  pull_request:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/health-runtime.js'
      - 'deploy/project-byte/v4/home.js'
      - 'deploy/project-byte/v4/runtime_server.py'
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-health-runtime-verify.yml'
  push:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/health-runtime.js'
      - 'deploy/project-byte/v4/home.js'
      - 'deploy/project-byte/v4/runtime_server.py'
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-health-runtime-verify.yml'
  workflow_dispatch:

jobs:
  verify-health-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove health UI renders evidence directly
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/project-byte/v4/health-runtime.js
          node --check deploy/project-byte/v4/home.js
          ! grep -q 'MutationObserver' deploy/project-byte/v4/health-runtime.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          class FakeElement {
            constructor(text = '') { this.textContent = text; this.dataset = {}; this.style = {}; }
          }
          const system = new FakeElement('legacy');
          const ai = new FakeElement('legacy');
          const dot = new FakeElement();
          const windowObject = {setInterval: () => 0};
          const context = {
            window: windowObject,
            document: {
              activeElement: null,
              getElementById: id => id === 'homeSystemState' ? system : id === 'homeAIState' ? ai : null,
              querySelector: selector => selector === '.home-status-dot' ? dot : null,
            },
            fetch: async () => ({
              ok: true,
              json: async () => ({ok: true, operational: false, components: {models: {state: 'unknown'}}}),
            }),
            console,
          };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('deploy/project-byte/v4/health-runtime.js', 'utf8'), context);
          (async () => {
            await Promise.resolve();
            await Promise.resolve();
            await new Promise(resolve => setImmediate(resolve));
            if (system.textContent !== 'Core healthy · execution health incomplete') throw new Error(`unexpected system evidence: ${system.textContent}`);
            if (ai.textContent !== 'AI UNKNOWN') throw new Error(`unexpected AI evidence: ${ai.textContent}`);
            if (dot.dataset.health !== 'unknown') throw new Error(`unexpected evidence class: ${dot.dataset.health}`);
            console.log('HOME_STATUS_DIRECT_EVIDENCE_OWNERSHIP=PASS');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Prove Home has no local false-green health writers
        shell: bash
        run: |
          set -euo pipefail
          home=deploy/project-byte/v4/home.js
          grep -q 'Verifying system health…' "$home"
          grep -q 'AI UNKNOWN' "$home"
          ! grep -q 'All systems operational' "$home"
          ! grep -q 'AI READY' "$home"
          ! grep -q 'AI CONNECTED' "$home"
          echo 'HOME_LOCAL_HEALTH_WRITERS=REMOVED'
      - name: Prove model freshness and verifier Funnel gate are explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/project-byte/v4/runtime_server.py
          grep -q 'MODEL_STATUS_FRESH_SECONDS = 1800' deploy/project-byte/v4/runtime_server.py
          grep -q 'freshness_window_seconds' deploy/project-byte/v4/runtime_server.py
          grep -q 'AI TESTED OK' deploy/project-byte/v4/health-runtime.js
          ! grep -q "textContent = 'AI VERIFIED'" deploy/project-byte/v4/health-runtime.js
          grep -q 'open Agents or Help for details' deploy/project-byte/v4/health-runtime.js
          grep -q 'check_bridge_service "vitros-opencode-verifier.service"' deploy/project-byte/install.sh
          ! grep -q 'refresh_bridge .*vitros-opencode-verifier.service' deploy/project-byte/install.sh
          grep -q 'EXPECTED_SERVER="[0-9a-f]\{64\}"' deploy/project-byte/install.sh
          grep -q 'SERVER_SHA=.*sha256sum' deploy/project-byte/install.sh
          echo 'HEALTH_MODEL_FRESHNESS_AND_FUNNEL_GATE=PASS'
