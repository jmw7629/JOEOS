name: PROJECT_BYTE Health Runtime Verify

on:
  pull_request:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/health-runtime.js'
      - 'deploy/project-byte/v4/home.js'
      - 'deploy/project-byte/v4/runtime_server.py'
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-health-runtime-verify.yml'
  push:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/health-runtime.js'
      - 'deploy/project-byte/v4/home.js'
      - 'deploy/project-byte/v4/runtime_server.py'
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-health-runtime-verify.yml'
  workflow_dispatch:

jobs:
  verify-health-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove health UI renders evidence directly
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/project-byte/v4/health-runtime.js
          node --check deploy/project-byte/v4/home.js
          ! grep -q 'MutationObserver' deploy/project-byte/v4/health-runtime.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          class FakeElement {
            constructor(text = '') { this.textContent = text; this.dataset = {}; this.style = {}; this.innerHTML = ''; }
          }
          const system = new FakeElement('legacy');
          const ai = new FakeElement('legacy');
          const ops = new FakeElement('legacy');
          const dot = new FakeElement();
          const windowObject = {setInterval: () => 0};
          const context = {
            window: windowObject,
            document: {
              activeElement: null,
              getElementById: id => id === 'homeSystemState' ? system : id === 'homeAIState' ? ai : id === 'opsHealth' ? ops : null,
              querySelector: selector => selector === '.home-status-dot' ? dot : null,
            },
            fetch: async () => ({
              ok: true,
              json: async () => ({
                ok: true,
                operational: true,
                status: 'operational-with-warnings',
                warnings: ['models-unknown'],
                ai_ops: true,
                ai_chat_ready: false,
                components: {
                  sqlite: {state: 'healthy'},
                  sync: {state: 'healthy'},
                  bridges: {
                    stickdeath: {state: 'healthy', progress_state: 'running', required: true},
                    vitros: {state: 'healthy', progress_state: 'idle', required: true},
                    vitros_verifier: {state: 'healthy', progress_state: 'idle-or-external', required: true},
                  },
                  models: {state: 'unknown', tested_ok: 0, failed: 0, unknown: 1},
                },
              }),
            }),
            console,
          };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('deploy/project-byte/v4/health-runtime.js', 'utf8'), context);
          (async () => {
            await Promise.resolve();
            await Promise.resolve();
            await new Promise(resolve => setImmediate(resolve));
            if (system.textContent !== 'Systems operational · 1 warning') throw new Error(`unexpected system evidence: ${system.textContent}`);
            if (ai.textContent !== 'AI CHAT UNTESTED') throw new Error(`unexpected AI evidence: ${ai.textContent}`);
            if (dot.dataset.health !== 'unknown') throw new Error(`unexpected evidence class: ${dot.dataset.health}`);
            if (!ops.innerHTML.includes('StickDeath healthy/running')) throw new Error(`missing StickDeath progress: ${ops.innerHTML}`);
            if (!ops.innerHTML.includes('VITROS builder healthy/idle')) throw new Error(`missing VITROS builder progress: ${ops.innerHTML}`);
            if (!ops.innerHTML.includes('VITROS verifier healthy/idle-or-external')) throw new Error(`missing VITROS verifier evidence: ${ops.innerHTML}`);
            if (ops.innerHTML.includes('optional')) throw new Error(`verifier incorrectly labeled optional: ${ops.innerHTML}`);
            console.log('HOME_STATUS_DIRECT_EVIDENCE_OWNERSHIP=PASS');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Prove Home has no local false-green health writers
        shell: bash
        run: |
          set -euo pipefail
          home=deploy/project-byte/v4/home.js
          grep -q 'Verifying system health…' "$home"
          grep -q 'AI UNKNOWN' "$home"
          ! grep -q 'All systems operational' "$home"
          ! grep -q 'AI READY' "$home"
          ! grep -q 'AI CONNECTED' "$home"
          echo 'HOME_LOCAL_HEALTH_WRITERS=REMOVED'
      - name: Prove required verifier, liveness and chat readiness semantics are explicit
        shell: bash
        run: |
          set -euo pipefail
          runtime=deploy/project-byte/v4/runtime_server.py
          installer=deploy/project-byte/install.sh
          health=deploy/project-byte/v4/health-runtime.js
          python3 -m py_compile "$runtime"
          grep -q 'BRIDGE_STALL_SECONDS = 2700' "$runtime"
          grep -q 'MODEL_STATUS_FRESH_SECONDS = 1800' "$runtime"
          grep -q 'freshness_window_seconds' "$runtime"
          grep -q 'ai_chat_ready' "$runtime"
          grep -q 'operational-with-warnings' "$runtime"
          grep -Fq '"vitros_verifier": ("vitros-opencode-verifier.service", "jmw7629/vitros-web-dashboard", True)' "$runtime"
          grep -q "status in ('queued','running')" "$runtime"
          grep -q 'progress_state' "$runtime"
          grep -q 'stall_after_seconds' "$runtime"
          grep -q 'pending_observable' "$runtime"
          grep -q 'AI CHAT TESTED OK' "$health"
          grep -q 'AI CHAT UNTESTED' "$health"
          grep -q 'bridgeSummary' "$health"
          ! grep -q '(optional)' "$health"
          ! grep -q "textContent = 'AI VERIFIED'" "$health"
          grep -q 'open Agents or Help for details' "$health"
          grep -q 'check_bridge_service "vitros-opencode-verifier.service"' "$installer"
          grep -q 'if ! check_bridge_service "vitros-opencode-verifier.service"; then BRIDGE_REFRESH_FAILURES=1; fi' "$installer"
          ! grep -q 'Optional VITROS verifier' "$installer"
          ! grep -q 'refresh_bridge .*vitros-opencode-verifier.service' "$installer"
          grep -q 'EXPECTED_SERVER="[0-9a-f]\{64\}"' "$installer"
          grep -q 'SERVER_SHA=.*sha256sum' "$installer"
          echo 'HEALTH_REQUIRED_VERIFIER_LIVENESS_AND_CHAT_READINESS=PASS'
