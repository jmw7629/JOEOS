name: PROJECT_BYTE nondisruptive bridge refresh once

on:
  push:
    branches: [project-byte-deploy]
    paths:
      - '.github/workflows/project-byte-nondisruptive-bridge-refresh-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-byte-deploy
          fetch-depth: 0
      - name: Patch and verify installer bridge lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('deploy/project-byte/install.sh')
          s=p.read_text()
          old='''  local remote_head=""\n  local local_head=""\n'''
          new='''  local remote_head=""\n  local local_head=""\n  local checkout_advanced=0\n'''
          if old not in s: raise SystemExit('local declaration anchor missing')
          s=s.replace(old,new,1)

          old='''  if [ "$local_head" != "$remote_head" ]; then\n    if ! git -C "$root" merge --ff-only origin/main; then\n      echo "Bridge refresh skipped for $service_name: fast-forward was not safe." >&2\n      return 1\n    fi\n  fi\n  local_head="$(git -C "$root" rev-parse HEAD 2>/dev/null || true)"\n  if [ "$local_head" != "$remote_head" ]; then\n    echo "Bridge refresh failed for $service_name: checkout is not at origin/main after refresh." >&2\n    return 1\n  fi\n  if ! systemctl --user restart "$service_name"; then\n    echo "Bridge refresh failed for $service_name: service restart failed." >&2\n    return 1\n  fi\n  if ! systemctl --user is-active --quiet "$service_name"; then\n    echo "Bridge refresh failed for $service_name: service is not active after restart." >&2\n    return 1\n  fi\n  echo "Bridge refreshed and active: $service_name @ ${local_head:0:12}"\n'''
          new='''  if [ "$local_head" != "$remote_head" ]; then\n    if ! git -C "$root" merge --ff-only origin/main; then\n      echo "Bridge refresh skipped for $service_name: fast-forward was not safe." >&2\n      return 1\n    fi\n    checkout_advanced=1\n  fi\n  local_head="$(git -C "$root" rev-parse HEAD 2>/dev/null || true)"\n  if [ "$local_head" != "$remote_head" ]; then\n    echo "Bridge refresh failed for $service_name: checkout is not at origin/main after refresh." >&2\n    return 1\n  fi\n\n  if systemctl --user is-active --quiet "$service_name"; then\n    if [ "$checkout_advanced" -eq 0 ]; then\n      echo "Bridge already current and active: $service_name @ ${local_head:0:12}; restart not required."\n      return 0\n    fi\n    echo "Bridge checkout advanced for $service_name, but the service is already active; restart deferred to avoid interrupting an executor." >&2\n    return 1\n  fi\n\n  if ! systemctl --user restart "$service_name"; then\n    echo "Bridge refresh failed for $service_name: service restart failed." >&2\n    return 1\n  fi\n  if ! systemctl --user is-active --quiet "$service_name"; then\n    echo "Bridge refresh failed for $service_name: service is not active after restart." >&2\n    return 1\n  fi\n  echo "Bridge refreshed and active: $service_name @ ${local_head:0:12}"\n'''
          if old not in s: raise SystemExit('restart block anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          bash -n deploy/project-byte/install.sh
          grep -q 'local checkout_advanced=0' deploy/project-byte/install.sh
          grep -q 'restart not required' deploy/project-byte/install.sh
          grep -q 'restart deferred to avoid interrupting an executor' deploy/project-byte/install.sh
          grep -q '\[ "$checkout_advanced" -eq 0 \]' deploy/project-byte/install.sh
          git diff --check
      - name: Commit installer-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/project-byte/install.sh
          git commit -m 'Avoid unnecessary bridge restarts during PROJECT_BYTE deploys'
          git push origin HEAD:project-byte-deploy
