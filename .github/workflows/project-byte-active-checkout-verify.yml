name: PROJECT_BYTE Active Checkout Verify

on:
  pull_request:
    branches: [project-byte-deploy]
  push:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-active-checkout-verify.yml'
  workflow_dispatch:

jobs:
  active-checkout-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer syntax
        run: bash -n deploy/project-byte/install.sh
      - name: Prove active executors never have HEAD or worktree advanced
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          REMOTE="$TMP/remote.git"
          ROOT="$TMP/control"
          ENV_FILE="$TMP/bridge.env"
          FAKEBIN="$TMP/bin"
          STATE="$TMP/systemctl.state"
          CALLS="$TMP/systemctl.calls"
          mkdir -p "$FAKEBIN"

          git init --bare "$REMOTE" >/dev/null
          git clone "$REMOTE" "$ROOT" >/dev/null 2>&1
          git -C "$ROOT" config user.name ci
          git -C "$ROOT" config user.email ci@example.invalid
          git -C "$ROOT" checkout -b main >/dev/null
          printf 'one\n' > "$ROOT/runner.py"
          git -C "$ROOT" add runner.py
          git -C "$ROOT" commit -m one >/dev/null
          git -C "$ROOT" push -u origin main >/dev/null
          A="$(git -C "$ROOT" rev-parse HEAD)"
          printf 'two\n' >> "$ROOT/runner.py"
          git -C "$ROOT" commit -am two >/dev/null
          git -C "$ROOT" push origin main >/dev/null
          B="$(git -C "$ROOT" rev-parse HEAD)"
          git -C "$ROOT" reset --hard "$A" >/dev/null
          printf 'BRIDGE_ROOT=%s\n' "$ROOT" > "$ENV_FILE"

          cat > "$FAKEBIN/systemctl" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "$*" >> "$FAKE_SYSTEMCTL_CALLS"
          if [[ " $* " == *" is-active "* ]]; then
            if [ "${FAKE_SYSTEMCTL_MODE:-active}" = "active" ] || [ -f "$FAKE_SYSTEMCTL_STATE" ]; then
              exit 0
            fi
            exit 3
          fi
          if [[ " $* " == *" restart "* ]]; then
            touch "$FAKE_SYSTEMCTL_STATE"
            exit 0
          fi
          exit 0
          SH
          chmod +x "$FAKEBIN/systemctl"
          export PATH="$FAKEBIN:$PATH"
          export FAKE_SYSTEMCTL_STATE="$STATE"
          export FAKE_SYSTEMCTL_CALLS="$CALLS"

          awk '/^refresh_bridge\(\) \{/{capture=1} capture{print} capture && /^}$/{exit}' deploy/project-byte/install.sh > "$TMP/function.sh"
          # shellcheck disable=SC1090
          source "$TMP/function.sh"

          : > "$CALLS"
          export FAKE_SYSTEMCTL_MODE=active
          set +e
          refresh_bridge "$ENV_FILE" bridge.service
          RC=$?
          set -e
          test "$RC" -eq 1
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$A"
          git -C "$ROOT" diff --quiet
          git -C "$ROOT" diff --cached --quiet
          ! grep -q ' restart ' "$CALLS"
          echo 'ACTIVE_BEHIND_HEAD_UNCHANGED=PASS'

          git -C "$ROOT" reset --hard "$B" >/dev/null
          : > "$CALLS"
          refresh_bridge "$ENV_FILE" bridge.service
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$B"
          ! grep -q ' restart ' "$CALLS"
          echo 'ACTIVE_CURRENT_NO_RESTART=PASS'

          git -C "$ROOT" reset --hard "$A" >/dev/null
          rm -f "$STATE"
          : > "$CALLS"
          export FAKE_SYSTEMCTL_MODE=inactive
          refresh_bridge "$ENV_FILE" bridge.service
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$B"
          grep -q ' restart ' "$CALLS"
          echo 'INACTIVE_BEHIND_FAST_FORWARD_AND_RESTART=PASS'
      - name: Prove dirty and non-main guards remain before mutation
        shell: bash
        run: |
          set -euo pipefail
          installer=deploy/project-byte/install.sh
          python3 <<'PY'
          from pathlib import Path
          text=Path('deploy/project-byte/install.sh').read_text()
          start=text.index('refresh_bridge() {')
          end=text.index('\n}\n\ncheck_bridge_service()', start)
          f=text[start:end]
          required=[
              'symbolic-ref --quiet --short HEAD',
              'control checkout is on',
              'status --porcelain',
              'control checkout has real changes',
              'fetch --prune origin main',
              'service is active; control checkout and HEAD were left unchanged',
              'merge --ff-only origin/main',
          ]
          for item in required:
              assert item in f, item
          assert f.index('status --porcelain') < f.index('fetch --prune origin main')
          assert f.index('service is active; control checkout and HEAD were left unchanged') < f.index('merge --ff-only origin/main')
          print('DIRTY_GUARD_PRECEDES_FETCH=PASS')
          print('ACTIVE_GUARD_PRECEDES_MERGE=PASS')
          PY
          git diff --check
