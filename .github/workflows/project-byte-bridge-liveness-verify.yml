name: PROJECT_BYTE Bridge Liveness Verify

on:
  pull_request:
    branches: [project-byte-deploy]
  push:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/runtime_server.py'
      - 'deploy/project-byte/v4/health-runtime.js'
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-bridge-liveness-verify.yml'
  workflow_dispatch:

jobs:
  verify-bridge-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile runtime
        run: python3 -m py_compile deploy/project-byte/v4/runtime_server.py
      - name: Prove bounded local liveness semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import importlib.util
          import json
          import os
          import sys
          import tempfile
          import types
          from pathlib import Path

          stub = types.ModuleType('backend')
          stub.H = object
          stub.BRIDGE_STATE = {}
          stub.execution_hold = lambda repo: None
          sys.modules['backend'] = stub
          path = Path('deploy/project-byte/v4/runtime_server.py')
          spec = importlib.util.spec_from_file_location('project_byte_runtime', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          now = 1_800_000_000.0

          def check(name, service, pending, activity, expected_state, expected_progress, observable=True, complete=True):
              got = mod._evaluate_bridge_health(
                  service,
                  pending,
                  activity,
                  now,
                  pending_observable=observable,
                  activity_evidence_complete=complete,
              )
              assert got['state'] == expected_state, (name, got)
              assert got['progress_state'] == expected_progress, (name, got)
              assert 'path' not in got and 'log' not in got and 'repo' not in got, (name, got)
              return got

          check('idle-active', 'active', {'count': 0}, None, 'healthy', 'idle')
          check(
              'fresh-running', 'active',
              {'count': 1, 'oldest_age_seconds': 20, 'active_updated_at': int(now - 10)},
              now - 5, 'healthy', 'running'
          )
          check(
              'stalled-running', 'active',
              {'count': 1, 'oldest_age_seconds': mod.BRIDGE_STALL_SECONDS + 20, 'active_updated_at': int(now - mod.BRIDGE_STALL_SECONDS - 20)},
              now - mod.BRIDGE_STALL_SECONDS - 5, 'failed', 'stalled'
          )
          check(
              'fresh-missing-evidence', 'active',
              {'count': 1, 'oldest_age_seconds': 20, 'active_updated_at': int(now - 20)},
              None, 'unknown', 'awaiting-evidence'
          )
          check(
              'stale-missing-evidence', 'active',
              {'count': 1, 'oldest_age_seconds': mod.BRIDGE_STALL_SECONDS + 1, 'active_updated_at': int(now - mod.BRIDGE_STALL_SECONDS - 1)},
              None, 'failed', 'stalled'
          )
          check(
              'bounded-scan-incomplete', 'active',
              {'count': 1, 'oldest_age_seconds': mod.BRIDGE_STALL_SECONDS + 1, 'active_updated_at': int(now - mod.BRIDGE_STALL_SECONDS - 1)},
              now - mod.BRIDGE_STALL_SECONDS - 1, 'unknown', 'evidence-incomplete', complete=False
          )
          check('inactive', 'failed', {'count': 0}, None, 'failed', 'inactive')
          check('verifier-active', 'active', {'count': 0}, None, 'healthy', 'idle-or-external', observable=False)
          check('verifier-inactive', 'failed', {'count': 0}, None, 'failed', 'inactive', observable=False)

          with tempfile.TemporaryDirectory() as td:
              state = Path(td) / 'processed.json'
              state.write_text(json.dumps({'processed': {'100': {'time': 5000}, '101': {'time': 1200}}}))
              os.utime(state, (9000, 9000))
              assert mod._processed_issue_activity(state, 101) == 1200.0
              assert mod._processed_issue_activity(state, 999) is None
              nested = Path(td) / 'worktree' / 'Sources' / 'Feature'
              nested.mkdir(parents=True)
              target = nested / 'change.swift'
              target.write_text('x')
              os.utime(target, (7000, 7000))
              activity, complete = mod._latest_tree_activity(Path(td) / 'worktree')
              assert activity >= 7000
              assert complete is True

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              proc = root / 'proc'
              cache = root / 'cache'
              proc.mkdir()
              (proc / 'uptime').write_text('1000.0 0.0')
              worktree = cache / 'jmw7629__stickdeath-byte' / 'worktrees' / 'issue-105'
              worktree.mkdir(parents=True)
              outside = root / 'outside'
              outside.mkdir()

              def fake_process(pid, args):
                  process = proc / str(pid)
                  process.mkdir()
                  uid = os.getuid()
                  (process / 'status').write_text(f'Name:\topencode\nUid:\t{uid}\t{uid}\t{uid}\t{uid}\n')
                  (process / 'cmdline').write_bytes(b'\0'.join(x.encode() for x in args) + b'\0')
                  fields = ['S'] + ['0'] * 18 + ['5000']
                  (process / 'stat').write_text(f'{pid} (opencode) ' + ' '.join(fields) + '\n')

              fake_process(11, ['/x/opencode', 'run', '--dir', str(worktree), '--model', 'opencode/nemotron-3.5-lightning-free', 'PROMPT token=SUPERSECRET'])
              fake_process(12, ['/x/opencode', 'run', '--dir', str(outside), '--model', 'bad/provider', 'PROMPT other-secret'])
              fake_process(13, ['/x/opencode', 'tui', '--dir', str(worktree), 'PROMPT third-secret'])
              observed = mod._active_executor('jmw7629/stickdeath-byte', boundary='stickdeath', proc_root=proc, cache_root=cache)
              assert observed['running'] is True and observed['count'] == 1, observed
              assert observed['active_run_ref'] == 'issue-105', observed
              assert observed['active_issue_number'] == 105, observed
              assert observed['active_model'] == 'opencode/nemotron-3.5-lightning-free', observed
              assert observed['elapsed_seconds'] == 950, observed
              assert 'SECRET' not in repr(observed) and 'PROMPT' not in repr(observed), observed

              vitros_live = cache / 'jmw7629__vitros-web-dashboard' / 'project-byte-live-builder' / 'issue-324'
              vitros_live.mkdir(parents=True)
              vitros_wrong = cache / 'jmw7629__vitros-web-dashboard' / 'worktrees' / 'issue-325'
              vitros_wrong.mkdir(parents=True)
              verifier = cache / 'jmw7629__vitros-web-dashboard' / 'verifier-sandboxes' / 'verify-316-dcecb6a10d'
              verifier.mkdir(parents=True)
              fake_process(14, ['/x/opencode', 'run', '--dir', str(vitros_live), '--model', 'opencode/nemotron-3.5-lightning-free', 'PROMPT live-v-secret'])
              fake_process(15, ['/x/opencode', 'run', '--dir', str(vitros_wrong), '--model', 'opencode/nemotron-3.5-lightning-free', 'PROMPT wrong-root-secret'])
              fake_process(16, ['/x/opencode', 'run', '--dir', str(verifier), '--model', 'opencode/nemotron-3.5-lightning-free', 'PROMPT verifier-secret'])
              vitros_observed = mod._active_executor('jmw7629/vitros-web-dashboard', boundary='vitros', proc_root=proc, cache_root=cache)
              assert vitros_observed['running'] is True and vitros_observed['count'] == 1, vitros_observed
              assert vitros_observed['active_run_ref'] == 'issue-324', vitros_observed
              assert vitros_observed['active_model'] == 'opencode/nemotron-3.5-lightning-free', vitros_observed
              verifier_observed = mod._active_executor('jmw7629/vitros-web-dashboard', boundary='vitros_verifier', proc_root=proc, cache_root=cache)
              assert verifier_observed['running'] is True and verifier_observed['count'] == 1, verifier_observed
              assert verifier_observed['active_run_ref'] == 'verify-316-dcecb6a10d', verifier_observed
              assert 'secret' not in repr(vitros_observed).lower(), vitros_observed
              assert 'secret' not in repr(verifier_observed).lower(), verifier_observed

              unavailable = mod._active_executor('jmw7629/stickdeath-byte', boundary='stickdeath', proc_root=root / 'missing-proc', cache_root=cache)
              assert unavailable['running'] is False and unavailable['evidence_complete'] is False, unavailable
              invalid_boundary = mod._active_executor('jmw7629/vitros-web-dashboard', boundary='unknown', proc_root=proc, cache_root=cache)
              assert invalid_boundary['running'] is False and invalid_boundary['evidence_complete'] is False, invalid_boundary

          def execution_case(content, *, age=5, verifier=False):
              with tempfile.TemporaryDirectory() as td:
                  root = Path(td)
                  logs = root / 'logs'
                  logs.mkdir()
                  name = 'verify-9-deadbeef.log' if verifier else 'issue-9.log'
                  log = logs / name
                  log.write_text(content)
                  os.utime(log, (now - age, now - age))
                  stub.BRIDGE_STATE['evidence/repo'] = root
                  return mod._execution_readiness('evidence/repo', now, verifier=verifier)

          blocked = execution_case('exit=1\nSTDOUT\nInsufficient balance\n')
          assert blocked['state'] == 'blocked', blocked
          assert blocked['reason_code'] == 'provider-balance', blocked
          assert blocked['reason'] == 'provider balance unavailable', blocked
          assert blocked['last_run_ref'] == 'issue-9', blocked
          auth = execution_case('exit=1\nSTDERR\nstatusCode 401 unauthorized\n')
          assert auth['reason_code'] == 'provider-auth', auth
          rate = execution_case('exit=1\nSTDERR\nstatus 429 rate limit\n')
          assert rate['reason_code'] == 'provider-rate-limit', rate
          ready = execution_case('exit=0\nSTDOUT\ncompleted\n', verifier=True)
          assert ready['state'] == 'ready', ready
          assert ready['reason_code'] == 'success', ready
          assert ready['last_run_ref'] == 'verify-9-deadbeef', ready
          stale = execution_case('exit=1\nSTDOUT\nInsufficient balance\n', age=mod.EXECUTION_EVIDENCE_FRESH_SECONDS + 1)
          assert stale['state'] == 'unknown', stale
          assert stale['reason_code'] == 'stale-evidence', stale

          mod.BRIDGE_CACHE['at'] = 0.0
          mod.BRIDGE_CACHE['value'] = {}
          mod.time.time = lambda: now
          mod._service_state = lambda service: 'active'
          mod._pending_runs = lambda repo, current: {
              'count': 1,
              'oldest_age_seconds': mod.BRIDGE_STALL_SECONDS + 30,
              'active_updated_at': int(now - mod.BRIDGE_STALL_SECONDS - 30),
              'active_issue_number': 101,
          } if 'stickdeath-byte' in repo else {
              'count': 0,
              'oldest_age_seconds': None,
              'active_updated_at': None,
              'active_issue_number': 0,
          }
          mod._latest_bridge_activity = lambda repo, **kwargs: (
              now - mod.BRIDGE_STALL_SECONDS - 10 if 'stickdeath-byte' in repo else None,
              True,
          )
          mod._active_executor = lambda repo, boundary: {
              'running': False, 'count': 0, 'active_run_ref': '', 'active_issue_number': 0,
              'active_model': '', 'evidence_complete': True,
          }
          bridges = mod._bridge_health()
          assert bridges['stickdeath']['state'] == 'failed', bridges
          assert bridges['stickdeath']['progress_state'] == 'stalled', bridges
          assert bridges['stickdeath']['execution_state'] == 'unknown', bridges
          assert bridges['vitros']['state'] == 'healthy', bridges
          assert bridges['vitros']['progress_state'] == 'idle', bridges
          assert bridges['vitros_verifier']['state'] == 'healthy', bridges
          assert bridges['vitros_verifier']['pending_observable'] is False, bridges
          assert bridges['vitros_verifier']['required'] is True, bridges

          mod.BRIDGE_CACHE['at'] = 0.0
          mod.BRIDGE_CACHE['value'] = {}
          mod._pending_runs = lambda repo, current: {'count': 0, 'oldest_age_seconds': None, 'active_updated_at': None, 'active_issue_number': 0}
          mod._latest_bridge_activity = lambda repo, **kwargs: (now - 2, True)
          mod._active_executor = lambda repo, boundary: {
              'running': boundary == 'stickdeath',
              'count': 1 if boundary == 'stickdeath' else 0,
              'active_run_ref': 'issue-105' if boundary == 'stickdeath' else '',
              'active_issue_number': 105 if boundary == 'stickdeath' else 0,
              'active_model': 'opencode/nemotron-3.5-lightning-free' if boundary == 'stickdeath' else '',
              'evidence_complete': True,
          }
          externally_running = mod._bridge_health()
          assert externally_running['stickdeath']['state'] == 'healthy', externally_running
          assert externally_running['stickdeath']['progress_state'] == 'running', externally_running
          assert externally_running['stickdeath']['active_run_ref'] == 'issue-105', externally_running
          assert externally_running['stickdeath']['active_model'] == '', externally_running
          assert externally_running['stickdeath']['pending_count'] == 0, externally_running
          assert externally_running['stickdeath']['execution_source'] == 'external-bridge', externally_running
          assert externally_running['stickdeath']['external_running'] is True, externally_running
          assert externally_running['stickdeath']['external_executor_count'] == 1, externally_running
          assert externally_running['stickdeath']['external_issue_number'] == 105, externally_running
          assert externally_running['stickdeath']['execution_state'] == 'running', externally_running
          assert externally_running['stickdeath']['execution_reason_code'] == 'active-executor', externally_running
          assert externally_running['stickdeath']['execution_reason'] == 'active external executor observed; completion pending', externally_running

          mod.BRIDGE_CACHE['at'] = 0.0
          mod.BRIDGE_CACHE['value'] = {}
          mod._active_executor = lambda repo, boundary: {
              'running': boundary == 'stickdeath',
              'count': 1 if boundary == 'stickdeath' else 0,
              'active_run_ref': 'issue-106' if boundary == 'stickdeath' else '',
              'active_issue_number': 106 if boundary == 'stickdeath' else 0,
              'active_model': '', 'evidence_complete': False,
          }
          partial_positive = mod._bridge_health()
          assert partial_positive['stickdeath']['state'] == 'healthy', partial_positive
          assert partial_positive['stickdeath']['progress_state'] == 'running', partial_positive
          assert partial_positive['stickdeath']['external_running'] is True, partial_positive
          assert partial_positive['stickdeath']['external_evidence_complete'] is False, partial_positive
          assert partial_positive['stickdeath']['execution_state'] == 'running', partial_positive
          assert partial_positive['stickdeath']['execution_reason_code'] == 'active-executor', partial_positive
          assert partial_positive['stickdeath']['execution_reason'] == 'active external executor observed; completion pending', partial_positive

          mod.BRIDGE_CACHE['at'] = 0.0
          mod.BRIDGE_CACHE['value'] = {}
          mod._active_executor = lambda repo, boundary: {
              'running': False, 'count': 0, 'active_run_ref': '', 'active_issue_number': 0,
              'active_model': '', 'evidence_complete': False,
          }
          incomplete = mod._bridge_health()
          assert incomplete['stickdeath']['state'] == 'unknown', incomplete
          assert incomplete['stickdeath']['progress_state'] == 'evidence-incomplete', incomplete

          print('BRIDGE_IDLE_HEALTHY=PASS')
          print('BRIDGE_RUNNING_FRESH=PASS')
          print('BRIDGE_STALLED_FAILS_CLOSED=PASS')
          print('BRIDGE_MISSING_EVIDENCE_UNKNOWN=PASS')
          print('BRIDGE_BOUNDED_SCAN_INCOMPLETE_UNKNOWN=PASS')
          print('BRIDGE_PARTIAL_SCAN_POSITIVE_EXECUTOR=PASS')
          print('BRIDGE_ISSUE_SPECIFIC_ACTIVITY=PASS')
          print('BRIDGE_NESTED_WORKTREE_ACTIVITY=PASS')
          print('VITROS_VERIFIER_REQUIRED_SERVICE_GATE=PASS')
          print('EXECUTION_PROVIDER_BALANCE_CLASSIFICATION=PASS')
          print('EXECUTION_PROVIDER_AUTH_CLASSIFICATION=PASS')
          print('EXECUTION_RATE_LIMIT_CLASSIFICATION=PASS')
          print('EXECUTION_LATER_SUCCESS_RECOVERS=PASS')
          print('EXECUTION_STALE_EVIDENCE_UNKNOWN=PASS')
          print('EXTERNAL_EXECUTOR_APPROVED_ROOT=PASS')
          print('VITROS_BUILDER_EXACT_ROOT=PASS')
          print('VITROS_GENERIC_WORKTREES_ROOT_IGNORED=PASS')
          print('VITROS_VERIFIER_EXACT_ROOT=PASS')
          print('EXTERNAL_EXECUTOR_UNRELATED_IGNORED=PASS')
          print('EXTERNAL_EXECUTOR_PROMPT_NOT_EXPOSED=PASS')
          print('EXTERNAL_EXECUTOR_RUNNING_OVERRIDES_IDLE=PASS')
          print('PROJECT_BYTE_PENDING_SEMANTICS_PRESERVED=PASS')
          print('EXTERNAL_SOURCE_EXPLICIT=PASS')
          print('STICKDEATH_WRITABLE_TARGET=stickdeath-byte')
          print('LEGACY_STICKDEATH_EXECUTOR_REFERENCES=0')
          print('EXTERNAL_EXECUTOR_UNAVAILABLE_FAILS_UNKNOWN=PASS')
          PY
      - name: Prove health path is local, bounded and non-mutating
        shell: bash
        run: |
          set -euo pipefail
          runtime=deploy/project-byte/v4/runtime_server.py
          installer=deploy/project-byte/install.sh
          health=deploy/project-byte/v4/health-runtime.js
          grep -q 'BRIDGE_STALL_SECONDS = 2700' "$runtime"
          grep -q 'BRIDGE_ACTIVITY_SCAN_MAX_ENTRIES = 6000' "$runtime"
          grep -q 'EXECUTION_EVIDENCE_FRESH_SECONDS = 1800' "$runtime"
          grep -q '_execution_readiness' "$runtime"
          grep -q 'execution_state' "$runtime"
          grep -q 'execution_reason_code' "$runtime"
          grep -q 'EXECUTOR_PROCESS_SCAN_MAX_ENTRIES = 8192' "$runtime"
          grep -q 'EXECUTOR_CMDLINE_READ_BYTES = 16384' "$runtime"
          grep -q '"stickdeath": "worktrees"' "$runtime"
          grep -Fq '"stickdeath": ("stickdeath-byte-opencode-bridge.service", "jmw7629/stickdeath-byte", True)' "$runtime"
          ! grep -q 'stickdeath-opencode-bridge.service' "$runtime"
          ! grep -q 'jmw7629/StickDeath-Infinity-' "$runtime"
          grep -q '"vitros": "project-byte-live-builder"' "$runtime"
          grep -q '"vitros_verifier": "verifier-sandboxes"' "$runtime"
          grep -q '_active_executor' "$runtime"
          grep -q 'active_run_ref' "$runtime"
          grep -q 'active_model' "$runtime"
          grep -q 'execution_source' "$runtime"
          grep -q 'external_running' "$runtime"
          grep -q 'external_elapsed_seconds' "$runtime"
          grep -q 'external_activity_age_seconds' "$runtime"
          grep -q 'executor_evidence_complete' "$runtime"
          grep -q "status in ('queued','running')" "$runtime"
          grep -q '_processed_issue_activity' "$runtime"
          grep -q 'progress_evidence_complete' "$runtime"
          grep -q 'last_activity_age_seconds' "$runtime"
          grep -q 'oldest_pending_age_seconds' "$runtime"
          grep -q 'pending_observable' "$runtime"
          grep -q 'progress_state' "$runtime"
          grep -Fq '"vitros_verifier": ("vitros-opencode-verifier.service", "jmw7629/vitros-web-dashboard", True)' "$runtime"
          ! grep -q 'urllib.request' "$runtime"
          ! grep -q 'api.github.com' "$runtime"
          ! grep -q 'github.com' "$runtime"
          ! grep -q 'journalctl' "$runtime"
          ! grep -q 'systemctl.*restart' "$runtime"
          grep -q 'if ! refresh_bridge "$HOME/.config/joeos-opencode-bridge/stickdeath-byte.env" "stickdeath-byte-opencode-bridge.service"; then BRIDGE_REFRESH_FAILURES=1; fi' "$installer"
          ! grep -q 'stickdeath-opencode-bridge.service' "$installer"
          grep -q 'if ! check_bridge_service "vitros-opencode-verifier.service"; then BRIDGE_REFRESH_FAILURES=1; fi' "$installer"
          ! grep -q 'Optional VITROS verifier' "$installer"
          grep -q 'bridgeSummary' "$health"
          ! grep -q '(optional)' "$health"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check HEAD^1...HEAD^2
          else
            git diff --check HEAD^
          fi
          echo 'BRIDGE_LIVENESS_LOCAL_ONLY=PASS'
