name: PROJECT_BYTE Owner Hold Verify

on:
  pull_request:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/**'
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-owner-hold-verify.yml'
  push:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/v4/**'
      - 'deploy/project-byte/install.sh'
      - '.github/workflows/project-byte-owner-hold-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-owner-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Prove marker, queue, health and installer behavior on exact head
        run: python3 deploy/project-byte/v4/test_owner_hold.py
      - name: Prove read-only hold inspector interactions
        run: node deploy/project-byte/v4/test_owner_hold_ui.mjs
      - name: Check syntax and whitespace
        run: |
          bash -n deploy/project-byte/install.sh
          node --check deploy/project-byte/v4/home-inspector.js
          node --check deploy/project-byte/v4/home.js
          node --check deploy/project-byte/v4/health-runtime.js
          git diff --check HEAD^ HEAD
