name: PROJECT_BYTE lock scoped Home hash once

on:
  push:
    branches: [project-byte-deploy]
    paths:
      - '.github/workflows/project-byte-lock-home-hash-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-byte-deploy
          fetch-depth: 0
      - name: Lock verified Home artifact
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_HOME='d47921d127fa7f43ad9cb21a948f54d890d3493d5e296ff9e23be9f7b8f84951'
          ACTUAL_HOME="$(sha256sum deploy/project-byte/v4/home.js | awk '{print $1}')"
          [ "$ACTUAL_HOME" = "$VERIFIED_HOME" ]
          python3 - "$VERIFIED_HOME" <<'PY'
          from pathlib import Path
          import re,sys
          expected=sys.argv[1]
          p=Path('deploy/project-byte/install.sh')
          s=p.read_text()
          s,n=re.subn(r'EXPECTED_HOME="[0-9a-f]{64}"',f'EXPECTED_HOME="{expected}"',s,count=1)
          if n!=1: raise SystemExit('EXPECTED_HOME lock not found exactly once')
          p.write_text(s)
          PY
          bash -n deploy/project-byte/install.sh
          grep -q "EXPECTED_HOME=\"$VERIFIED_HOME\"" deploy/project-byte/install.sh
          git diff --check
      - name: Commit installer hash lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/project-byte/install.sh
          git commit -m 'Lock installer to scoped Home command-center build'
          git push origin HEAD:project-byte-deploy
