name: PROJECT_BYTE Installer Verify

on:
  push:
    branches: [project-byte-deploy]
    paths:
      - 'deploy/project-byte/install.sh'
      - 'deploy/project-byte/v4/**'
      - '.github/workflows/project-byte-installer-verify.yml'
  pull_request:
    branches: [project-byte-deploy]
  workflow_dispatch:

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer and locked artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/project-byte/install.sh
          TMP="$(mktemp -d)"
          cat deploy/project-byte/v4/server/*.part > "$TMP/backend.py"
          cp deploy/project-byte/v4/runtime_server.py "$TMP/server.py"
          cat deploy/project-byte/v4/index/*.part > "$TMP/index.html"
          cp deploy/project-byte/v4/home.js "$TMP/home.js"
          cp deploy/project-byte/v4/home-inspector.js "$TMP/home-inspector.js"
          cp deploy/project-byte/v4/health-runtime.js "$TMP/health-runtime.js"
          cp deploy/project-byte/v4/execution_permissions.py "$TMP/execution_permissions.py"
          PERMISSIONS_SHA="$(sha256sum "$TMP/execution_permissions.py" | awk '{print $1}')"
          BACKEND_SHA="$(sha256sum "$TMP/backend.py" | awk '{print $1}')"
          SERVER_SHA="$(sha256sum "$TMP/server.py" | awk '{print $1}')"
          INDEX_SHA="$(sha256sum "$TMP/index.html" | awk '{print $1}')"
          HOME_SHA="$(sha256sum "$TMP/home.js" | awk '{print $1}')"
          INSPECTOR_SHA="$(sha256sum "$TMP/home-inspector.js" | awk '{print $1}')"
          HEALTH_SHA="$(sha256sum "$TMP/health-runtime.js" | awk '{print $1}')"
          grep -q "EXPECTED_PERMISSIONS=\"$PERMISSIONS_SHA\"" deploy/project-byte/install.sh
          python3 -m py_compile "$TMP/execution_permissions.py"
          grep -q "EXPECTED_BACKEND=\"$BACKEND_SHA\"" deploy/project-byte/install.sh
          grep -q "EXPECTED_SERVER=\"$SERVER_SHA\"" deploy/project-byte/install.sh
          grep -q "EXPECTED_INDEX=\"$INDEX_SHA\"" deploy/project-byte/install.sh
          grep -q "EXPECTED_HOME=\"$HOME_SHA\"" deploy/project-byte/install.sh
          grep -q "EXPECTED_INSPECTOR=\"$INSPECTOR_SHA\"" deploy/project-byte/install.sh
          grep -q "EXPECTED_HEALTH=\"$HEALTH_SHA\"" deploy/project-byte/install.sh
          grep -q 'SERVER_SHA=.*sha256sum' deploy/project-byte/install.sh
          grep -q '\[ "$SERVER_SHA" = "$EXPECTED_SERVER" \]' deploy/project-byte/install.sh
          grep -q 'runtime_server.py' deploy/project-byte/install.sh
          grep -q 'health-runtime.js' deploy/project-byte/install.sh
          grep -q 'evidence-backed health UI' deploy/project-byte/install.sh
          grep -q '"ok":true' deploy/project-byte/install.sh
          ! grep -nE 'curl .*\| *grep -q' deploy/project-byte/install.sh
          grep -q 'live-index.html' deploy/project-byte/install.sh
          grep -q 'live-home-inspector.js' deploy/project-byte/install.sh
          grep -q 'live-health-runtime.js' deploy/project-byte/install.sh
          grep -q 'PROJECT_BYTE_ENABLE_FUNNEL' deploy/project-byte/install.sh
          grep -q 'tailscale funnel --https=443 off' deploy/project-byte/install.sh
          ! grep -q 'sudo tailscale funnel --bg --https=443 --yes 8094$' deploy/project-byte/install.sh
          grep -q 'symbolic-ref --quiet --short HEAD' deploy/project-byte/install.sh
          grep -q '\[ "$branch" != "main" \]' deploy/project-byte/install.sh
          grep -q 'merge --ff-only origin/main' deploy/project-byte/install.sh
          grep -q 'export XDG_RUNTIME_DIR=' deploy/project-byte/install.sh
          grep -q 'export DBUS_SESSION_BUS_ADDRESS=' deploy/project-byte/install.sh
          grep -q 'bridge_service_state()' deploy/project-byte/install.sh
          grep -q 'user service state is unavailable; no fetch, merge, or restart was performed' deploy/project-byte/install.sh
          grep -q 'systemctl --user restart "$service_name"' deploy/project-byte/install.sh
          grep -q 'systemctl --user is-active "$service_name"' deploy/project-byte/install.sh
          ! grep -q 'systemctl --user restart "$service_name" || true' deploy/project-byte/install.sh
          grep -q 'Bridge refreshed and active:' deploy/project-byte/install.sh
          grep -q 'configuration file is absent, so liveness cannot be verified' deploy/project-byte/install.sh
          grep -q 'check_bridge_service "vitros-opencode-verifier.service"' deploy/project-byte/install.sh
          grep -q 'if ! check_bridge_service "vitros-opencode-verifier.service"; then BRIDGE_REFRESH_FAILURES=1; fi' deploy/project-byte/install.sh
          ! grep -q 'Optional VITROS verifier' deploy/project-byte/install.sh
          ! grep -q 'refresh_bridge .*vitros-opencode-verifier.service' deploy/project-byte/install.sh
          grep -q '"/api/approvals"' "$TMP/server.py"
          grep -q 'data-home-approval' "$TMP/home.js"
          grep -q 'homeExecutionFabric' "$TMP/home.js"
          grep -q 'project-byte-health' "$TMP/home.js"
          grep -q 'grid-template-columns:repeat(5,minmax(0,1fr))' "$TMP/health-runtime.js"
          ! grep -q 'board.innerHTML' "$TMP/health-runtime.js"
          ! grep -q 'help.innerHTML' "$TMP/health-runtime.js"
          grep -q "CustomEvent('project-byte-health'" "$TMP/health-runtime.js"
          grep -q 'New work</button>' "$TMP/home.js"
          ! grep -q '>Queue work</button>' "$TMP/home.js"
          grep -q 'data-home-kpi' "$TMP/home.js"
          grep -q 'function homeKpiScope' "$TMP/home.js"
          grep -q 'function renderActivity(scoped)' "$TMP/home.js"
          grep -q 'function renderApprovals(scoped)' "$TMP/home.js"
          grep -q 'function renderPortfolio(scoped)' "$TMP/home.js"
          grep -q 'function renderMemory(scoped)' "$TMP/home.js"
          grep -Fq "chips.push(['self','My work',c.ownerFilter===selfName])" "$TMP/home.js"
          grep -q "a.agent_key!=='executive'" "$TMP/home.js"
          grep -q 'No open work assigned to' "$TMP/home.js"
          grep -q 'data-home-agent="${key}"' "$TMP/home.js"
          grep -Fq "setHomeFilter(pair[0],control?.value===pair[1]?'':pair[1])" "$TMP/home.js"
          grep -q 'Verifying system health…' "$TMP/home.js"
          grep -q 'AI UNKNOWN' "$TMP/home.js"
          ! grep -q 'All systems operational' "$TMP/home.js"
          ! grep -q 'AI READY' "$TMP/home.js"
          ! grep -q 'AI CONNECTED' "$TMP/home.js"
          grep -q 'class SafeHandler(app.H)' "$TMP/server.py"
          grep -q 'health_snapshot' "$TMP/server.py"
          grep -q 'truthful_sync_loop' "$TMP/server.py"
          grep -q 'BRIDGE_CACHE_SECONDS = 10.0' "$TMP/server.py"
          grep -q 'BRIDGE_STALL_SECONDS = 2700' "$TMP/server.py"
          grep -q 'MODEL_STATUS_FRESH_SECONDS = 1800' "$TMP/server.py"
          grep -q 'EXECUTION_EVIDENCE_FRESH_SECONDS = 1800' "$TMP/server.py"
          grep -q '_execution_readiness' "$TMP/server.py"
          grep -q 'execution_state' "$TMP/server.py"
          grep -q 'execution_reason_code' "$TMP/server.py"
          grep -q 'EXECUTOR_PROCESS_SCAN_MAX_ENTRIES = 8192' "$TMP/server.py"
          grep -q '_active_executor' "$TMP/server.py"
          grep -q 'active_run_ref' "$TMP/server.py"
          grep -q 'active_model' "$TMP/server.py"
          grep -q '"vitros": "project-byte-live-builder"' "$TMP/server.py"
          grep -q 'executor_evidence_complete' "$TMP/server.py"
          grep -q 'freshness_window_seconds' "$TMP/server.py"
          grep -Fq '"vitros_verifier": ("vitros-opencode-verifier.service", "jmw7629/vitros-web-dashboard", True)' "$TMP/server.py"
          grep -q "status in ('queued','running')" "$TMP/server.py"
          grep -q 'progress_state' "$TMP/server.py"
          grep -q 'stall_after_seconds' "$TMP/server.py"
          grep -q 'pending_observable' "$TMP/server.py"
          grep -q 'ai_chat_ready' "$TMP/server.py"
          grep -q 'operational-with-warnings' "$TMP/server.py"
          grep -q 'systemctl.*--user.*is-active' "$TMP/server.py"
          grep -q 'Path(stored).name != stored' "$TMP/server.py"
          grep -q 'select stored_name,content_type from attachments where stored_name=?' "$TMP/server.py"
          grep -q 'Verifying system health' "$TMP/health-runtime.js"
          grep -q 'Systems verified operational' "$TMP/health-runtime.js"
          grep -q 'AI CHAT TESTED OK' "$TMP/health-runtime.js"
          grep -q 'AI CHAT UNTESTED' "$TMP/health-runtime.js"
          grep -q 'bridgeSummary' "$TMP/health-runtime.js"
          grep -q 'Process:' "$TMP/health-runtime.js"
          grep -q 'Execution:' "$TMP/health-runtime.js"
          grep -q 'Active:' "$TMP/health-runtime.js"
          ! grep -q '(optional)' "$TMP/health-runtime.js"
          ! grep -q 'MutationObserver' "$TMP/health-runtime.js"
          grep -q 'open Agents or Help for details' "$TMP/health-runtime.js"
          node --check "$TMP/home.js"
          node --check "$TMP/home-inspector.js"
          node --check "$TMP/health-runtime.js"
          python3 -m py_compile "$TMP/backend.py" "$TMP/server.py"
          echo "INSTALLER_LOCK=PASS backend=$BACKEND_SHA runtime=$SERVER_SHA ui=$INDEX_SHA home=$HOME_SHA inspector=$INSPECTOR_SHA health=$HEALTH_SHA"
