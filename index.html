          if (!type) return;
          recordObjectVisit({ object_type: type, object_id: id, label: ref.label || ref.display_hint });
          if (type === "agent") { selectSection("agents"); if (id) selectAgentFromApi(id); }
          else if (type === "agent_run" || type === "mission") { window.location.href = "/os/agents?mission=" + encodeURIComponent(id || ""); }
          else if (type === "automation" || type === "schedule" || type === "workflow") { window.location.href = "/os/automations?workflow=" + encodeURIComponent(id || ""); }
          else if (type === "model") { window.location.href = "/os/agents?model=" + encodeURIComponent(id || ""); }
          else if (type === "provider") { window.location.href = "/os/agents?provider=" + encodeURIComponent(id || ""); }
          else if (type === "approval") { selectSection("security-center"); }
          else if (type === "execution") { window.location.href = "/os/automations?execution=" + encodeURIComponent(id || ""); }
          else if (type === "file" || type === "folder" || type === "artifact") { selectSection("files"); }
          else if (type === "memory") { selectSection("memory"); }
          else if (type === "conversation") { selectSection("communications"); }
          else if (type === "device" || type === "machine") { selectSection("device-enrollment"); }
          else { selectSection("command"); }
        }

        // ---- Universal Recents / Favorites (policy-safe ObjectRef store) ----
        function readRecentObjects() {
          try {
            var raw = window.localStorage.getItem("joeos:recent-objects");
            var parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed.slice(0, 12) : [];
          } catch (error) { return []; }
        }
        function readPinnedObjects() {
          try {
            var raw = window.localStorage.getItem("joeos:pinned-objects");
            var parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed.slice(0, 24) : [];
          } catch (error) { return []; }
        }
        function persistRecents(next) {
          setRecentObjects(next);
          try { window.localStorage.setItem("joeos:recent-objects", JSON.stringify(next)); } catch (error) {}
        }
        function persistPinned(next) {
          setPinnedObjects(next);
          try { window.localStorage.setItem("joeos:pinned-objects", JSON.stringify(next)); } catch (error) {}
        }
        function recordObjectVisit(ref) {
          if (!ref || !ref.object_id) return;
          var key = ref.object_type + "/" + ref.object_id;
          var next = readRecentObjects().filter(function (r) { return !(r.object_type + "/" + r.object_id === key); });
          next.unshift({ object_type: ref.object_type, object_id: ref.object_id, label: ref.label || ref.display_hint || ref.object_id, at: Date.now() });
          persistRecents(next.slice(0, 12));
        }
        function pinObjectRef(ref) {
          if (!ref || !ref.object_id) return;
          var key = ref.object_type + "/" + ref.object_id;
          var next = readPinnedObjects().filter(function (r) { return !(r.object_type + "/" + r.object_id === key); });
          next.unshift({ object_type: ref.object_type, object_id: ref.object_id, label: ref.label || ref.display_hint || ref.object_id });
          persistPinned(next.slice(0, 24));
        }
        function unpinObjectRef(ref) {
          var key = (ref.object_type || ref.type) + "/" + (ref.object_id || ref.id);
          persistPinned(readPinnedObjects().filter(function (r) { return !(r.object_type + "/" + r.object_id === key); }));
        }
        function objectRefKey(ref) {
          return (ref.object_type || ref.type) + "/" + (ref.object_id || ref.id);
        }

        // ---- Workspace snapshots (presentation context, no secrets) ----
        function readWorkspaceSnapshots() {
          try {
            var raw = window.localStorage.getItem("joeos:snapshots");
            var parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
          } catch (error) { return []; }
        }
        function persistWorkspaceSnapshots(next) {
          try { window.localStorage.setItem("joeos:snapshots", JSON.stringify(next)); } catch (error) {}
        }
        function saveWorkspaceSnapshot(name) {
          var snapshots = readWorkspaceSnapshots();
          snapshots = snapshots.filter(function (s) { return s.name !== name; });
          var payload = {
            name: name,
            saved_at: new Date().toISOString(),
            command_layout: readLayoutPrefs(),
            pinned: readPinnedObjects(),
            recent: readRecentObjects(),
            active_section: active,
            quick_look: quickLook ? { object_type: quickLook.object_type || quickLook.type, object_id: quickLook.object_id || quickLook.id, label: quickLook.label || quickLook.display_hint } : null,
          };
          snapshots.push(payload);
          persistWorkspaceSnapshots(snapshots.slice(-12));
          return payload;
        }
        function restoreWorkspaceSnapshot(name) {
          var snapshots = readWorkspaceSnapshots();
          var target = snapshots.find(function (s) { return s.name === name; });
          if (!target) return false;
          if (target.command_layout) {
            try {
              var raw = window.localStorage.getItem("joeos:ui-prefs");
              var parsed = raw ? JSON.parse(raw) : {};
              parsed.command_layout = target.command_layout;
              window.localStorage.setItem("joeos:ui-prefs", JSON.stringify(parsed));
            } catch (error) {}
          }
          persistPinned(target.pinned || []);
          persistRecents(target.recent || []);
          if (target.active_section && selectSection) selectSection(target.active_section);
          if (target.quick_look && setQuickLook) setQuickLook(target.quick_look);
          return true;
        }
        function readLayoutPrefs() {
          try {
            var raw = window.localStorage.getItem("joeos:ui-prefs");
            var parsed = raw ? JSON.parse(raw) : {};
            return parsed.command_layout || null;
          } catch (error) { return null; }
        }

          // Actionable palette results: Open + type-appropriate primary action.

        async function streamAssistantEvents(history, signal, onEvent) {
          var response = await window.fetch("/api/v1/ai/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history, model: assistantModelRef.current, context: assistantContextRef.current || null }),
            signal: signal

            var detail = null;
            try { detail = await response.json(); } catch (error) {}
            var requestError = new Error((detail && (detail.detail || detail.message)) || ("Request failed with status " + response.status));
            throw requestError;
          }
          if (!response.body || !response.body.getReader) throw new Error("Streaming is not supported in this browser.");
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";
          while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;
            buffer += decoder.decode(chunk.value, { stream: true });
            var lines = buffer.split("\n");
            buffer = lines.pop();
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim();
              if (line.indexOf("data:") === 0) {
                var raw = line.slice(5).trim();
                if (!raw) continue;
                try { onEvent(JSON.parse(raw)); } catch (error) {}
              }
            }
          }
        }
