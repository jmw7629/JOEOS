<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050912">
  <meta name="description" content="JoeOS private VPS command center">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JoeOS">
  <meta name="format-detection" content="telephone=no">
  <title>JoeOS — VPS Command Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/joeos-icon.svg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308111f'/%3E%3Cpath d='M32 9 53 20v24L32 55 11 44V20Z' fill='none' stroke='%2331d7ff' stroke-width='5'/%3E%3Cpath d='m21 39 11-22 11 22h-7l-4-9-4 9Z' fill='%2331d7ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root {
      color-scheme: dark;
      --canvas: #050912;
      --canvas-2: #07101d;
      --surface: rgba(10, 22, 39, 0.76);
      --surface-strong: rgba(12, 27, 47, 0.94);
      --surface-soft: rgba(17, 34, 55, 0.54);
      --line: rgba(139, 212, 255, 0.12);
      --line-strong: rgba(71, 211, 255, 0.34);
      --text: #eaf6ff;
      --muted: #91a6ba;
      --faint: #60758a;
      --cyan: #31d7ff;
      --cyan-soft: #75e6ff;
      --blue: #5577ff;
      --success: #3de3a4;
      --warning: #ffb45c;
      --danger: #ff647c;
      --purple: #a78bfa;
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
      --sidebar: 250px;
      --topbar: 72px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --shadow: 0 24px 70px rgba(0, 4, 12, 0.36);
      --font-scale: 1;
      --glass-opacity: .78;
      --workspace-radius: 16px;
      --workspace-gap: 14px;
      --workspace-font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      /* Semantic design tokens — one authoritative registry. */
      --color-background-canvas: var(--canvas);
      --color-background-surface: var(--surface);
      --color-background-elevated: var(--surface-strong);
      --color-background-overlay: rgba(2, 6, 12, 0.72);
      --color-text-primary: var(--text);
      --color-text-secondary: var(--muted);
      --color-text-muted: var(--faint);
      --color-border-subtle: var(--line);
      --color-border-strong: var(--line-strong);
      --color-focus-ring: var(--cyan);
      --color-status-info: var(--cyan);
      --color-status-success: var(--success);
      --color-status-warning: var(--warning);
      --color-status-error: var(--danger);
      --color-status-critical: #ff3b5c;
      --color-status-security: var(--purple);
      --color-action-primary: var(--cyan);
      --color-action-destructive: var(--danger);
      --color-selection: rgba(49, 215, 255, 0.22);
      --color-code-added: var(--success);
      --color-code-removed: var(--danger);
      --spacing-control-inline: 12px;
      --spacing-panel: 16px;
      --radius-control: 10px;
      --radius-panel: 16px;
      --elevation-popover: 0 12px 32px rgba(0, 4, 12, 0.4);
      --elevation-dialog: 0 28px 80px rgba(0, 4, 12, 0.5);
      --duration-fast: 140ms;
      --duration-standard: 240ms;
      --duration-slow: 420ms;
      --motion-ease: var(--ease);
      --z-dock: 100;
      --z-topbar: 120;
      --z-popover: 300;
      --z-dialog: 400;
      --z-toast: 500;
      --z-skip-link: 600;
      --touch-target: 44px;
      --ui-density: 0px;
      --surface-blur: blur(18px);
      --surface-blur-strong: blur(26px);

      /* JoeOS embossed depth system — machined 3D surface language. */
      --depth-recessed: inset 0 1px 2px rgba(0, 0, 0, 0.5), inset 0 -1px 0 rgba(139, 212, 255, 0.04);
      --depth-flat: 0 0 0 1px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(139, 212, 255, 0.02);
      --depth-raised-1: 0 1px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(139, 212, 255, 0.06);
      --depth-raised-2: 0 1px 0 rgba(0, 0, 0, 0.5), 0 5px 14px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(139, 212, 255, 0.08);
      --depth-raised-3: 0 2px 0 rgba(0, 0, 0, 0.5), 0 12px 30px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(139, 212, 255, 0.1);
      --depth-floating: 0 2px 0 rgba(0, 0, 0, 0.5), 0 20px 52px rgba(0, 0, 0, 0.46), inset 0 1px 0 rgba(139, 212, 255, 0.12);
      --depth-pressed: inset 0 2px 4px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(139, 212, 255, 0.04);
      --depth-active-edge: 0 0 0 1px rgba(49, 215, 255, 0.42), 0 6px 20px rgba(49, 215, 255, 0.14), inset 0 1px 0 rgba(139, 212, 255, 0.16);
      --bevel-high: inset 0 1px 0 rgba(139, 212, 255, 0.07);
      --bevel-low: inset 0 -1px 0 rgba(0, 0, 0, 0.42);
      --metal-edge: linear-gradient(180deg, rgba(184, 192, 204, 0.16), rgba(184, 192, 204, 0.02) 40%, rgba(0, 0, 0, 0.35));
    }

    /* Light theme — a functional, contrast-checked presentation. */
    html[data-theme="light"] {
      color-scheme: light;
      --canvas: #eef4fb;
      --canvas-2: #e3ecf7;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --surface-soft: rgba(255, 255, 255, 0.68);
      --line: rgba(30, 64, 96, 0.16);
      --line-strong: rgba(24, 96, 140, 0.42);
      --text: #10232f;
      --muted: #3d5a70;
      --faint: #5d7489;
      --cyan: #0778a8;
      --cyan-soft: #0a8fc4;
      --blue: #3347c8;
      --success: #0e7a55;
      --warning: #9a5b00;
      --danger: #c2263f;
      --purple: #6d4bd0;
      --shadow: 0 18px 50px rgba(30, 58, 90, 0.16);
      --color-background-overlay: rgba(16, 35, 47, 0.4);
      --color-selection: rgba(7, 120, 168, 0.18);
      --color-status-critical: #b31232;
    }

    /* High-contrast presentation — status never depends on color alone. */
    html[data-contrast="high"] {
      --text: #ffffff;
      --muted: #c8d8e6;
      --faint: #9fb4c6;
      --line: rgba(139, 212, 255, 0.32);
      --line-strong: rgba(71, 211, 255, 0.6);
      --color-text-primary: #ffffff;
      --color-text-secondary: #d6e4f0;
      --color-text-muted: #aebfce;
      --color-border-subtle: rgba(139, 212, 255, 0.32);
      --color-border-strong: rgba(71, 211, 255, 0.6);
      --color-focus-ring: #7df0ff;
    }
    html[data-contrast="high"][data-theme="light"] {
      --text: #07131c;
      --muted: #1f3a4d;
      --faint: #2f4d63;
      --line: rgba(10, 60, 96, 0.5);
      --line-strong: rgba(6, 52, 88, 0.72);
      --color-text-primary: #07131c;
      --color-text-secondary: #173247;
      --color-text-muted: #27455b;
      --color-focus-ring: #004f8a;
    }

    /* Reduced-effects presentation — blur/glow removed while readability holds. */
    html[data-effects="reduced"] {
      --surface-blur: none;
      --surface-blur-strong: none;
    }
    html[data-effects="reduced"] .glass-card,
    html[data-effects="reduced"] .modal,
    html[data-effects="reduced"] .command-palette,
    html[data-effects="reduced"] .assistant-panel,
    html[data-effects="reduced"] .sidebar,
    html[data-effects="reduced"] .toast {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: var(--surface-strong);
    }

    /* Density modes — compact tightens rows; comfortable relaxes them. */
    html[data-density="compact"] {
      --ui-density: -4px;
      --cc-row-scale: .9;
      --cc-meta-show: none;
    }
    html[data-density="comfortable"] {
      --ui-density: 6px;
      --cc-row-scale: 1;
      --cc-meta-show: inline;
    }
    html[data-density="command"] {
      --ui-density: -8px;
      --cc-row-scale: .78;
      --cc-meta-show: none;
      --cc-metric-scale: .85;
    }
    html[data-density="command"] .cc-module-detail,
    html[data-density="command"] .cc-inspector-meta,
    html[data-density="command"] .cc-timeline-copy span {
      font-size: 10.5px;
    }
    html[data-density="command"] .cc-module {
      padding: 10px 12px;
      gap: 7px;
    }
    html[data-density="command"] .cc-module-value {
      font-size: 17px;
    }
    html[data-density="command"] .attention-card {
      padding: 11px 12px;
    }

    /* Reduced motion — media preference and the explicit setting. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
    html[data-motion="reduced"] *,
    html[data-motion="reduced"] *::before,
    html[data-motion="reduced"] *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }

    /* Skip link for keyboard users — first focusable element in the document. */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: var(--z-skip-link);
      padding: 12px 18px;
      border-radius: 0 0 var(--radius-control) 0;
      background: var(--color-background-elevated);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-strong);
      font-weight: 700;
    }
    .skip-link:focus-visible {
      left: 0;
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--canvas);
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 78% -10%, rgba(38, 115, 255, 0.14), transparent 36%),
        radial-gradient(circle at 18% 25%, rgba(49, 215, 255, 0.065), transparent 30%),
        linear-gradient(145deg, var(--canvas) 0%, var(--canvas-2) 46%, var(--canvas) 100%);
      color: var(--text);
      font-family: var(--workspace-font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      background-image:
        linear-gradient(rgba(83, 143, 181, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(83, 143, 181, 0.025) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    button,
    input,
    select,
    textarea {
      color: inherit;
      font: inherit;
    }

    button {
      border: 0;
    }

    button,
    select {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    ::selection {
      background: rgba(49, 215, 255, 0.25);
      color: #fff;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(2, 8, 16, 0.55);
    }

    ::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: rgba(127, 179, 210, 0.26);
      background-clip: padding-box;
    }

    /* Coarse-pointer devices get larger, unambiguous touch targets. */
    @media (pointer: coarse) {
      .icon-button,
      .nav-button,
      .palette-item,
      .quick-command,
      .widget-tool,
      .row-action {
        min-height: 44px;
      }
      .icon-button {
        width: 44px;
        height: 44px;
      }
    }

    /* Text-only buttons keep a visible focus ring. */
    .text-button:focus-visible,
    .secondary-button:focus-visible,
    .primary-button:focus-visible,
    .compact-button:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .boot {
      display: grid;
      min-height: 100vh;
      place-items: center;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .boot i {
      margin-right: 12px;
      color: var(--cyan);
    }

    .app-shell {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .glass-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--workspace-radius, var(--radius));
      background: linear-gradient(145deg, rgba(15, 31, 51, var(--glass-opacity)), rgba(7, 17, 31, calc(var(--glass-opacity) - .06)));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.025);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .glass-card::before {
      position: absolute;
      top: 0;
      left: 12%;
      width: 52%;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(110, 222, 255, .32), transparent);
      pointer-events: none;
    }

    .interactive-card {
      transition: transform .28s var(--ease), border-color .28s var(--ease), box-shadow .28s var(--ease);
    }

    .interactive-card:hover {
      transform: translateY(-2px);
      border-color: rgba(88, 205, 255, 0.24);
      box-shadow: 0 26px 74px rgba(0, 5, 14, .45), 0 0 34px rgba(31, 183, 255, .035);
    }

    .sidebar {
      position: fixed;
      z-index: 50;
      top: 16px;
      bottom: 16px;
      left: 16px;
      display: flex;
      width: var(--sidebar);
      flex-direction: column;
      padding: 19px 14px 14px;
      border: 1px solid rgba(126, 209, 255, .14);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(11, 27, 47, .94), rgba(5, 14, 27, .9));
      box-shadow: 20px 0 70px rgba(0, 4, 12, .28), inset 0 1px rgba(255, 255, 255, .025);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
    }

    .brand {
      display: flex;
      align-items: center;
      min-height: 46px;
      padding: 0 8px;
      gap: 11px;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 39px;
      height: 39px;
      flex: 0 0 39px;
      place-items: center;
      border: 1px solid rgba(86, 220, 255, .42);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(49, 215, 255, .18), rgba(85, 119, 255, .16));
      box-shadow: 0 0 24px rgba(49, 215, 255, .16), inset 0 0 18px rgba(49, 215, 255, .05);
      color: var(--cyan);
      font-size: 17px;
    }

    .brand-mark::after {
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 8px;
      height: 8px;
      border: 2px solid #091321;
      border-radius: 50%;
      background: var(--success);
      content: "";
      box-shadow: 0 0 10px var(--success);
    }

    .brand-copy strong {
      display: block;
      color: #f2fbff;
      font-size: 14px;
      letter-spacing: .14em;
      line-height: 1.15;
    }

    .brand-copy span {
      color: var(--faint);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .environment-pill {
      display: flex;
      align-items: center;
      min-height: 47px;
      margin: 20px 3px 18px;
      padding: 9px 11px;
      border: 1px solid rgba(129, 208, 255, .1);
      border-radius: 12px;
      background: rgba(9, 23, 40, .7);
      gap: 10px;
    }

    .environment-icon {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 9px;
      background: rgba(61, 227, 164, .1);
      color: var(--success);
      font-size: 12px;
    }

    .environment-copy {
      min-width: 0;
      flex: 1;
    }

    .environment-copy small {
      display: block;
      margin-bottom: 2px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .environment-copy span {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      color: var(--faint);
      font-size: 9px;
    }

    .nav-caption {
      margin: 0 12px 8px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .nav-list {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      min-height: 0;
      padding: 4px 2px 4px 0;
      scrollbar-width: thin;
    }
    .nav-list::-webkit-scrollbar { width: 6px; }
    .nav-list::-webkit-scrollbar-thumb { background: rgba(139, 212, 255, 0.16); border-radius: 3px; }

    .nav-button {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 46px;
      align-items: center;
      padding: 0 11px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: #8298ab;
      text-align: left;
      transition: color .22s var(--ease), background .22s var(--ease), border-color .22s var(--ease);
      gap: 11px;
    }

    .nav-button:hover {
      background: rgba(83, 159, 203, .075);
      color: #c8dcea;
    }

    .nav-button.active {
      border-color: rgba(49, 215, 255, .15);
      background: linear-gradient(90deg, rgba(49, 215, 255, .12), rgba(85, 119, 255, .04));
      color: #e9f9ff;
    }

    .nav-button.active::before {
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: -15px;
      width: 3px;
      border-radius: 0 4px 4px 0;
      background: var(--cyan);
      box-shadow: 0 0 13px var(--cyan);
      content: "";
    }

    .nav-icon {
      display: grid;
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      place-items: center;
      border-radius: 8px;
      color: #71899e;
      font-size: 12px;
      transition: color .22s var(--ease), background .22s var(--ease);
    }

    .nav-button.active .nav-icon {
      background: rgba(49, 215, 255, .1);
      color: var(--cyan);
    }

    .nav-label {
      flex: 1;
      font-size: 12px;
      font-weight: 700;
    }

    .nav-badge {
      min-width: 20px;
      padding: 3px 6px;
      border-radius: 999px;
      background: rgba(255, 100, 124, .12);
      color: #ff91a3;
      font-size: 9px;
      font-weight: 800;
      text-align: center;
    }

    .sidebar-spacer {
      flex: 1;
      min-height: 18px;
    }

    .sidebar-footer {
      padding: 13px 12px 10px;
      border: 1px solid rgba(126, 209, 255, .09);
      border-radius: 13px;
      background: rgba(6, 16, 29, .58);
    }

    .footer-status {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      color: #b7cbd9;
      font-size: 11px;
      font-weight: 700;
      gap: 8px;
    }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px rgba(61, 227, 164, .8);
      animation: pulse 2s infinite;
    }

    .live-dot.offline {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(255, 100, 124, .7);
    }

    .live-dot.checking {
      background: var(--warning);
      box-shadow: 0 0 10px rgba(255, 180, 92, .7);
    }

    .footer-meta {
      display: flex;
      justify-content: space-between;
      color: var(--faint);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
    }

    .main-shell {
      min-width: 0;
      min-height: 100vh;
      margin-left: calc(var(--sidebar) + 32px);
      transition: margin-right .32s var(--ease);
    }

    .topbar {
      position: sticky;
      z-index: 40;
      top: 0;
      display: flex;
      height: var(--topbar);
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid rgba(123, 207, 255, .08);
      background: linear-gradient(to bottom, rgba(5, 10, 19, .93), rgba(5, 10, 19, .72));
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
    }

    .topbar-left {
      min-width: 0;
      gap: 13px;
    }

    .topbar-right {
      gap: 9px;
    }

    .icon-button.mobile-menu-button {
      display: none;
    }

    .breadcrumb {
      min-width: 0;
    }

    .breadcrumb small {
      display: block;
      margin-bottom: 2px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .breadcrumb strong {
      display: block;
      overflow: hidden;
      color: #dcecf6;
      font-size: 14px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .global-status {
      display: flex;
      min-height: 35px;
      align-items: center;
      padding: 0 12px;
      border: 1px solid rgba(61, 227, 164, .15);
      border-radius: 999px;
      background: rgba(61, 227, 164, .055);
      color: #bcefdc;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .02em;
      gap: 8px;
    }

    .global-status.offline {
      border-color: rgba(255, 100, 124, .2);
      background: rgba(255, 100, 124, .065);
      color: #ffc0ca;
    }

    .global-status.checking {
      border-color: rgba(255, 180, 92, .2);
      background: rgba(255, 180, 92, .06);
      color: #ffd4a2;
    }

    .topbar-clock {
      min-width: 68px;
      padding: 0 7px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      text-align: right;
    }

    .icon-button {
      position: relative;
      display: inline-grid;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      place-items: center;
      border: 1px solid rgba(129, 208, 255, .11);
      border-radius: 12px;
      background: rgba(12, 28, 47, .66);
      color: #91a8ba;
      transition: color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), background .2s var(--ease);
    }

    .icon-button:hover {
      border-color: rgba(49, 215, 255, .28);
      background: rgba(20, 47, 70, .76);
      color: var(--cyan-soft);
    }

    .icon-button:active,
    .primary-button:active,
    .secondary-button:active,
    .compact-button:active {
      transform: scale(.97);
    }

    .notification-count {
      position: absolute;
      top: -4px;
      right: -4px;
      display: grid;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      place-items: center;
      border: 2px solid #07101c;
      border-radius: 999px;
      background: var(--danger);
      color: white;
      font-size: 8px;
      font-weight: 900;
    }

    .assistant-top-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      padding: 0 14px;
      border: 1px solid rgba(49, 215, 255, .24);
      border-radius: 12px;
      background: linear-gradient(120deg, rgba(49, 215, 255, .13), rgba(85, 119, 255, .11));
      color: #dff8ff;
      font-size: 11px;
      font-weight: 800;
      gap: 9px;
      transition: border-color .2s, background .2s, transform .2s;
    }

    .assistant-top-orb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(120% 120% at 30% 24%, rgba(120, 210, 255, .95), rgba(30, 130, 200, .95) 45%, rgba(20, 60, 150, .98) 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .4), inset 0 -2px 4px rgba(0, 20, 60, .6), 0 0 10px rgba(49, 215, 255, .35);
    }

    .assistant-top-button:hover {
      border-color: rgba(49, 215, 255, .42);
      background: linear-gradient(120deg, rgba(49, 215, 255, .2), rgba(85, 119, 255, .16));
      transform: translateY(-1px);
    }

    .assistant-top-button i {
      color: var(--cyan);
    }

    .notification-wrap {
      position: relative;
    }

    .notification-panel {
      position: absolute;
      z-index: 120;
      top: 48px;
      right: 0;
      width: min(350px, calc(100vw - 24px));
      padding: 9px;
      border: 1px solid rgba(125, 211, 255, .17);
      border-radius: 16px;
      background: rgba(8, 21, 37, .98);
      box-shadow: 0 24px 80px rgba(0, 3, 10, .65);
      animation: dropIn .2s var(--ease);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
    }

    .notification-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px 10px;
    }

    .notification-header strong {
      font-size: 12px;
    }

    .text-button {
      padding: 6px;
      background: transparent;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
    }

    .notification-item {
      display: grid;
      grid-template-columns: 30px 1fr;
      padding: 10px 8px;
      border-top: 1px solid rgba(129, 208, 255, .075);
      gap: 10px;
    }

    .notification-item.unread {
      border-radius: 10px;
      background: rgba(49, 215, 255, .035);
    }

    .notification-item i {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 8px;
      background: rgba(49, 215, 255, .08);
      color: var(--cyan);
      font-size: 11px;
    }

    .notification-item strong {
      display: block;
      margin-bottom: 3px;
      color: #dcecf5;
      font-size: 10px;
    }

    .notification-item p {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .notification-item time {
      display: block;
      margin-top: 5px;
      color: var(--faint);
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .content {
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 30px 28px 56px;
    }

    .page-enter {
      animation: pageIn .42s var(--ease) both;
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 20px;
    }

    .section-kicker {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      color: var(--cyan);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .18em;
      text-transform: uppercase;
      gap: 8px;
    }

    .section-kicker::before {
      width: 18px;
      height: 1px;
      background: var(--cyan);
      content: "";
      box-shadow: 0 0 8px var(--cyan);
    }

    .section-heading h1 {
      margin: 0;
      color: #eefaff;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 720;
      letter-spacing: -.035em;
      line-height: 1.1;
    }

    .section-heading p {
      max-width: 690px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .heading-actions,
    .control-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .primary-button,
    .secondary-button,
    .compact-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .015em;
      transition: transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
      gap: 8px;
    }

    .primary-button {
      padding: 0 15px;
      border: 1px solid rgba(86, 219, 255, .46);
      background: linear-gradient(135deg, rgba(49, 215, 255, .22), rgba(62, 104, 255, .28));
      box-shadow: 0 10px 28px rgba(34, 150, 222, .12), inset 0 1px rgba(255, 255, 255, .09);
      color: #effcff;
    }

    .primary-button:hover {
      border-color: rgba(104, 229, 255, .72);
      background: linear-gradient(135deg, rgba(49, 215, 255, .29), rgba(62, 104, 255, .35));
    }

    .secondary-button {
      padding: 0 14px;
      border: 1px solid rgba(125, 205, 255, .13);
      background: rgba(11, 27, 46, .65);
      color: #a9bdcc;
    }

    .secondary-button:hover {
      border-color: rgba(49, 215, 255, .28);
      color: #dbf5ff;
    }

    .compact-button {
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid rgba(125, 205, 255, .13);
      background: rgba(11, 27, 46, .67);
      color: #a8bdcc;
    }

    .compact-button:hover {
      border-color: rgba(49, 215, 255, .28);
      color: #e2f7ff;
    }

    .compact-button.danger:hover {
      border-color: rgba(255, 100, 124, .3);
      color: #ff9daf;
    }

    .live-pill {
      display: inline-flex;
      min-height: 33px;
      align-items: center;
      padding: 0 11px;
      border: 1px solid rgba(61, 227, 164, .13);
      border-radius: 999px;
      background: rgba(61, 227, 164, .055);
      color: #9fd9c1;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      font-weight: 800;
      gap: 7px;
    }

    .live-pill time {
      color: var(--muted);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      margin-bottom: 18px;
      gap: 14px;
    }

    .metric-card {
      min-height: 184px;
      padding: 18px;
    }

    .metric-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .metric-icon,
    .stat-icon {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(49, 215, 255, .12);
      border-radius: 10px;
      background: rgba(49, 215, 255, .075);
      color: var(--cyan);
      font-size: 13px;
    }

    .metric-state {
      display: inline-flex;
      align-items: center;
      padding: 5px 7px;
      border-radius: 999px;
      background: rgba(61, 227, 164, .08);
      color: #7fe9bc;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      gap: 5px;
    }

    .metric-state.warning {
      background: rgba(255, 180, 92, .09);
      color: var(--warning);
    }

    .metric-label {
      margin-top: 16px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .metric-value-row {
      display: flex;
      align-items: baseline;
      margin-top: 4px;
      gap: 8px;
    }

    .metric-value {
      color: #f0fbff;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 28px;
      font-weight: 760;
      letter-spacing: -.055em;
    }

    .metric-unit {
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
    }

    .metric-delta {
      margin-left: auto;
      color: var(--success);
      font-size: 9px;
      font-weight: 800;
    }

    .metric-delta.up {
      color: var(--warning);
    }

    .metric-detail {
      margin-top: 5px;
      color: var(--faint);
      font-size: 9px;
    }

    .spark-bars {
      display: flex;
      height: 33px;
      align-items: flex-end;
      margin-top: 13px;
      gap: 3px;
    }

    .spark-bar {
      min-width: 2px;
      flex: 1;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(to top, rgba(49, 215, 255, .16), rgba(49, 215, 255, .65));
      transition: height .6s var(--ease), opacity .3s;
      opacity: .78;
    }

    .spark-bar:last-child {
      background: var(--cyan);
      box-shadow: 0 0 8px rgba(49, 215, 255, .4);
      opacity: 1;
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(290px, .78fr);
      gap: 14px;
    }

    .panel-card {
      padding: 19px;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 15px;
    }

    .panel-title {
      min-width: 0;
    }

    .panel-title h2,
    .panel-title h3 {
      margin: 0;
      color: #dcecf6;
      font-size: 13px;
      font-weight: 760;
    }

    .panel-title p {
      margin: 5px 0 0;
      color: var(--faint);
      font-size: 9px;
      line-height: 1.5;
    }

    .legend {
      display: flex;
      align-items: center;
      color: var(--faint);
      font-size: 8px;
      font-weight: 800;
      gap: 13px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      background: var(--cyan);
    }

    .legend-dot.ram {
      background: var(--blue);
    }

    .utilization-chart {
      position: relative;
      display: flex;
      height: 184px;
      align-items: flex-end;
      padding: 16px 10px 22px 33px;
      border: 1px solid rgba(125, 205, 255, .075);
      border-radius: 13px;
      background:
        linear-gradient(rgba(103, 164, 198, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(103, 164, 198, .035) 1px, transparent 1px),
        rgba(4, 13, 24, .42);
      background-size: 100% 25%, 8.33% 100%;
      gap: 6px;
    }

    .chart-scale {
      position: absolute;
      top: 9px;
      bottom: 18px;
      left: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #4d6479;
      font-family: monospace;
      font-size: 7px;
    }

    .chart-group {
      display: flex;
      height: 100%;
      min-width: 3px;
      flex: 1;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
    }

    .chart-bar {
      width: min(8px, 38%);
      min-height: 3px;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(to top, rgba(49, 215, 255, .22), rgba(49, 215, 255, .86));
      transition: height .65s var(--ease);
    }

    .chart-bar.ram {
      background: linear-gradient(to top, rgba(85, 119, 255, .15), rgba(85, 119, 255, .76));
    }

    .chart-caption {
      position: absolute;
      right: 10px;
      bottom: 6px;
      left: 34px;
      display: flex;
      justify-content: space-between;
      color: #425b70;
      font-family: monospace;
      font-size: 7px;
    }

    .availability-score {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .availability-score strong {
      color: var(--success);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 20px;
    }

    .availability-score span {
      color: var(--faint);
      font-size: 8px;
    }

    .service-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .service-row {
      display: grid;
      grid-template-columns: minmax(92px, 1fr) 1.4fr auto;
      min-height: 44px;
      align-items: center;
      padding: 0 9px;
      border-radius: 10px;
      transition: background .2s;
      gap: 11px;
    }

    .service-row:hover {
      background: rgba(75, 146, 187, .055);
    }

    .service-name {
      overflow: hidden;
      color: #bfd2df;
      font-size: 10px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-track {
      position: relative;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(105, 151, 180, .12);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      box-shadow: 0 0 10px rgba(49, 215, 255, .2);
      transition: width .65s var(--ease);
    }

    .progress-fill.success {
      background: linear-gradient(90deg, #1fae7a, var(--success));
    }

    .progress-fill.warning {
      background: linear-gradient(90deg, #de863d, var(--warning));
    }

    .progress-fill.danger {
      background: linear-gradient(90deg, #d74764, var(--danger));
    }

    .service-value {
      color: var(--muted);
      font-family: monospace;
      font-size: 9px;
    }

    .activity-card {
      grid-column: 1 / -1;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .timeline-item {
      position: relative;
      min-height: 86px;
      padding: 11px 11px 11px 38px;
      border: 1px solid rgba(125, 205, 255, .075);
      border-radius: 11px;
      background: rgba(5, 15, 27, .35);
    }

    .timeline-icon {
      position: absolute;
      top: 12px;
      left: 11px;
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 7px;
      background: rgba(49, 215, 255, .08);
      color: var(--cyan);
      font-size: 8px;
    }

    .timeline-item strong {
      display: block;
      margin-bottom: 5px;
      color: #c9dbe7;
      font-size: 9px;
    }

    .timeline-item p {
      margin: 0;
      color: var(--muted);
      font-size: 8px;
      line-height: 1.45;
    }

    .timeline-item time {
      display: block;
      margin-top: 8px;
      color: var(--faint);
      font-family: monospace;
      font-size: 7px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 14px;
      gap: 12px;
    }

    .summary-card {
      display: flex;
      min-height: 102px;
      align-items: center;
      padding: 16px;
      gap: 13px;
    }

    .stat-icon.success {
      border-color: rgba(61, 227, 164, .13);
      background: rgba(61, 227, 164, .075);
      color: var(--success);
    }

    .stat-icon.warning {
      border-color: rgba(255, 180, 92, .13);
      background: rgba(255, 180, 92, .075);
      color: var(--warning);
    }

    .stat-icon.danger {
      border-color: rgba(255, 100, 124, .13);
      background: rgba(255, 100, 124, .075);
      color: var(--danger);
    }

    .stat-icon.purple {
      border-color: rgba(167, 139, 250, .13);
      background: rgba(167, 139, 250, .075);
      color: var(--purple);
    }

    .summary-copy {
      min-width: 0;
    }

    .summary-copy span {
      display: block;
      margin-bottom: 3px;
      color: var(--faint);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .summary-copy strong {
      display: block;
      color: #ebf8ff;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 20px;
      letter-spacing: -.04em;
    }

    .summary-copy small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 8px;
    }

    .pipeline-flow {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-bottom: 14px;
      padding: 16px;
      gap: 0;
    }

    .flow-step {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .flow-step:not(:last-child)::after {
      height: 1px;
      flex: 1;
      margin-right: 8px;
      background: linear-gradient(90deg, rgba(61, 227, 164, .6), rgba(61, 227, 164, .13));
      content: "";
    }

    .flow-step.running:not(:last-child)::after {
      background: linear-gradient(90deg, rgba(49, 215, 255, .75), rgba(49, 215, 255, .12));
    }

    .flow-step.pending:not(:last-child)::after {
      background: rgba(129, 208, 255, .08);
    }

    .flow-dot {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border: 1px solid rgba(61, 227, 164, .23);
      border-radius: 50%;
      background: rgba(61, 227, 164, .09);
      color: var(--success);
      font-size: 8px;
    }

    .flow-step.running .flow-dot {
      border-color: rgba(49, 215, 255, .36);
      background: rgba(49, 215, 255, .1);
      color: var(--cyan);
      box-shadow: 0 0 16px rgba(49, 215, 255, .13);
      animation: pulse 1.8s infinite;
    }

    .flow-step.pending .flow-dot {
      border-color: rgba(129, 208, 255, .1);
      background: rgba(91, 123, 146, .06);
      color: var(--faint);
    }

    .flow-copy span {
      display: block;
      color: #afc5d4;
      font-size: 9px;
      font-weight: 800;
    }

    .flow-copy small {
      color: var(--faint);
      font-size: 7px;
    }

    .split-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .75fr);
      gap: 14px;
    }

    .table-card {
      padding: 0;
    }

    .table-card .panel-header {
      align-items: center;
      margin: 0;
      padding: 17px 18px 13px;
      border-bottom: 1px solid rgba(125, 205, 255, .075);
    }

    .select-control {
      min-height: 34px;
      padding: 0 29px 0 10px;
      border: 1px solid rgba(125, 205, 255, .12);
      border-radius: 9px;
      outline: none;
      background: #0b1b2e;
      color: #9db3c3;
      font-size: 9px;
      font-weight: 750;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      table-layout: auto;
    }

    .data-table th {
      padding: 10px 13px;
      border-bottom: 1px solid rgba(125, 205, 255, .075);
      color: var(--faint);
      font-size: 7px;
      font-weight: 850;
      letter-spacing: .09em;
      text-align: left;
      text-transform: uppercase;
    }

    .data-table td {

      border-bottom: 1px solid rgba(125, 205, 255, .055);
      color: #aabfce;
      font-size: 9px;
      vertical-align: middle;
    }

    .data-table tr:last-child td {
      border-bottom: 0;
    }

    .data-table tbody tr {

    .data-table tbody tr:hover {

    .build-id {
      color: #d6e9f5;
      font-family: monospace;
      font-weight: 800;
    }

    .branch-cell,
    .sha {
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .branch-cell i {
      margin-right: 5px;
      color: var(--faint);
    }

    .sha {
      display: inline-block;
      padding: 3px 5px;
      border-radius: 5px;
      background: rgba(91, 137, 168, .08);
      color: #89cde3;
      font-size: 8px;
    }

    .commit-main {
      display: block;
      max-width: 230px;
      overflow: hidden;
      color: #c6d8e4;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-sub {
      display: block;
      margin-top: 4px;
      color: var(--faint);
      font-size: 8px;
    }

    .status-badge {
      display: inline-flex;
      min-height: 23px;
      align-items: center;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .055em;
      text-transform: uppercase;
      gap: 5px;

    .status-badge.success,
    .status-badge.running,
    .status-badge.healthy,

    .status-badge.running {
      border-color: rgba(49, 215, 255, .16);
      background: rgba(49, 215, 255, .075);
      color: var(--cyan);
    }

    .status-badge.warning,
    .status-badge.degraded,
    .status-badge.maintenance {
      border-color: rgba(255, 180, 92, .14);
      background: rgba(255, 180, 92, .075);
      color: var(--warning);
    }

    .status-badge.failed,
    .status-badge.critical,
    .status-badge.offline,
    .status-badge.stopped {
      border-color: rgba(255, 100, 124, .14);
      background: rgba(255, 100, 124, .075);
      color: #ff879b;
    }

    .status-badge.running i {

    }

    .row-action {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid rgba(125, 205, 255, .1);
      border-radius: 8px;
      background: rgba(13, 29, 48, .63);
      color: var(--muted);
      font-size: 8px;
    }

    .row-action:hover {
      border-color: rgba(49, 215, 255, .25);
      color: var(--cyan);
    }

    .commit-list {
      display: flex;
      flex-direction: column;
    }

    .commit-item {
      position: relative;
      display: grid;
      grid-template-columns: 32px 1fr;
      min-height: 69px;
      gap: 10px;
    }

    .commit-item:not(:last-child)::before {
      position: absolute;
      top: 29px;
      bottom: -3px;
      left: 15px;
      width: 1px;
      background: rgba(94, 151, 185, .15);
      content: "";
    }

    .commit-avatar {
      position: relative;
      z-index: 1;
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(49, 215, 255, .12);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(49, 215, 255, .1), rgba(85, 119, 255, .1));
      color: #a6e9fa;
      font-size: 8px;

    }

    .commit-content strong {
      display: block;
      overflow: hidden;
      margin-top: 1px;
      color: #c8dbe7;
      font-size: 9px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-content p {
      margin: 4px 0 0;
      color: var(--faint);
      font-size: 8px;
      line-height: 1.45;
    }

    .commit-content p .sha {

    }

    .fleet-strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      margin-bottom: 14px;
      gap: 12px;
    }

    .perf-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

    }

    .perf-grid .panel-card {

    }

    .perf-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .perf-actions .btn {

      align-items: center;
      gap: 7px;
    }

    .btn-compact {
      padding: 4px 10px;
      font-size: 12px;
      line-height: 1.4;
    }

    .warning-text {
      color: #ffd166 !important;
    }

    .fleet-stat {
      display: flex;
      min-height: 84px;
      align-items: center;
      padding: 15px;
      gap: 12px;
    }

    .fleet-stat strong {
      display: block;
      color: #e8f7ff;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 18px;
    }

    .fleet-stat span {
      display: block;
      margin-top: 3px;
      color: var(--faint);
      font-size: 8px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .node-grid,
    .bot-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .node-card,
    .bot-card {
      padding: 17px;
    }

    .node-card.warning-node {
      border-color: rgba(255, 180, 92, .2);
    }

    .node-top,
    .bot-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .node-title,
    .bot-identity {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .node-icon,
    .bot-avatar {
      display: grid;
      width: 37px;
      height: 37px;
      flex: 0 0 37px;
      place-items: center;
      border: 1px solid rgba(49, 215, 255, .12);
      border-radius: 11px;
      background: rgba(49, 215, 255, .07);
      color: var(--cyan);
      font-size: 13px;
    }

    .bot-avatar {
      border-color: rgba(167, 139, 250, .15);
      background: linear-gradient(145deg, rgba(49, 215, 255, .09), rgba(167, 139, 250, .09));
      color: #aaa4ff;
    }

    .node-title strong,
    .bot-identity strong {
      display: block;
      overflow: hidden;
      color: #dcebf5;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-title span,
    .bot-identity span {
      display: block;
      margin-top: 4px;
      color: var(--faint);
      font-size: 8px;
    }

    .node-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin: 17px 0;
      gap: 7px;
    }

    .node-metric {
      padding: 9px 7px;
      border: 1px solid rgba(125, 205, 255, .065);
      border-radius: 9px;
      background: rgba(4, 14, 25, .35);
      text-align: center;
    }

    .node-metric span {
      display: block;
      margin-bottom: 4px;
      color: var(--faint);
      font-size: 7px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .node-metric strong {
      color: #c9dce8;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    .node-metric strong.warning {
