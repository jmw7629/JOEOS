    }

    .resource-row {
      display: grid;
      grid-template-columns: 38px 1fr 34px;
      align-items: center;
      margin-top: 10px;
      gap: 8px;
    }

    .resource-row span {
      color: var(--faint);
      font-size: 7px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .resource-row strong {
      color: var(--muted);
      font-family: monospace;
      font-size: 8px;
      text-align: right;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid rgba(125, 205, 255, .07);
      gap: 8px;
    }

    .node-ip,
    .bot-activity {
      color: var(--faint);
      font-family: monospace;
      font-size: 7px;
    }

    .security-layout {
      display: grid;
      grid-template-columns: minmax(260px, .72fr) minmax(0, 1.42fr);
      gap: 14px;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event-item {
      display: grid;
      grid-template-columns: 31px 1fr auto;
      align-items: center;
      padding: 10px;
      border: 1px solid rgba(125, 205, 255, .07);
      border-radius: 10px;
      background: rgba(5, 15, 27, .32);
      gap: 9px;
    }

    .event-icon {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: rgba(255, 180, 92, .08);
      color: var(--warning);
      font-size: 10px;
    }

    .event-icon.danger {
      background: rgba(255, 100, 124, .08);
      color: var(--danger);
    }

    .event-copy strong {
      display: block;
      color: #c9dce7;
      font-size: 9px;
    }

    .event-copy span {
      display: block;
      margin-top: 4px;
      color: var(--faint);
      font-size: 8px;
    }

    .event-time {
      color: var(--faint);
      font-family: monospace;
      font-size: 7px;
    }

    .terminal-card {
      overflow: hidden;
      border-color: rgba(63, 207, 255, .13);
      background: linear-gradient(155deg, rgba(4, 13, 23, .96), rgba(5, 17, 30, .91));
    }

    .terminal-header {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      padding: 9px 13px;
      border-bottom: 1px solid rgba(49, 215, 255, .09);
      background: rgba(12, 28, 46, .52);
      gap: 12px;
    }

    .terminal-title {
      display: flex;
      min-width: 0;
      align-items: center;
      color: #b9cfdd;
      font-family: monospace;
      font-size: 9px;
      font-weight: 800;
      gap: 8px;
    }

    .terminal-dots {
      display: flex;
      gap: 4px;
    }

    .terminal-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
    }

    .terminal-dot:nth-child(2) {
      background: var(--warning);
    }

    .terminal-dot:nth-child(3) {
      background: var(--success);
    }

    .terminal-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .terminal-controls .select-control {
      min-height: 31px;
    }

    .terminal-controls .compact-button {
      min-height: 31px;
    }

    .log-stream {
      height: 375px;
      overflow: auto;
      padding: 8px 0 15px;
      font-family: "SFMono-Regular", Consolas, monospace;
      scrollbar-gutter: stable;
    }

    .log-row {
      display: grid;
      grid-template-columns: 63px 50px 78px minmax(0, 1fr);
      min-height: 29px;
      align-items: start;
      padding: 7px 13px;
      color: #85a2b5;
      font-size: 8px;
      line-height: 1.45;
      animation: logIn .32s var(--ease);
      gap: 8px;
    }

    .log-row:hover {
      background: rgba(49, 215, 255, .025);
    }

    .log-time {
      color: #506b7f;
    }

    .log-level {
      font-weight: 850;
    }

    .log-level.info {
      color: var(--cyan);
    }

    .log-level.warn {
      color: var(--warning);
    }

    .log-level.error {
      color: var(--danger);
    }

    .log-level.success {
      color: var(--success);
    }

    .log-source {
      overflow: hidden;
      color: #718fa3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .log-message {
      color: #9ab1c1;
      overflow-wrap: anywhere;
    }

    .terminal-footer {
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px;
      border-top: 1px solid rgba(49, 215, 255, .07);
      color: var(--faint);
      font-family: monospace;
      font-size: 7px;
    }

    .bot-card.stopped-card {
      opacity: .72;
    }

    .bot-description {
      min-height: 34px;
      margin: 14px 0;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.55;
    }

    .bot-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .bot-stat {
      padding: 9px 6px;
      border: 1px solid rgba(125, 205, 255, .065);
      border-radius: 9px;
      background: rgba(4, 14, 25, .35);
      text-align: center;
    }

    .bot-stat strong {
      display: block;
      color: #d5e8f3;
      font-family: monospace;
      font-size: 13px;
    }

    .bot-stat span {
      display: block;
      margin-top: 4px;
      color: var(--faint);
      font-size: 6px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .bot-toggle {
      min-width: 73px;
    }

    .bot-toggle.stop {
      border-color: rgba(255, 100, 124, .15);
      color: #ff9bab;
    }

    .assistant-panel {
      position: fixed;
      z-index: 90;
      top: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      width: 374px;
      overflow: hidden;
      flex-direction: column;
      border: 1px solid rgba(77, 208, 255, .2);
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(9, 25, 43, .97), rgba(5, 15, 29, .97));
      box-shadow: -22px 0 80px rgba(0, 4, 12, .42), 0 0 40px rgba(49, 215, 255, .035);
      animation: assistantIn .34s var(--ease);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
    }

    .assistant-head {
      display: flex;
      min-height: 68px;
      align-items: center;
      padding: 0 13px 0 16px;
      border-bottom: 1px solid rgba(125, 205, 255, .09);
      background: linear-gradient(100deg, rgba(49, 215, 255, .055), transparent);
      gap: 11px;
    }

    .ai-orb {
      position: relative;
      display: grid;
      width: 37px;
      height: 37px;
      flex: 0 0 37px;
      place-items: center;
      border: 1px solid rgba(49, 215, 255, .35);
      border-radius: 12px;
      background: radial-gradient(circle at 35% 30%, rgba(93, 231, 255, .26), rgba(59, 99, 255, .13));
      color: var(--cyan);
      box-shadow: 0 0 19px rgba(49, 215, 255, .13);
    }

    .ai-orb::after {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 7px;
      height: 7px;
      border: 2px solid #08172a;
      border-radius: 50%;
      background: var(--success);
      content: "";
    }

    .ai-orb.offline::after {
      background: var(--danger);
    }

    .ai-orb.checking::after {
      background: var(--warning);
    }

    .assistant-head-copy {
      min-width: 0;
      flex: 1;
    }

    .assistant-head-copy strong {
      display: block;
      color: #ebf9ff;
      font-size: 11px;
    }

    .assistant-head-copy span {
      display: block;
      margin-top: 3px;
      color: #73a9ba;
      font-size: 8px;
    }

    .assistant-head-actions {
      display: flex;
      gap: 3px;
    }

    .assistant-head-actions button {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 9px;
      background: transparent;
      color: var(--faint);
      font-size: 9px;
    }

    .assistant-head-actions button:hover {
      background: rgba(49, 215, 255, .07);
      color: var(--cyan);
    }

    .assistant-context {
      display: flex;
      min-height: 37px;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid rgba(125, 205, 255, .065);
      color: var(--faint);
      font-size: 7px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      gap: 7px;
    }

    .assistant-context i {
      color: var(--success);
    }

    .assistant-focus {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      margin: 8px 12px 0;
      border: 1px solid rgba(59, 143, 216, .45);
      border-radius: 9px;
      background: rgba(11, 58, 99, .28);
      font-size: 11px;
      letter-spacing: .02em;
    }
    .assistant-focus .focus-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--bright);
      font-weight: 600;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .assistant-focus .focus-label i { color: var(--interactive); }
    .assistant-focus .focus-clear {
      background: transparent;
      border: none;
      color: var(--faint);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 12px;
    }
    .assistant-focus .focus-clear:hover { color: var(--text); }

    /* ---- Command Center (modular home) ---- */
    .command-center { display: flex; flex-direction: column; gap: 14px; }
    .cc-heading h2 { margin: 0 0 2px; font-size: 22px; }
    .cc-heading p { margin: 0; color: var(--faint); font-size: 13px; }
    .cc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .cc-module { display: flex; flex-direction: column; gap: 10px; padding: 14px 15px; border: 1px solid var(--line);
      border-radius: 14px; background: linear-gradient(180deg, rgba(23, 28, 37, 0.55), rgba(11, 14, 20, 0.85));
      box-shadow: var(--depth-raised-2); transition: border-color .15s ease, transform .12s ease, box-shadow .15s ease; }
    .cc-module:hover { border-color: rgba(59, 143, 216, .5); transform: translateY(-1px); box-shadow: var(--depth-raised-3); }
    .cc-module:active { transform: translateY(0); box-shadow: var(--depth-pressed); }
    .cc-module-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cc-module-head > div { min-width: 0; flex: 1; }
    .cc-module-icon { color: var(--interactive); font-size: 16px; flex: none; }
    .cc-module-head h3 { margin: 0; font-size: 14px; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cc-module-head p { margin: 0; color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cc-module-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
      border: 1px solid var(--line); color: var(--bright); flex: none; }
    .cc-module-badge.info { color: var(--interactive); border-color: rgba(59,143,216,.5); }
    .cc-module-badge.danger { color: var(--danger); border-color: rgba(255,100,124,.5); }
    .cc-module-value { font-size: 20px; font-weight: 700; line-height: 1.2; }

    /* ---- Embossed 3D depth language (machined surfaces, zero-clipping) ---- */
    .agent-card, .glass-card, .panel-card, .cc-stat {
      box-shadow: var(--depth-raised-1);
      background: linear-gradient(180deg, rgba(23, 28, 37, 0.5), rgba(11, 14, 20, 0.88));
    }
    .cc-stat { box-shadow: var(--depth-recessed); background: rgba(8, 14, 22, 0.6); }
    .cc-stat .v { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
    .cc-inspector { box-shadow: var(--depth-floating); background: linear-gradient(180deg, rgba(23, 28, 37, 0.72), rgba(10, 14, 20, 0.94)); }
    .cc-menu { box-shadow: var(--depth-floating); }
    .terminal-host, #terminal-host, .cc-focused { box-shadow: var(--depth-recessed); }
    .cc-module-badge, .badge, .chip { box-shadow: inset 0 1px 0 rgba(139, 212, 255, 0.05), 0 1px 0 rgba(0, 0, 0, 0.3); }
    .chip, .badge { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; vertical-align: middle; line-height: 1.6; }
    .cc-module-actions button, .secondary-button, .ghost-button, button {
      box-shadow: var(--depth-raised-1);
    }
    .cc-module-actions button:active, .secondary-button:active, button:active { box-shadow: var(--depth-pressed); transform: translateY(1px); }
    .assistant-fab { box-shadow: 0 0 0 1px rgba(75, 220, 255, .55), 0 10px 26px rgba(20, 132, 209, .35),
      inset 0 2px 4px rgba(255, 255, 255, 0.22), inset 0 -3px 6px rgba(0, 0, 0, 0.45),
      inset 0 0 18px rgba(49, 215, 255, 0.25); }
    .assistant-fab:active { box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.5), inset 0 0 14px rgba(49, 215, 255, 0.2); transform: translateY(1px); }
    /* navigation selection plate */
    .sidebar-nav-item, .nav-item, .cc-nav button { position: relative; }
    .cc-nav button.active, .sidebar-nav-item.active { box-shadow: var(--depth-active-edge); }
    /* long-content safety */
    .agent-card .name, .cc-module-value, .fleet-stat strong, .sidebar-nav-label, .nav-label {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .row > div { min-width: 0; }
    .agent-card .desc, .plugin-description { line-height: 1.5; min-height: 0; overflow-wrap: anywhere; }
    .cc-module-muted { color: var(--faint); font-weight: 500; font-size: 14px; }
    .cc-module-detail { color: var(--faint); font-size: 12px; line-height: 1.45; }
    .cc-module-actions { display: flex; gap: 8px; margin-top: 2px; }
    .cc-undo-bar { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
    .cc-module-actions button { padding: 7px 10px; font-size: 12px; }
    .cc-focused { padding: 18px; }
    .cc-focused .cc-module { background: transparent; border-color: rgba(59,143,216,.4); }
    .cc-focused-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .cc-focused-actions button { padding: 10px 14px; font-size: 13px; }
    /* module context menu + pin + inspector */
    .cc-module-head { position: relative; }
    .cc-more { border: none; background: transparent; color: var(--faint); padding: 4px 6px; line-height: 1; }
    .cc-more:hover { color: var(--text); background: rgba(139,212,255,.08); }
    .cc-pinned { border-color: rgba(59,143,216,.55); }
    .cc-pinned .cc-module-icon { color: var(--active); }
    .cc-menu { position: absolute; z-index: 30; right: 0; top: 32px; min-width: 170px; background: var(--panel);
      border: 1px solid rgba(59,143,216,.4); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.5); padding: 4px; }
    .cc-menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 10px; background: transparent;
      border: none; border-radius: 7px; color: var(--text); text-align: left; font-size: 12.5px; }
    .cc-menu button:hover { background: rgba(49,215,255,.12); }
    .cc-menu button:disabled { opacity: .4; cursor: default; }
    .cc-menu-backdrop { position: fixed; inset: 0; z-index: 25; }
    .cc-with-inspector { display: flex; gap: 16px; align-items: flex-start; }
    .cc-main { flex: 1; min-width: 0; }
    .cc-inspector { flex: 0 0 320px; max-width: 360px; position: sticky; top: 84px; padding: 16px;
      border-color: rgba(59,143,216,.35); display: flex; flex-direction: column; gap: 12px; }
    .cc-inspector-head { display: flex; align-items: center; gap: 10px; }
    .cc-inspector-head h3 { margin: 0; font-size: 15px; flex: 1; }
    .cc-inspector-value { font-size: 20px; font-weight: 700; }
    .cc-inspector-actions { display: flex; gap: 8px; margin-top: 4px; }
    .cc-inspector-label { display: block; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
    .cc-inspector-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .cc-inspector-rel { display: flex; flex-direction: column; gap: 5px; }
    .cc-inspector-rel-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 9px; background: rgba(11, 27, 47, .5); color: var(--text); font-size: 12px; cursor: pointer; text-align: left; transition: border-color .15s ease, background .15s ease; }
    .cc-inspector-rel-item:hover { border-color: rgba(49, 215, 255, .4); background: rgba(49, 215, 255, .06); }
    .cc-inspector-rel-item span { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; min-width: 92px; }
    .cc-inspector-rel-item strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .cc-modal-backdrop { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; background: rgba(2, 5, 10, .72); padding: 18px; }
    .cc-modal { width: 100%; max-width: 620px; max-height: 84vh; overflow: auto; background: linear-gradient(180deg, rgba(23, 28, 37, .97), rgba(11, 14, 20, .98)); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--depth-floating); }
    .cc-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .cc-modal-head h3 { margin: 0; font-size: 15px; }
    .cc-compare-pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .cc-compare-option { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(49, 215, 255, .05); color: var(--text); font-size: 11.5px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
    .cc-compare-option:hover { border-color: rgba(49, 215, 255, .4); background: rgba(49, 215, 255, .09); }
    .cc-compare-result { margin-top: 8px; }
    .cc-compare-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .cc-compare-table th, .cc-compare-table td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
    .cc-compare-table th { background: rgba(11, 27, 47, .6); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .cc-compare-field { color: var(--faint); white-space: nowrap; }
    .cc-compare-diff { background: rgba(255, 180, 92, .05); }
    .cc-compare-diff .cc-compare-field { color: var(--warning); }
    .cc-snapshot-save-row { display: flex; gap: 8px; margin: 12px 0; }
    .cc-snapshot-save-row input { flex: 1; min-width: 0; }
    .cc-snapshot-list { display: flex; flex-direction: column; gap: 8px; }
    .cc-snapshot-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(11, 27, 47, .5); }
    .cc-snapshot-copy { flex: 1; min-width: 0; }
    .cc-snapshot-copy strong { display: block; font-size: 13px; line-height: 1.3; }
    .cc-snapshot-copy span { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .cc-snapshot-actions { display: flex; gap: 6px; flex: 0 0 auto; }
    .cc-inspector-semantic { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
    .cc-inspector-semantic-text { color: var(--muted); font-size: 12px; line-height: 1.4; flex: 1; min-width: 0; }
    .cc-inspector-impacts { display: flex; flex-wrap: wrap; gap: 5px; }
    .cc-inspector-impact { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; background: rgba(11, 27, 47, .5); color: var(--text); font-size: 11px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
    .cc-inspector-impact:hover { border-color: rgba(49, 215, 255, .4); background: rgba(49, 215, 255, .06); }
    .cc-inspector-timeline { display: flex; flex-direction: column; gap: 8px; }
    .cc-inspector-timeline-item { display: flex; gap: 9px; align-items: flex-start; }
    .cc-timeline-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; }
    .cc-timeline-dot.success { background: var(--success); }
    .cc-timeline-dot.danger { background: var(--danger); }
    .cc-timeline-dot.default { background: var(--muted); }
    .cc-timeline-copy { min-width: 0; }
    .cc-timeline-copy strong { display: block; font-size: 11.5px; line-height: 1.3; text-transform: capitalize; }
    .cc-timeline-copy span { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .cc-inspector-help {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      padding: 8px 12px;
      border: 1px solid rgba(49, 215, 255, .22);
      border-radius: 9px;
      background: rgba(49, 215, 255, .06);
      color: var(--cyan-soft, var(--cyan));
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .cc-inspector-help:hover {
      border-color: rgba(49, 215, 255, .45);
      background: rgba(49, 215, 255, .1);
    }
    .cc-inspector-actions button { padding: 9px 12px; font-size: 12.5px; }
    @media (min-width: 1300px) {
      .cc-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 1370px) {
      .cc-inspector { flex-basis: 280px; max-width: 300px; }
    }
    @media (max-width: 900px) {
      .cc-with-inspector { flex-direction: column; }
      .cc-inspector { position: static; flex-basis: auto; max-width: none; width: 100%; }
    }

    .assistant-messages {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      overflow-y: auto;
      padding: 15px;
      gap: 12px;
    }

    .chat-message {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      animation: messageIn .28s var(--ease);
    }

    .chat-message.user {
      flex-direction: row-reverse;
    }

    .chat-avatar {
      display: grid;
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      place-items: center;
      border: 1px solid rgba(49, 215, 255, .12);
      border-radius: 8px;
      background: rgba(49, 215, 255, .075);
      color: var(--cyan);
      font-size: 8px;
    }

    .chat-message.user .chat-avatar {
      border-color: rgba(167, 139, 250, .13);
      background: rgba(167, 139, 250, .075);
      color: #b5a7ff;
    }

    .chat-bubble {
      max-width: 84%;
      padding: 10px 11px;
      border: 1px solid rgba(125, 205, 255, .08);
      border-radius: 5px 13px 13px 13px;
      background: rgba(11, 29, 49, .64);
      color: #b6cbd8;
      font-size: 9px;
      line-height: 1.58;
      white-space: pre-wrap;
    }

    .chat-message.user .chat-bubble {
      border-color: rgba(83, 124, 255, .14);
      border-radius: 13px 5px 13px 13px;
      background: linear-gradient(135deg, rgba(44, 99, 158, .35), rgba(65, 73, 151, .26));
      color: #ddecf6;
    }

    .thinking {
      display: flex;
      min-height: 15px;
      align-items: center;
      gap: 4px;
    }

    .thinking span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cyan);
      animation: thinking 1.1s infinite;
      opacity: .45;
    }

    .thinking span:nth-child(2) {
      animation-delay: .16s;
    }

    .thinking span:nth-child(3) {
      animation-delay: .32s;
    }

    .quick-commands {
      display: flex;
      overflow-x: auto;
      padding: 0 14px 10px;
      gap: 6px;
      scrollbar-width: none;
    }

    .quick-commands::-webkit-scrollbar {
      display: none;
    }

    .quick-command {
      min-height: 29px;
      flex: 0 0 auto;
      padding: 0 10px;
      border: 1px solid rgba(49, 215, 255, .11);
      border-radius: 999px;
      background: rgba(49, 215, 255, .045);
      color: #83b8c9;
      font-size: 7px;
      font-weight: 800;
      white-space: nowrap;
    }

    .quick-command:hover {
      border-color: rgba(49, 215, 255, .25);
      color: var(--cyan-soft);
    }

    .quick-command:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .assistant-form {
      padding: 11px 13px 13px;
      border-top: 1px solid rgba(125, 205, 255, .08);
      background: rgba(5, 15, 28, .62);
    }

    .assistant-input-wrap {
      display: flex;
      min-height: 45px;
      align-items: center;
      padding: 4px 5px 4px 12px;
      border: 1px solid rgba(49, 215, 255, .14);
      border-radius: 13px;
      background: rgba(8, 22, 38, .82);
      transition: border-color .2s, box-shadow .2s;
      gap: 8px;
    }

    .assistant-input-wrap:focus-within {
      border-color: rgba(49, 215, 255, .42);
      box-shadow: 0 0 0 3px rgba(49, 215, 255, .05);
    }

    .assistant-input-wrap input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: #d8eaf5;
      font-size: 16px;
    }

    .assistant-input-wrap input::placeholder {
      color: #536c80;
    }

    .send-button {
      display: grid;
      width: 35px;
      height: 35px;
      flex: 0 0 35px;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(49, 215, 255, .26), rgba(85, 119, 255, .33));
      color: #e8faff;
      font-size: 10px;
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: .38;
    }

    .assistant-hint {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      color: #4e687c;
      font-size: 7px;
    }

    .assistant-fab {
      position: fixed;
      z-index: 70;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      display: none;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 1px solid rgba(75, 220, 255, .55);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(30, 175, 212, .95), rgba(66, 83, 221, .95));
      box-shadow: 0 14px 40px rgba(20, 132, 209, .28), 0 0 0 5px rgba(49, 215, 255, .055);
      color: white;
      font-size: 16px;
      transition: transform .22s var(--ease);
    }

    .assistant-fab:hover {
      transform: translateY(-2px);
    }

    .mobile-overlay,
    .modal-overlay {
      position: fixed;
      z-index: 130;
      inset: 0;
      background: rgba(1, 6, 13, .72);
      animation: fadeIn .2s ease;
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
    }

    .mobile-drawer {
      position: fixed;
      z-index: 140;
      top: 10px;
      bottom: 10px;
      left: 10px;
      width: min(286px, calc(100vw - 32px));
      overflow-y: auto;
      overscroll-behavior: contain;
      animation: drawerIn .28s var(--ease);
      -webkit-overflow-scrolling: touch;
    }

    .mobile-drawer .sidebar {
      position: static;
      width: 100%;
      height: 100%;
    }

    .mobile-drawer-close {
      position: absolute;
      z-index: 2;
      top: 15px;
      right: 14px;
    }

    .modal-overlay {
      z-index: 160;
      display: grid;
      padding: 20px;
      place-items: center;
    }

    .modal {
      width: min(480px, 100%);
      padding: 20px;
      border: 1px solid rgba(77, 208, 255, .2);
      border-radius: 19px;
      background: rgba(8, 23, 40, .98);
      box-shadow: 0 30px 100px rgba(0, 3, 10, .7);
      animation: modalIn .28s var(--ease);
      max-height: min(86vh, 720px);
      overflow-y: auto;
    }

    .modal-body {
      padding: 2px 0 8px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .settings-grid .panel-card {
      min-width: 0;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .settings-row:last-child {
      border-bottom: 0;
    }

    .settings-label {
      color: var(--color-text-secondary);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .settings-label strong {
      color: var(--color-text-primary);
      font-size: 12px;
    }

    .settings-help {
      margin: 10px 0 0;
      color: var(--color-text-muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .settings-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--color-action-primary);
    }

    .settings-row select,
    .settings-row .form-control {
      width: auto;
      min-width: 130px;
    }

    .shortcut-list {
      display: flex;
      flex-direction: column;
    }

    .shortcut-key {
      padding: 3px 8px;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      background: var(--color-background-surface);
      color: var(--color-text-primary);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      white-space: nowrap;
    }

    /* Status badge — text + shape always present; color is supplemental. */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--color-border-subtle);
      background: var(--color-background-surface);
      color: var(--color-text-secondary);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1;
    }
    .status-badge i {
      font-size: 7px;
    }
    .status-badge.status-running,
    .status-badge.status-active,
    .status-badge.status-connected,
    .status-badge.status-healthy,
    .status-badge.status-completed,
    .status-badge.status-success {
      color: var(--color-status-success);
      border-color: rgba(61, 227, 164, .35);
    }
    .status-badge.status-waiting,
    .status-badge.status-queued,
    .status-badge.status-idle,
    .status-badge.status-starting,
    .status-badge.status-paused {
      color: var(--color-status-info);
      border-color: rgba(49, 215, 255, .35);
    }
    .status-badge.status-blocked,
    .status-badge.status-warning,
    .status-badge.status-degraded,
    .status-badge.status-stale,
    .status-badge.status-reconnecting {
      color: var(--color-status-warning);
      border-color: rgba(255, 180, 92, .4);
    }
    .status-badge.status-failed,
    .status-badge.status-cancelled,
    .status-badge.status-error,
    .status-badge.status-critical,
    .status-badge.status-security-critical {
      color: var(--color-status-critical);
      border-color: rgba(255, 59, 92, .4);
    }
    .status-badge.status-unavailable,
    .status-badge.status-unsupported,
    .status-badge.status-offline,
    .status-badge.status-unknown,
    .status-badge.status-restricted,
    .status-badge.status-quarantined,
    .status-badge.status-revoked {
      color: var(--color-text-muted);
      border-color: var(--color-border-subtle);
    }
    html[data-contrast="high"] .status-badge {
      border-width: 1px;
      font-weight: 800;
    }

    /* Persistent condition banners. */
    .banner-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 18px 8px;
    }
    .system-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: var(--radius-control);
      border: 1px solid var(--color-border-strong);
      background: var(--color-background-surface);
      color: var(--color-text-primary);
      font-size: 11px;
      line-height: 1.45;
    }
    .system-banner .banner-icon {
      color: var(--color-status-warning);
      font-size: 13px;
    }
    .system-banner.security .banner-icon {
      color: var(--color-status-critical);
    }
    .system-banner.info .banner-icon {
      color: var(--color-status-info);
    }
    .system-banner .banner-action {
      margin-left: auto;
      flex: 0 0 auto;
    }
    html[data-theme="light"] .system-banner {
      border-color: var(--color-border-strong);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 19px;
      gap: 12px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .modal-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #9eb4c3;
      font-size: 9px;
      font-weight: 800;
    }

    .form-control {
      width: 100%;
      min-height: 43px;
      padding: 0 12px;
      border: 1px solid rgba(125, 205, 255, .13);
      border-radius: 11px;
      outline: 0;
      background: rgba(5, 16, 29, .72);
      color: #dcecf6;
      font-size: 16px;
    }

    .form-control:focus {
      border-color: rgba(49, 215, 255, .42);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
      gap: 8px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .detail-item {
      padding: 12px;
      border: 1px solid rgba(125, 205, 255, .08);
      border-radius: 11px;
      background: rgba(5, 15, 28, .45);
    }

    .detail-item span {
      display: block;
      margin-bottom: 5px;
      color: var(--faint);
      font-size: 7px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .detail-item strong {
      color: #d9ebf5;
      font-family: monospace;
      font-size: 11px;
    }

    .mission-summary {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(240px, .8fr);
      margin-bottom: var(--workspace-gap);
      gap: var(--workspace-gap);
    }

    .mission-hero {
      min-height: 184px;
      padding: 22px;
      background:
        radial-gradient(circle at 88% 20%, rgba(49, 215, 255, .12), transparent 30%),
        linear-gradient(145deg, rgba(15, 31, 51, var(--glass-opacity)), rgba(7, 17, 31, calc(var(--glass-opacity) - .06)));
    }

    .mission-hero-top,
    .workspace-status-row,
    .widget-head,
    .widget-actions,
    .attention-row,
    .next-action-row,
    .integration-state,
    .theme-value-row,
    .palette-item {
      display: flex;
      align-items: center;
    }

    .mission-hero-top {
      justify-content: space-between;
      gap: 14px;
    }

    .mission-hero-label,
    .widget-eyebrow,
    .theme-label,
    .catalog-category {
      color: var(--faint);
      font-size: calc(8px * var(--font-scale));
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;

    .mission-hero h2 {

    .mission-score.danger {
      border-color: rgba(255, 100, 124, .25);
      background: rgba(255, 100, 124, .07);

    .mission-brief-card {

      font-size: calc(15px * var(--font-scale));

    .workspace-status-row {

      font-weight: 750;
      gap: 13px;

    .workspace-status-row span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .workspace-status-row i {
      color: var(--cyan);
    }

    .widget-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-auto-flow: dense;

    .widget-shell {

    .widget-shell[data-size="tall"] { min-height: 380px; }

    .widget-shell.editing {
      border-style: dashed;
      border-color: rgba(49, 215, 255, .34);

    }

    .widget-shell.dragging {
      opacity: .46;
      transform: scale(.985);
    }

    .widget-shell.drop-target {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(49, 215, 255, .1), var(--shadow);
    }

    .widget-head {
      min-height: 37px;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .widget-title {
      min-width: 0;
    }

    .widget-title strong {
      display: block;
      overflow: hidden;
      margin-top: 3px;
      color: #e0f0f8;
      font-size: calc(12px * var(--font-scale));
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .widget-actions {
      flex: 0 0 auto;
      gap: 5px;
    }

    .widget-tool {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(125, 205, 255, .11);
      border-radius: 9px;
      background: rgba(5, 16, 29, .65);
      color: var(--muted);
      font-size: 9px;
    }

    .widget-tool:hover:not(:disabled) {
      border-color: rgba(49, 215, 255, .3);
      color: var(--cyan-soft);
    }

    .widget-tool:disabled {
      cursor: not-allowed;
      opacity: .35;
    }

    .widget-body {
      min-height: 145px;
    }

    .attention-list,
    .next-action-list,
    .mini-metric-list,
    .agent-mini-list,
    .changes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .attention-row,
    .next-action-row,
    .agent-mini-row,
    .change-row {
      min-height: 54px;
      padding: 9px 10px;
      border: 1px solid rgba(125, 205, 255, .075);
      border-radius: 11px;
      background: rgba(5, 15, 27, .42);
      gap: 10px;
    }

    .attention-indicator {
      display: grid;
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      place-items: center;
      border-radius: 9px;
      background: rgba(255, 180, 92, .09);
      color: var(--warning);
      font-size: 10px;
    }

    .attention-indicator.danger {
      background: rgba(255, 100, 124, .09);
      color: var(--danger);
    }

    .attention-indicator.success {
      background: rgba(61, 227, 164, .09);
      color: var(--success);
    }

    .attention-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(minmax(0, 260px), 1fr));
      gap: 14px;
    }
    .attention-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease, transform .08s ease;
    }
    .attention-card:hover {
      border-color: rgba(49, 215, 255, .4);
      box-shadow: var(--depth-raised-2);
    }
    .attention-card:active {
      transform: translateY(1px);
      box-shadow: var(--depth-pressed);
    }
    .attention-card.tone-danger { border-color: rgba(255, 100, 124, .3); }
    .attention-card.tone-danger:hover { border-color: rgba(255, 100, 124, .55); }
    .attention-card.tone-warning { border-color: rgba(255, 180, 92, .3); }
    .attention-card.tone-warning:hover { border-color: rgba(255, 180, 92, .55); }
    .attention-card-icon {
      display: inline-flex;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(49, 215, 255, .08);
      color: var(--cyan);
    }
    .attention-card.tone-danger .attention-card-icon { background: rgba(255, 100, 124, .1); color: var(--danger); }
    .attention-card.tone-warning .attention-card-icon { background: rgba(255, 180, 92, .1); color: var(--warning); }
    .attention-card-copy { min-width: 0; flex: 1; }
    .attention-card-copy strong { display: block; font-size: 13.5px; line-height: 1.35; margin-bottom: 3px; }
    .attention-card-copy span { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .attention-count {
      flex: 0 0 auto;
      min-width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      padding: 0 8px;
    }
    .attention-count.danger { background: rgba(255, 100, 124, .14); color: var(--danger); }
    .attention-count.warning { background: rgba(255, 180, 92, .14); color: var(--warning); }
    .attention-count.success { background: rgba(61, 227, 164, .14); color: var(--success); }

    .attention-copy,
    .next-action-copy,
    .agent-mini-copy,
    .change-copy {
      min-width: 0;
      flex: 1;
    }

    .attention-copy strong,
    .next-action-copy strong,
    .agent-mini-copy strong,
    .change-copy strong {
      display: block;
      overflow: hidden;
      color: #d9eaf4;
      font-size: calc(10px * var(--font-scale));
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attention-copy span,
    .next-action-copy span,
    .agent-mini-copy span,
    .change-copy span {
      display: block;
      overflow: hidden;
      margin-top: 3px;
      color: var(--faint);
      font-size: calc(8px * var(--font-scale));
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attention-severity,
    .integration-badge {
      flex: 0 0 auto;
      padding: 4px 6px;
      border-radius: 999px;
      background: rgba(255, 180, 92, .08);
      color: var(--warning);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .mini-metric-row {
      display: grid;
      grid-template-columns: minmax(72px, .7fr) 1.5fr 48px;
      align-items: center;
      gap: 9px;
    }

    .mini-metric-row span {
      color: var(--muted);
      font-size: calc(9px * var(--font-scale));
      font-weight: 700;
    }

    .mini-metric-row strong {
      color: #e2f4fc;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: calc(10px * var(--font-scale));
      text-align: right;
    }

    .agent-state-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(61, 227, 164, .55);
    }

    .agent-state-dot.stopped {
      background: var(--faint);
      box-shadow: none;
    }

    .integration-state {
      min-height: 142px;
      justify-content: center;
      flex-direction: column;
      padding: 18px;
      border: 1px dashed rgba(125, 205, 255, .14);
      border-radius: 13px;
      background: rgba(5, 15, 27, .32);
      text-align: center;
    }

    .integration-state > i {
      margin-bottom: 12px;
      color: var(--cyan);
      font-size: 20px;
      opacity: .75;
    }

    .integration-state strong {
      font-size: calc(11px * var(--font-scale));
    }

    .integration-state p {
      max-width: 320px;
      margin: 6px 0 13px;
      color: var(--muted);
      font-size: calc(9px * var(--font-scale));
      line-height: 1.5;
    }

    .empty-widget {
      display: grid;
      min-height: 145px;
      place-items: center;
      color: var(--muted);
      font-size: calc(10px * var(--font-scale));
      text-align: center;
    }

    .customizer-panel {
      position: fixed;
      z-index: 180;
      top: 10px;
      right: 10px;
      bottom: 10px;
      width: min(390px, calc(100vw - 20px));
      overflow-y: auto;
      padding: 20px;
      border: 1px solid rgba(77, 208, 255, .2);
      border-radius: 20px;
      background: rgba(7, 20, 36, .98);
      box-shadow: -24px 0 90px rgba(0, 3, 10, .65);
      animation: assistantIn .28s var(--ease);
    }

    .customizer-section {
      padding: 15px 0;
      border-top: 1px solid rgba(125, 205, 255, .08);
    }

    .customizer-section:first-of-type {
      border-top: 0;
    }

    .customizer-section h3 {
      margin: 0 0 12px;
      color: #dfeff8;
      font-size: 12px;
    }

    .theme-control {
      margin-bottom: 13px;
    }

    .theme-value-row {
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 9px;
    }

    .theme-control input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    .color-input {
      width: 46px;
      height: 32px;
      padding: 2px;
      border: 1px solid rgba(125, 205, 255, .18);
      border-radius: 9px;
      background: rgba(5, 15, 27, .65);
    }

    .density-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .density-option {
      min-height: 38px;
      border: 1px solid rgba(125, 205, 255, .11);
      border-radius: 10px;
      background: rgba(5, 15, 27, .5);
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .density-option.active {
      border-color: rgba(49, 215, 255, .4);
      background: rgba(49, 215, 255, .09);
      color: var(--cyan-soft);
    }

    .guide-form {
      display: flex;
      gap: 7px;
    }

    .guide-form .form-control {
      min-width: 0;
      flex: 1;
    }

    .guide-result {
      margin-top: 10px;
      padding: 11px;
      border: 1px solid rgba(49, 215, 255, .12);
      border-radius: 11px;
      background: rgba(49, 215, 255, .045);
      color: var(--muted);
      font-size: 9px;
      line-height: 1.55;
    }

    .guide-result strong {
      display: block;
      margin-bottom: 4px;
      color: #dff5fc;
      font-size: 10px;
    }

    .catalog-modal {
      width: min(880px, 100%);
      max-height: min(780px, calc(100dvh - 40px));
      overflow-y: auto;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .catalog-item {
      display: flex;
      min-height: 142px;
      flex-direction: column;
      padding: 14px;
      border: 1px solid rgba(125, 205, 255, .1);
      border-radius: 13px;
      background: rgba(5, 15, 27, .45);
    }

    .catalog-item h3 {
      margin: 8px 0 5px;
      font-size: 12px;
    }

    .catalog-item p {
      flex: 1;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .catalog-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .palette-overlay {
      position: fixed;
      z-index: 210;
      inset: 0;
      display: flex;
      justify-content: center;
      padding: max(11vh, 72px) 16px 16px;
      background: rgba(1, 6, 13, .68);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      animation: fadeIn .18s ease;
    }

    .command-palette {
      width: min(640px, 100%);
      max-height: min(620px, calc(100dvh - 100px));
      align-self: flex-start;
      overflow: hidden;
      border: 1px solid rgba(77, 208, 255, .22);
      border-radius: 18px;
      background: rgba(7, 20, 36, .98);
      box-shadow: 0 34px 110px rgba(0, 3, 10, .75);
    }

    .palette-search {
      display: flex;
      min-height: 58px;
      align-items: center;
      padding: 0 17px;
      border-bottom: 1px solid rgba(125, 205, 255, .09);
      color: var(--cyan);
      gap: 11px;
    }

    .palette-search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: #e5f4fb;
      font-size: 16px;
    }

    .palette-results {
      max-height: 510px;
      overflow-y: auto;
      padding: 8px;
    }

    .palette-item {
      width: 100%;
      min-height: 49px;
      padding: 8px 10px;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      gap: 10px;
    }

    .palette-item:hover,
    .palette-item:focus-visible,
    .palette-item.active {
      background: rgba(49, 215, 255, .08);
      color: #e1f6ff;
    }

    .palette-caption {
      padding: 6px 10px 4px;
      color: var(--color-text-muted);
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .palette-risk {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      flex: 0 0 auto;
    }
    .palette-risk.security {
      color: var(--color-status-security);
      border: 1px solid rgba(167, 139, 250, .4);
    }
    .palette-risk.destructive {
      color: var(--color-status-critical);
      border: 1px solid rgba(255, 59, 92, .45);
    }
    .palette-actions {
      display: inline-flex;
      gap: 4px;
      margin-left: auto;
      flex: 0 0 auto;
    }
    .palette-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border: 1px solid rgba(126, 209, 255, .16);
      border-radius: 6px;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .palette-action.risk-security {
      color: var(--color-status-security);
      border-color: rgba(167, 139, 250, .35);
    }
    html[data-contrast="high"] .palette-item.active,
    html[data-contrast="high"] .palette-item:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 1px;
    }

    .palette-item > span:first-of-type {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: rgba(49, 215, 255, .07);
      color: var(--cyan);
    }

    .palette-copy {
      min-width: 0;
      flex: 1;
    }

    .palette-copy strong,
    .palette-copy small {
      display: block;
    }

    .palette-copy strong { font-size: 11px; }
    .palette-copy small { margin-top: 3px; color: var(--faint); font-size: 8px; }

    .palette-shortcut {
      color: var(--faint);
      font-family: monospace;
      font-size: 8px;
    }

    .toast {
      position: fixed;
      z-index: 220;
      right: 22px;
      bottom: 22px;
      display: flex;
      max-width: min(380px, calc(100vw - 28px));
      min-height: 50px;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid rgba(61, 227, 164, .22);
      border-radius: 13px;
      background: rgba(8, 27, 39, .97);
      box-shadow: 0 18px 60px rgba(0, 3, 10, .55);
      color: #cce8dc;
      font-size: 9px;
      line-height: 1.45;
      animation: toastIn .3s var(--ease);
      gap: 10px;
    }

    .toast i {
      color: var(--success);
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(.88); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-6px) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    @keyframes logIn {
      from { opacity: 0; background: rgba(49, 215, 255, .08); }
      to { opacity: 1; background: transparent; }
    }

    @keyframes assistantIn {
      from { opacity: 0; transform: translateX(18px) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes thinking {
      0%, 60%, 100% { opacity: .35; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes drawerIn {
      from { opacity: 0; transform: translateX(-22px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    @media (min-width: 1370px) {
      .main-shell.ai-open {
        margin-right: 392px;
      }
    }

    @media (min-width: 1370px) and (max-width: 1500px) {
      .main-shell.ai-open .metric-grid,
      .main-shell.ai-open .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .main-shell.ai-open .dashboard-layout,
      .main-shell.ai-open .split-layout,
      .main-shell.ai-open .security-layout {
        grid-template-columns: 1fr;
      }

      .main-shell.ai-open .node-grid,
      .main-shell.ai-open .bot-grid,
      .main-shell.ai-open .timeline,
      .main-shell.ai-open .perf-grid,
      .main-shell.ai-open .settings-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1180px) {
      .metric-grid,
      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .node-grid,
      .bot-grid,
      .perf-grid,
      .settings-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-layout,
      .split-layout,
      .security-layout {
        grid-template-columns: 1fr;
      }

      .activity-card {
        grid-column: auto;
      }

      .timeline {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .widget-shell,
      .widget-shell[data-size="compact"] {
        grid-column: span 6;
      }

      .widget-shell[data-size="wide"],
      .widget-shell[data-size="full"] {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 900px) {
      :root {
        --topbar: 64px;
      }

      .desktop-sidebar {
        display: none;
      }

      .main-shell {
        margin-left: 0;
      }

      .topbar {
        height: calc(var(--topbar) + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      }

      .icon-button.mobile-menu-button {
        display: inline-grid;
      }

      .breadcrumb small,
      .topbar-clock,
      .assistant-top-button span {
        display: none;
      }

      .global-status {
        width: 40px;
        min-height: 40px;
        justify-content: center;
        padding: 0;
        font-size: 0;
      }

      .assistant-top-button {
        display: none;
      }

      .assistant-fab {
        display: grid;
      }

      .content {
        padding: 24px 16px 50px;
      }

      .assistant-panel {
        top: auto;
        right: max(10px, env(safe-area-inset-right));
        bottom: calc(10px + env(safe-area-inset-bottom));
        left: max(10px, env(safe-area-inset-left));
        width: auto;
        max-height: calc(100vh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        max-height: min(760px, calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
        border-radius: 20px;
        animation-name: modalIn;
      }

      .assistant-messages {
        min-height: 180px;
      }

      .mission-summary {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .section-heading {
        align-items: flex-start;
        flex-direction: column;
        margin-bottom: 19px;
      }

      .heading-actions {
        width: 100%;
      }

      .heading-actions .primary-button,
      .heading-actions .secondary-button {
        flex: 1;
      }

      .metric-grid,
      .summary-grid,
      .fleet-strip,
      .node-grid,
      .bot-grid,
      .perf-grid,
      .settings-grid,
      .timeline {
        grid-template-columns: 1fr;
      }

      .metric-card {
        min-height: 166px;
      }

      .pipeline-flow {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .flow-step:not(:last-child)::after {
        position: absolute;
        top: 27px;
        bottom: -9px;
        left: 13px;
        width: 1px;
        height: auto;
        margin: 0;
      }

      .panel-card {
        padding: 15px;
      }

      .panel-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .table-card .panel-header {
        align-items: stretch;
      }

      .table-card .control-row {
        width: 100%;
      }

      .table-card .select-control {
        flex: 1;
      }

      .terminal-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .terminal-controls {
        width: 100%;
        overflow-x: auto;
      }

      .log-row {
        grid-template-columns: 56px 43px minmax(0, 1fr);
      }

      .log-source {
        display: none;
      }

      .topbar-right {
        gap: 6px;
      }

      .widget-shell,
      .widget-shell[data-size="compact"],
      .widget-shell[data-size="wide"],
      .widget-shell[data-size="full"] {
        grid-column: 1 / -1;
        min-height: 200px;
      }

      .catalog-grid {
        grid-template-columns: 1fr;
      }

      .customizer-panel {
        top: max(8px, env(safe-area-inset-top));
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        width: calc(100vw - 16px);
      }

      .topbar-right .icon-button {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }

      .breadcrumb strong {
        max-width: 128px;
      }
    }

    @media (max-width: 390px) {
      .topbar {
        padding-right: max(11px, env(safe-area-inset-right));
        padding-left: max(11px, env(safe-area-inset-left));
      }

      .topbar-left {
        gap: 8px;
      }

      .topbar-right .notification-wrap {
        display: none;
      }

      .content {
        padding-right: 12px;
        padding-left: 12px;
      }

      .section-heading h1 {
        font-size: 24px;
      }

      .metric-value {
        font-size: 25px;
      }

      .service-row {
        grid-template-columns: 84px 1fr auto;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ---- Mobile Command Center (focused drill-down, no tiny columns) ---- */
    @media (max-width: 760px) {
      .cc-grid { grid-template-columns: 1fr !important; gap: 10px; }
      .cc-module { padding: 13px 14px; }
      .cc-module-value { font-size: 19px; }
      .cc-module-actions button { padding: 11px 12px; font-size: 13px; flex: 1; }
      .cc-focus-mode { min-height: calc(100vh - 140px); }
    }

    /* Reassert visible focus on inputs that previously suppressed outlines.
       Placed last so it wins the specificity/source-order tie. */
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [contenteditable]:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    /* ---- OS foundation: agents workspace ---- */
    .agents-layout {
      display: grid;
      grid-template-columns: 268px minmax(0, 1fr);
      gap: var(--workspace-gap);
      align-items: start;
    }

    .agents-sidebar-card {
      position: sticky;
      top: calc(var(--topbar) + 16px);
    }

    .agents-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .agents-search {
      flex: 1 1 220px;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      padding: 8px 12px;
      color: var(--text);
    }

    .agents-search input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      color: var(--text);
      font-size: 14px;
    }

    .agents-search input::placeholder {
      color: var(--faint);
    }

    .agent-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--workspace-gap);
    }

    .agent-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agent-card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .agent-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(49, 215, 255, 0.18), rgba(167, 139, 250, 0.16));
      border: 1px solid var(--line-strong);
      color: var(--cyan);
      flex: none;
    }

    .agent-card h3 {
      margin: 0 0 2px;
      font-size: 15px;
      color: var(--text);
    }

    .agent-card p {
      margin: 0;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }

    .agent-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .agent-meta-row span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .agent-capabilities {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .agent-capability {
      font-size: 11px;
      color: var(--cyan-soft);
      background: rgba(49, 215, 255, 0.08);
      border: 1px solid rgba(49, 215, 255, 0.18);
      border-radius: 999px;
      padding: 3px 9px;
    }

    .agent-card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .agents-subnav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .agents-subnav button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: border-color var(--duration-fast) var(--motion-ease), color var(--duration-fast) var(--motion-ease), background var(--duration-fast) var(--motion-ease);
    }

    .agents-subnav button.active {
      color: var(--text);
      border-color: var(--line-strong);
      background: rgba(49, 215, 255, 0.08);
    }

    .agents-subnav button:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    .agents-count {
      font-size: 11px;
      color: var(--faint);
      font-weight: 600;
    }

    .agent-detail-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .return-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid rgba(126, 209, 255, .18);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(37, 43, 53, .9), rgba(23, 28, 37, .85));
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--depth-raised-1);
      transition: border-color .15s ease, box-shadow .15s ease, transform .06s ease;
    }
    .return-control:hover {
      border-color: rgba(49, 215, 255, .45);
    }
    .return-control:active {
      box-shadow: var(--depth-pressed);
      transform: translateY(1px);
    }

    .agent-detail-head .agent-avatar {
      width: 54px;
      height: 54px;
      font-size: 20px;
    }

    .agent-detail-head h2 {
      margin: 0;
      font-size: 20px;
      color: var(--text);
    }

    .agent-detail-head p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .agent-detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--workspace-gap);
    }

    .os-property-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .os-property {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .os-property:last-child {
      border-bottom: 0;
    }

    .os-property dt {
      color: var(--faint);
      flex: none;
    }

    .os-property dd {
      margin: 0;
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .os-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .os-list-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      cursor: pointer;
      transition: border-color var(--duration-fast) var(--motion-ease);
    }

    .os-list-row:hover {
      border-color: var(--line-strong);
    }

    .os-list-row:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    .os-list-row-main {
      flex: 1;
      min-width: 0;
    }

    .os-list-row-main strong {
      display: block;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 2px;
    }

    .os-list-row-main span {
      display: block;
      color: var(--muted);
      font-size: 12.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .os-list-row-side {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ---- Task graph ---- */
    .task-graph-wrap {
      position: relative;
      overflow-x: auto;
      overflow-y: auto;
      max-height: 520px;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--canvas-2);
      background-size: 26px 26px;
    }

    .task-graph {
      position: relative;
      min-width: 640px;
      padding: 24px;
    }

    .graph-node {
      position: absolute;
      width: 178px;
      background: var(--surface-strong);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-control);
      padding: 10px 12px;
      box-shadow: var(--elevation-popover);
      cursor: pointer;
      z-index: 1;
      transition: border-color var(--duration-fast) var(--motion-ease);
    }

    .graph-node:hover,
    .graph-node.selected {
      border-color: var(--cyan);
    }

    .graph-node.critical {
      border-color: var(--warning);
    }

    .graph-node .graph-node-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .graph-node .graph-node-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .graph-edge {
      position: absolute;
      height: 2px;
      background: var(--line-strong);
      transform-origin: left center;
      z-index: 0;
    }

    .graph-edge.critical {
      background: var(--warning);
    }

    .graph-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    .graph-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .graph-legend i {
      color: var(--muted);
    }

    /* ---- Council ---- */
    .council-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--workspace-gap);
    }

    .council-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .council-card h3 {
      margin: 0;
      font-size: 15px;
      color: var(--text);
    }

    .council-card p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .council-card .participants {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--cyan-soft);
    }

    .os-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-control);
    }

    .os-empty i {
      font-size: 26px;
      color: var(--faint);
    }

    .os-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--line);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: os-spin 0.8s linear infinite;
    }

    @keyframes os-spin {
      to { transform: rotate(360deg); }
    }

    .os-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--cyan-soft);
      background: rgba(49, 215, 255, 0.07);
      border: 1px solid rgba(49, 215, 255, 0.14);
      border-radius: 6px;
      padding: 2px 7px;
    }

    .os-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 0 0 10px;
    }

    .os-section-title i {
      color: var(--cyan);
    }

    .os-panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .os-inline-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .os-inline-form label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .os-inline-form label span {
      color: var(--faint);
      font-size: 11px;
    }

    .os-field {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      color: var(--text);
      padding: 9px 12px;
      font-size: 13.5px;
    }

    .os-textarea {
      min-height: 84px;
      resize: vertical;
    }

    .os-subnote {
      font-size: 12px;
      color: var(--faint);
      line-height: 1.45;
    }

    .os-button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .os-health-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .os-health-bar .os-health-fill {
      height: 8px;
      flex: 1;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
      min-width: 120px;
    }

    .os-health-bar .os-health-fill span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: var(--color-status-success);
      transition: width var(--duration-standard) var(--motion-ease);
    }

    .os-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .os-chip {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 9px;
    }

    .os-thread {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }

    .os-thread-item {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
    }

    .os-thread-item strong {
      font-size: 12.5px;
      color: var(--text);
    }

    .os-thread-item span {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }

    .os-thread-icon {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(167, 139, 250, 0.12);
      color: var(--purple);
    }

    .os-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
    }

    .os-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 560px;
    }

    .os-table th,
    .os-table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .os-table th {
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--surface-soft);
    }

    .os-table td {
      color: var(--text);
    }

    .os-table tr:last-child td {
      border-bottom: 0;
    }

    @media (max-width: 1024px) {
      .agents-layout {
        grid-template-columns: 1fr;
      }

      .agents-sidebar-card {
        position: static;
      }
    }

    /* ---- Knowledge layer (Memory / Files / Search / Context) ---- */
    .knowledge-layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .knowledge-sidebar {
      position: sticky;
      top: 72px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .knowledge-panel {
      min-width: 0;
    }

    .os-property-list.knowledge-dense .os-property {
      padding: 7px 0;
    }

    .knowledge-record {
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(10, 22, 39, 0.5);
      cursor: pointer;
      transition: border-color var(--duration-fast) var(--motion-ease), background var(--duration-fast) var(--motion-ease);
    }

    .knowledge-record:hover,
    .knowledge-record.selected {
      border-color: var(--line-strong);
      background: rgba(49, 215, 255, 0.06);
    }

    .knowledge-record-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .knowledge-record-head strong {
      color: var(--text);
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .knowledge-record p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .knowledge-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .knowledge-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(17, 34, 55, 0.5);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .knowledge-chip.tone-success { color: var(--success); border-color: rgba(61, 227, 164, 0.28); }
    .knowledge-chip.tone-warning { color: var(--warning); border-color: rgba(255, 180, 92, 0.28); }
    .knowledge-chip.tone-critical { color: var(--danger); border-color: rgba(255, 100, 124, 0.28); }
    .knowledge-chip.tone-info { color: var(--cyan); border-color: rgba(49, 215, 255, 0.28); }
    .knowledge-chip.tone-purple { color: var(--purple); border-color: rgba(167, 139, 250, 0.28); }

    .knowledge-search-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .knowledge-search-row .os-field {
      flex: 1;
    }

    .knowledge-results {
      margin-top: 4px;
    }

    .knowledge-group-title {
      margin: 18px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--faint);
      font-size: 11px;

        function openObjectRef(ref) {
          // Canonical Enterprise Object routing: every object resolves to the
          // correct JoeOS workspace without losing the selected object.
          var type = ref.object_type || ref.type;
