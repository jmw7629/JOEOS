<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>PROJECT_BYTE</title><style>
:root{--bg:#0b0d12;--panel:#121722;--card:#181f2c;--line:#283140;--txt:#eef2f7;--muted:#9aa7b8;--accent:#7cc4ff;--critical:#ff6b6b;--high:#ffb35c;--med:#7cc4ff;--low:#88d498}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:20px 18px 12px;position:sticky;top:0;background:rgba(11,13,18,.94);backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.toolbar input,.toolbar select,.toolbar button,.modal input,.modal select,.modal textarea{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;min-height:42px;padding:9px 11px;font:inherit}.toolbar input{flex:1;min-width:190px}.toolbar button,.modal button{cursor:pointer}.primary{background:#183d59!important;border-color:#2d78aa!important}.metrics{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:10px;padding:14px 18px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.metric b{display:block;font-size:22px}.metric span{color:var(--muted);font-size:12px}.scroll{overflow-x:auto;padding:0 18px 30px}.board{display:grid;grid-template-columns:repeat(5,minmax(260px,1fr));gap:12px;min-width:1380px}.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:420px}.colhead{display:flex;justify-content:space-between;align-items:center;padding:2px 3px 8px}.count{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:999px}.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--med);border-radius:12px;padding:11px;margin-bottom:9px}.task[data-p="Critical"]{border-left-color:var(--critical)}.task[data-p="High"]{border-left-color:var(--high)}.task[data-p="Low"]{border-left-color:var(--low)}.task h3{font-size:14px;margin:0 0 8px}.meta{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:999px}.note{color:#c7d0dc;font-size:13px;margin:9px 0}.actions{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px}.actions button,.actions select{background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:8px;min-height:34px;padding:5px}.modalwrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:10;align-items:center;justify-content:center;padding:18px}.modalwrap.open{display:flex}.modal{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.modal h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}.modal textarea{min-height:90px;resize:vertical}.row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.status{padding:0 18px 16px;color:var(--muted)}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.metric:last-child{grid-column:1/-1}}
</style></head><body><header><h1>PROJECT_BYTE</h1><p>JoeOS portfolio command board · shared live workspace</p><div class="toolbar"><input id="q" placeholder="Search projects, work, next actions"><select id="project"><option value="">All projects</option></select><select id="priority"><option value="">All priorities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select><button id="add" class="primary">+ Add work</button><button id="refresh">Refresh</button></div></header><section class="metrics"><div class="metric"><span>Total</span><b id="mt">0</b></div><div class="metric"><span>Active</span><b id="ma">0</b></div><div class="metric"><span>Blocked</span><b id="mb">0</b></div><div class="metric"><span>Critical</span><b id="mc">0</b></div><div class="metric"><span>Complete</span><b id="md">0%</b></div></section><div class="scroll"><main id="board" class="board"></main></div><div id="status" class="status" aria-live="polite"></div><div id="mw" class="modalwrap"><form id="form" class="modal"><h2>Add work item</h2><div class="grid"><label>Title<input id="title" maxlength="120" required></label><label>Project<input id="proj" maxlength="80" list="projects" required><datalist id="projects"></datalist></label><label>Status<select id="st"><option>Backlog</option><option>Active</option><option>Blocked</option><option>Review</option><option>Done</option></select></label><label>Priority<select id="pr"><option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option></select></label><label class="wide">Next action<textarea id="note" maxlength="500"></textarea></label></div><div class="row"><button type="button" id="cancel">Cancel</button><button class="primary">Create</button></div></form></div><script>
const S=['Backlog','Active','Blocked','Review','Done'];let tasks=[];const $=s=>document.querySelector(s);
async function api(url,opt){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.json()}
async function load(){try{tasks=(await api('/api/tasks')).tasks;syncProjects();render();$('#status').textContent='Live data loaded '+new Date().toLocaleTimeString()}catch(e){$('#status').textContent='Connection error: '+e.message}}
function syncProjects(){const ps=[...new Set(tasks.map(t=>t.project))].sort();const cur=$('#project').value;$('#project').innerHTML='<option value="">All projects</option>'+ps.map(p=>`<option>${p.replaceAll('&','&amp;').replaceAll('<','&lt;')}</option>`).join('');$('#project').value=ps.includes(cur)?cur:'';$('#projects').innerHTML=ps.map(p=>`<option value="${p.replaceAll('&','&amp;').replaceAll('"','&quot;')}">`).join('')}
function shown(){let q=$('#q').value.trim().toLowerCase(),p=$('#project').value,pr=$('#priority').value;return tasks.filter(t=>(!p||t.project===p)&&(!pr||t.priority===pr)&&(!q||[t.title,t.project,t.note,t.status,t.priority].join(' ').toLowerCase().includes(q)))}
function render(){const v=shown();$('#mt').textContent=tasks.length;$('#ma').textContent=tasks.filter(t=>t.status==='Active').length;$('#mb').textContent=tasks.filter(t=>t.status==='Blocked').length;$('#mc').textContent=tasks.filter(t=>t.priority==='Critical').length;$('#md').textContent=(tasks.length?Math.round(tasks.filter(t=>t.status==='Done').length/tasks.length*100):0)+'%';$('#board').innerHTML='';for(const s of S){const c=document.createElement('section');c.className='col';c.innerHTML=`<div class="colhead"><b>${s}</b><span class="count">${v.filter(t=>t.status===s).length}</span></div>`;for(const t of v.filter(t=>t.status===s))c.append(card(t));$('#board').append(c)}$('#status').textContent=`${v.length} of ${tasks.length} work items shown`}
function card(t){const e=document.createElement('article');e.className='task';e.dataset.p=t.priority;const h=document.createElement('h3');h.textContent=t.title;const m=document.createElement('div');m.className='meta';for(const x of [t.project,t.priority]){const z=document.createElement('span');z.className='pill';z.textContent=x;m.append(z)}const n=document.createElement('div');n.className='note';n.textContent=t.note||'No next action specified.';const a=document.createElement('div');a.className='actions';let left=document.createElement('button');left.type='button';left.textContent='←';left.disabled=S.indexOf(t.status)===0;left.onclick=()=>move(t,-1);let sel=document.createElement('select');S.forEach(s=>sel.add(new Option(s,s)));sel.value=t.status;sel.onchange=()=>patch(t.id,{status:sel.value});let right=document.createElement('button');right.type='button';right.textContent='→';right.disabled=S.indexOf(t.status)===S.length-1;right.onclick=()=>move(t,1);let del=document.createElement('button');del.type='button';del.textContent='×';del.title='Delete';del.onclick=()=>remove(t.id);a.append(left,sel,right,del);e.append(h,m,n,a);return e}
async function patch(id,d){try{await api('/api/tasks/'+id,{method:'PATCH',body:JSON.stringify(d)});await load()}catch(e){$('#status').textContent=e.message}}
function move(t,d){const i=S.indexOf(t.status),n=Math.max(0,Math.min(S.length-1,i+d));if(n!==i)patch(t.id,{status:S[n]})}
async function remove(id){if(!confirm('Delete this work item?'))return;try{await api('/api/tasks/'+id,{method:'DELETE'});await load()}catch(e){$('#status').textContent=e.message}}
$('#form').onsubmit=async e=>{e.preventDefault();try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('#title').value,project:$('#proj').value,status:$('#st').value,priority:$('#pr').value,note:$('#note').value})});$('#form').reset();$('#mw').classList.remove('open');await load()}catch(x){$('#status').textContent=x.message}};$('#add').onclick=()=>{$('#mw').classList.add('open');$('#title').focus()};$('#cancel').onclick=()=>$('#mw').classList.remove('open');$('#refresh').onclick=load;$('#q').oninput=render;$('#project').onchange=render;$('#priority').onchange=render;load();setInterval(load,30000);
</script></body></html>
