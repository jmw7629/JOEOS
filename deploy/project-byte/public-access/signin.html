<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · PROJECT_BYTE</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;color:#dce9f7;background:radial-gradient(ellipse at 50% 0,#123a59 0,transparent 60%),#050d18;font:15px/1.6 system-ui,sans-serif}.card{width:min(100%,440px);padding:32px;border:1px solid #294761;border-radius:20px;background:#091625ec;box-shadow:0 24px 100px #0008}.mark{width:56px;height:56px;border:1px solid #5bb6ee;border-radius:50%;margin-bottom:24px;background:radial-gradient(circle at 30% 25%,#56bbe5,#124b77 45%,#06121f 75%);box-shadow:0 0 40px #51b5ff30}.brand{font-size:11px;letter-spacing:.18em;color:#8cccf5}h1{font-size:27px;line-height:1.2;margin:10px 0 16px;font-weight:600}p{color:#a9bacd;margin:0 0 25px}label{display:block;font-size:13px;color:#dce9f7}input{width:100%;margin:9px 0 18px;min-height:48px;padding:12px;background:#06111e;border:1px solid #35536d;border-radius:9px;color:#fff;font:inherit}input:focus{outline:2px solid #6dc7ff;outline-offset:2px}button{width:100%;min-height:48px;border:1px solid #77bcf0;border-radius:9px;background:#176196;color:white;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.6}#message{min-height:26px;color:#f3c185;font-size:13px;margin:14px 0 0}.hint{font-size:12px;margin:20px 0 0;color:#8fa4b9}a{color:#8cccf5}@media(max-width:400px){body{padding:16px}.card{padding:25px}}
</style></head><body><main class="card"><div class="mark" aria-hidden="true"></div><div class="brand">PROJECT_BYTE</div><h1>Your command center</h1><p>Sign in to your live workspace.</p><form id="signin"><label for="key">Public access key</label><input id="key" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus><button type="submit">Sign in</button><p id="message" role="status" aria-live="polite"></p></form><p class="hint">Use your public owner key or existing collaborator access key. Your assigned permissions apply throughout the workspace.</p></main><script>
sessionStorage.removeItem('project_byte_access');sessionStorage.removeItem('pb_login_at');
document.querySelector('#signin').addEventListener('submit',async event=>{event.preventDefault();const input=document.querySelector('#key'),button=document.querySelector('button'),message=document.querySelector('#message'),key=input.value.trim();button.disabled=true;message.textContent='Signing in…';try{const response=await fetch('/_gateway/login',{method:'POST',headers:{'Content-Type':'application/json','X-Project-Byte-Gateway':'1'},body:JSON.stringify({key})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Sign-in is unavailable');input.value='';if('BroadcastChannel' in window){const channel=new BroadcastChannel('project-byte-public-session');channel.postMessage('changed');channel.close();}location.replace('/#home');}catch(error){message.textContent=error.message;button.disabled=false;}});
</script></body></html>
